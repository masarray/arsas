      <stop offset="0.5" stop-color="#13181d"/>
      <stop offset="0.82" stop-color="#39424b"/>
      <stop offset="1" stop-color="#0a0d10"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5560"/>
      <stop offset="1" stop-color="#1a2025"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f2f4"/>
      <stop offset="0.35" stop-color="#dadde1"/>
      <stop offset="0.72" stop-color="#c4c9d0"/>
      <stop offset="1" stop-color="#adb4bb"/>
    </linearGradient>
    <linearGradient id="displayBezel" x1="0" y1="0" x2="0" y2="1">
