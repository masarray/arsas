name: Device compatibility evidence
description: Report a bounded IEC 61850 service result for one device and ARSAS version.
title: "[Compatibility] "
labels: ["compatibility", "needs-evidence"]
body:
  - type: markdown
    attributes:
      value: |
        One issue = one bounded service result. A submission is not verified evidence and does not update the published matrix. Read the [evidence intake and maintainer review policy](https://github.com/masarray/arsas/blob/main/docs/evidence-intake-review.md) before posting. Remove credentials, private endpoints, customer/project names, confidential SCL, raw captures and disturbance records. Never upload a private file expecting maintainers to sanitize it in public.
  - type: input
    id: arsas-version
    attributes:
      label: ARSAS version
      placeholder: 1.6.18
    validations:
      required: true
  - type: input
    id: evidence-date
    attributes:
      label: Evidence or test date (YYYY-MM-DD)
      description: Use the actual test date, not the date this issue was filed.
      placeholder: 2026-09-22
    validations:
      required: true
  - type: dropdown
    id: evidence-kind
    attributes:
      label: Evidence type
      description: A pull request or implementation history alone is not proof of a new physical-relay test.
      options: [Sanitized field capture or test log, Sanitized ARSAS diagnostic and reproducible steps, Engineering or implementation history only, Planned test - no result yet]
    validations:
      required: true
  - type: input
    id: prior-profile
    attributes:
      label: Existing anonymized profile ID (if this is a retest)
      placeholder: field-profile-a-file-service
    validations:
      required: false
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2 x64
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device vendor, model and firmware
      description: Use anonymized identifiers when disclosure is not permitted.
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: IEC 61850 service under test
      options: [MMS association, Live model discovery, Reporting BRCB or URCB, FileDirectory or File transfer, GOOSE, SCL export, Direct or SBO control, Other]
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Observed result
      options: [Verified repeatedly, Conditional success, Observed once, Failed with known evidence, Not tested]
    validations:
      required: true
  - type: textarea
    id: expected-observed
    attributes:
      label: Expected versus observed behavior
      description: Give the exact positive or negative result for this service. For a planned test, state "Not tested - no result yet"; do not infer a pass.
      placeholder: "Expected: ... / Observed: ... / Failure or negative result: ..."
    validations:
      required: true
  - type: input
    id: public-evidence-link
    attributes:
      label: Public sanitized evidence link (optional)
      description: Link only to material you are authorized to publish. An implementation PR alone is not a field-test capture.
      placeholder: https://github.com/masarray/arsas/issues/...
    validations:
      required: false
  - type: textarea
    id: conditions
    attributes:
      label: Conditions and reproducible steps
      description: Include network boundary, permissions, object or service path and exact sequence.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste sanitized ARSAS text or attach a reviewed screenshot. For a planned test, write No capture yet. Never attach raw private captures, confidential SCL, credentials or disturbance records.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Evidence confirmation
      options:
        - label: I removed credentials, private endpoints and confidential project or device data.
          required: true
        - label: I understand this report is service-specific and is not IEC 61850 conformance certification.
          required: true
        - label: I understand an issue is a submission, not verified evidence; publication requires maintainer review and a separate registry PR.
          required: true
