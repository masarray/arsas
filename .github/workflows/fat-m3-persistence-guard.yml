name: FAT M3 persistence guard

on:
  push:
    branches:
      - fix/fat-workstation-convergence
    paths:
      - '.github/workflows/fat-m3-persistence-guard.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'masarray/arsas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fat-workstation-convergence
          fetch-depth: 0
      - name: Apply guarded ownership patch
        run: python3 tools/fat_m3_persistence_guard.py
      - name: Remove one-shot helpers
        run: |
          rm tools/fat_m3_persistence_guard.py
          rm .github/workflows/fat-m3-persistence-guard.yml
      - name: Commit generated source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "M3: fail closed on per-IED persistence restore"
          git push origin HEAD:fix/fat-workstation-convergence
