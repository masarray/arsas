name: FAT M3 deterministic view binding migration

on:
  push:
    branches:
      - fix/fat-workstation-convergence
    paths:
      - .github/workflows/fat-m3-view-binding.yml
      - tools/fat_m3_view_binding.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: fix/fat-workstation-convergence
          fetch-depth: 0

      - name: Apply guarded M3 view binding migration
        run: python tools/fat_m3_view_binding.py

      - name: Remove one-shot migration helpers
        run: |
          rm tools/fat_m3_view_binding.py
          rm .github/workflows/fat-m3-view-binding.yml

      - name: Commit M3 view binding changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make M3 Engineering IED view binding deterministic"
          git push origin HEAD:fix/fat-workstation-convergence
