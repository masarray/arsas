name: Smart Discovery Repeat-Run Stability

on:
  pull_request:
    paths:
      - "*.cs"
      - "**/*.cs"
      - "*.csproj"
      - "**/*.csproj"
      - "*.sln"
      - "**/*.sln"
      - "*.props"
      - "**/*.props"
      - "*.targets"
      - "**/*.targets"
      - "global.json"
      - "*.xaml"
      - "**/*.xaml"
      - "app.manifest"
      - "VERSION"
      - ".release/**"
      - ".github/workflows/**"
      - "Assets/**"
      - "Resources/**"
      - "installer/**"
      - "engine-patches/**"
      - "landing/release-notes*.json"
      - "landing/latest.json"
      - "engines/**"
      - "scripts/**"
      - "tests/**"
      - "evidence/**"
      - "docs/INTEROPERABILITY_REFERENCE_CONTRACT.md"
      - ".github/workflows/smart-discovery-*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-repeat-run-stability:
    name: Verify P0-5f repeat-run stability contract
    runs-on: windows-latest
    steps:
      - name: Checkout exact ARSAS candidate
        uses: actions/checkout@v7
        with:
          path: ArIED61850Tester
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate revision
        shell: powershell
        run: |
          $actual = (git -C .\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:GITHUB_SHA.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "ARSAS source revision mismatch. Expected $expected, checked out $actual."
          }

      - name: Validate P0-5f sources
        shell: powershell
        run: |
          $finalizer = '.\ArIED61850Tester\scripts\finalize-smart-discovery-repeat-run-stability.ps1'
          $bundleWriter = '.\ArIED61850Tester\scripts\new-smart-discovery-repeat-run-bundle.ps1'
          $authorityWriter = '.\ArIED61850Tester\scripts\new-smart-discovery-repeat-run-authority.ps1'
          $target = '.\ArIED61850Tester\evidence\smart-discovery-repeat-run-target.json'
          $runtime = '.\ArIED61850Tester\Services\NativeIec61850Client.SmartDiscoveryRepeatRunEvidence.cs'
          $test = '.\ArIED61850Tester\tests\ARSAS.Tests\SmartDiscoveryRepeatRunStabilityRegressionTests.cs'
          $doc = '.\ArIED61850Tester\docs\P0-5F_REPEAT_RUN_STABILITY_PROOF.md'
          foreach ($required in @($finalizer, $bundleWriter, $authorityWriter, $target, $runtime, $test, $doc)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "P0-5f source missing: $required" }
          }
          foreach ($script in @($finalizer, $bundleWriter, $authorityWriter)) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $messages = @($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parse failure in ${script}: $messages"
            }
          }
          $targetJson = Get-Content $target -Raw | ConvertFrom-Json
          if ($targetJson.Phase -ne 'P0-5f' -or $targetJson.MinimumIndependentAssociations -lt 3) {
            throw 'P0-5f target does not require at least three independent associations.'
          }
          if ($null -ne $targetJson.FinalizationAuthority) {
            throw 'CI source must not pre-populate physical FinalizationAuthority.'
          }

      - name: Execute P0-5f finalization fixtures
        shell: powershell
        run: |
          $root = '.\ArIED61850Tester'
          $results = Join-Path $root 'TestResults'
          New-Item -ItemType Directory -Force $results | Out-Null
          $finalizer = Join-Path $root 'scripts\finalize-smart-discovery-repeat-run-stability.ps1'
          $authorityWriter = Join-Path $root 'scripts\new-smart-discovery-repeat-run-authority.ps1'
          $repeatTarget = Join-Path $root 'evidence\smart-discovery-repeat-run-target.json'
          $semanticTarget = Join-Path $root 'evidence\smart-discovery-golden-target.json'
          $arsasCommit = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          $engineCommit = '4467124775d8d9d76f3db194f9fbfd97144767a8'

          $manifest = Join-Path $results 'SMART-CAPTURE-BUILD.txt'
          @(
            'ARSAS smart discovery field-capture build',
            "ARSAS commit: $arsasCommit",
            "ARIEC61850 commit: $engineCommit",
            'Engine PR: 134'
          ) | Set-Content $manifest -Encoding utf8
          $manifestHash = (Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $semanticHash = (Get-FileHash $semanticTarget -Algorithm SHA256).Hash.ToLowerInvariant()

          $lockPath = Join-Path $results 'P0-5E-fixture.lock.json'
          $lock = [ordered]@{
            SchemaVersion = 2
            Phase = 'P0-5e'
            Status = 'locked'
            DeviceIdentity = 'AA1E1F06R4'
            GoldenSource = [ordered]@{
              ArsasCommit = $arsasCommit
              EngineCommit = $engineCommit
              BuildManifestSha256 = $manifestHash
              SemanticTargetSha256 = $semanticHash
              RawCaptureReverified = $false
            }
            HardRequestBudget = [ordered]@{
              MaxConfirmedRequests = 4
              MaxPeakOutstandingRequests = 4
            }
          }
          $lock | ConvertTo-Json -Depth 12 | Set-Content $lockPath -Encoding utf8
          $goldenHash = (Get-FileHash $lockPath -Algorithm SHA256).Hash.ToLowerInvariant()

          function New-Bundle([int]$index, [long]$generation, [int]$requests = 4, [string]$kpi = 'kpi-a', [string]$directory = 'dir-a', [string]$projection = 'proj-a') {
            $captureHash = ('{0:x64}' -f (1000 + $index))
            $proofHash = ('{0:x64}' -f (2000 + $index))
            $runtimeHash = ('{0:x64}' -f (3000 + $index))
            [ordered]@{
              SchemaVersion = 1
              Phase = 'P0-5f-run-bundle'
              Verdict = 'PASS'
              DeviceIdentity = 'AA1E1F06R4'
              ArsasCommit = $arsasCommit
              EngineCommit = $engineCommit
              GoldenLockSha256 = $goldenHash
              BuildManifestSha256 = $manifestHash
              SemanticTargetSha256 = $semanticHash
              FixtureEvidence = $true
              Provenance = [ordered]@{
                CaptureSha256 = $captureHash
                ProofSha256 = $proofHash
                RuntimeEvidenceSha256 = $runtimeHash
              }
              Wire = [ordered]@{
                ConfirmedRequests = $requests
                ServiceCounts = [ordered]@{ GetNameList = 2; GetVariableAccessAttributes = 2 }
                PeakOutstandingRequests = 3
                DuplicateSemanticRequests = 0
                DuplicateGetNameListRequests = 0
                DuplicateGvaRequests = 0
                SecondGetNameListSweepDetected = $false
              }
              Runtime = [ordered]@{
                AssociationGeneration = $generation
                DirectoryModelSignature = $directory
                ProjectionSignature = $projection
                SmartDiscoveryKpi = [ordered]@{
                  TotalRequests = $requests
                  DuplicateRequests = 0
                  WireAccountingComplete = $true
                  DeterministicSignature = $kpi
                }
                TypeProbeBudget = [ordered]@{
                  DirectoryPoints = 4925
                  SuppliedLogicalNodeCandidates = 119
                  SuppressedNonLiveLogicalNodeCandidates = 0
                  LogicalNodeRequests = 119
                  PointsCoveredByLogicalNode = 4925
                  DataObjectRequests = 0
                  PointsCoveredByDataObject = 0
                  ExactLeafRequests = 0
                  SuppressedExactRepeatRequests = 0
                  PointsCoveredByExactLeaf = 0
                  RemainingUnresolvedPoints = 0
                  TotalPlannedRequests = 119
                }
                Model = [ordered]@{
                  LogicalDevices = 32
                  LogicalNodes = 119
                  SemanticPoints = 4925
                  ProjectedSignals = 4925
                  DataSets = 2
                  ReportControls = 34
                  BufferedReportControls = 2
                  UnbufferedReportControls = 32
                }
              }
            }
          }

          $bundlePaths = @()
          foreach ($i in 1..3) {
            $path = Join-Path $results "P0-5F-run-$i.json"
            (New-Bundle $i (100 + $i)) | ConvertTo-Json -Depth 18 | Set-Content $path -Encoding utf8
            $bundlePaths += $path
          }

          $passPath = Join-Path $results 'P0-5F-finalization-pass.json'
          & $finalizer -GoldenLockPath $lockPath -RepeatTargetPath $repeatTarget -RunBundlePaths $bundlePaths -OutputPath $passPath -AllowFixtureEvidence
          $pass = Get-Content $passPath -Raw | ConvertFrom-Json
          if ($pass.Verdict -ne 'PASS' -or $pass.SchemaVersion -ne 2 -or $pass.ObservedRunBundles -ne 3) {
            throw 'P0-5f stable three-run fixture did not PASS.'
          }
          if (@($pass.Consensus.AssociationGenerations | Sort-Object -Unique).Count -ne 3) {
            throw 'P0-5f PASS did not preserve three unique association generations.'
          }

          $fixturePromotionRejected = $false
          try {
            & $authorityWriter `
              -GoldenLockPath $lockPath `
              -RepeatTargetPath $repeatTarget `
              -FinalizationJson $passPath `
              -RunBundlePaths $bundlePaths `
              -OutputPath (Join-Path $results 'P0-5F-FORBIDDEN-fixture-authority.json')
          }
          catch {
            $fixturePromotionRejected = $_.Exception.Message -match 'fixture/non-reverified P0-5e golden lock'
          }
          if (-not $fixturePromotionRejected) {
            throw 'P0-5f fixture evidence was incorrectly promotable to physical authority.'
          }

          $reused = New-Bundle 3 102
          $reusedPath = Join-Path $results 'P0-5F-run-reused-generation.json'
          $reused | ConvertTo-Json -Depth 18 | Set-Content $reusedPath -Encoding utf8
          $reuseFailPath = Join-Path $results 'P0-5F-finalization-reused-generation-fail.json'
          & $finalizer -GoldenLockPath $lockPath -RepeatTargetPath $repeatTarget -RunBundlePaths @($bundlePaths[0], $bundlePaths[1], $reusedPath) -OutputPath $reuseFailPath -AllowFixtureEvidence -NoFailExit
          $reuseFail = Get-Content $reuseFailPath -Raw | ConvertFrom-Json
          if ($reuseFail.Verdict -ne 'FAIL' -or -not (@($reuseFail.AcceptanceFailures) -match 'reuses an association generation')) {
            throw 'P0-5f failed to reject reused association generation.'
          }

          $drift = New-Bundle 4 104 5 'kpi-b' 'dir-b' 'proj-b'
          $driftPath = Join-Path $results 'P0-5F-run-drift.json'
          $drift | ConvertTo-Json -Depth 18 | Set-Content $driftPath -Encoding utf8
          $driftFailPath = Join-Path $results 'P0-5F-finalization-drift-fail.json'
          & $finalizer -GoldenLockPath $lockPath -RepeatTargetPath $repeatTarget -RunBundlePaths @($bundlePaths[0], $bundlePaths[1], $driftPath) -OutputPath $driftFailPath -AllowFixtureEvidence -NoFailExit
          $driftFail = Get-Content $driftFailPath -Raw | ConvertFrom-Json
          if ($driftFail.Verdict -ne 'FAIL' -or
              -not (@($driftFail.AcceptanceFailures) -match 'Confirmed-request drift') -or
              -not (@($driftFail.AcceptanceFailures) -match 'deterministic-signature drift')) {
            throw 'P0-5f failed to reject repeat-run request/signature drift.'
          }

      - name: Upload P0-5f regression evidence and field toolkit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-p0-5f-repeat-run-toolkit
          path: |
            ArIED61850Tester\TestResults\P0-5F-*.json
            ArIED61850Tester\scripts\new-smart-discovery-repeat-run-bundle.ps1
            ArIED61850Tester\scripts\finalize-smart-discovery-repeat-run-stability.ps1
            ArIED61850Tester\scripts\new-smart-discovery-repeat-run-authority.ps1
            ArIED61850Tester\docs\P0-5F_REPEAT_RUN_STABILITY_PROOF.md
            ArIED61850Tester\evidence\smart-discovery-repeat-run-target.json
          if-no-files-found: warn
          retention-days: 14

  verify-golden-lock:
    name: Verify P0-5e evidence-derived hard budget
    runs-on: windows-latest
    steps:
      - name: Checkout exact ARSAS candidate
        uses: actions/checkout@v7
        with:
          path: ArIED61850Tester
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate revision
        shell: powershell
        run: |
          $actual = (git -C .\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:GITHUB_SHA.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "ARSAS source revision mismatch. Expected $expected, checked out $actual."
          }

      - name: Validate P0-5e production target remains evidence-gated
        shell: powershell
        run: |
          $targetPath = '.\ArIED61850Tester\evidence\smart-discovery-golden-target.json'
          $target = Get-Content $targetPath -Raw | ConvertFrom-Json
          if ($target.Phase -ne 'P0-5e' -or $target.Status -ne 'awaiting-fresh-physical-budget-lock') {
            throw 'P0-5e target state is invalid.'
          }
          if ($null -ne $target.BudgetAuthority.BudgetValues) {
            throw 'Production hard budget must not be populated by CI fixture values.'
          }
          if ($target.DeviceIdentity -ne 'AA1E1F06R4' -or
              $target.SemanticTarget.LogicalDevices -ne 32 -or
              $target.SemanticTarget.LogicalNodes -ne 119 -or
              $target.SemanticTarget.SemanticLeaves -ne 4925 -or
              $target.SemanticTarget.DataSets -ne 2 -or
              $target.SemanticTarget.OrderedFcdaMembers -ne 58 -or
              $target.SemanticTarget.LogicalReportControls -ne 32 -or
              $target.SemanticTarget.RuntimeReportControlInstances -ne 34) {
            throw 'P0-5e same-IED semantic target changed unexpectedly.'
          }

      - name: Execute P0-5e golden budget fixtures
        shell: powershell
        run: |
          $writer = '.\ArIED61850Tester\scripts\new-smart-discovery-golden-lock.ps1'
          $verifier = '.\ArIED61850Tester\scripts\verify-smart-discovery-golden-lock.ps1'
          $target = '.\ArIED61850Tester\evidence\smart-discovery-golden-target.json'
          foreach ($required in @($writer, $verifier, $target)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "P0-5e source missing: $required" }
          }

          foreach ($script in @($writer, $verifier)) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "PowerShell parse failure in $script" }
          }

          $results = '.\ArIED61850Tester\TestResults'
          New-Item -ItemType Directory -Force $results | Out-Null
          $capture = Join-Path $results 'p0-5e-fixture.pcapng'
          [IO.File]::WriteAllBytes($capture, [Text.Encoding]::UTF8.GetBytes('CI fixture only - not physical evidence'))

          $proofPath = Join-Path $results 'P0-5D-fixture-golden-source.json'
          $proof = [ordered]@{
            SchemaVersion = 1
            Phase = 'P0-5d'
            Verdict = 'PASS'
            AcceptanceFailures = @()
            ArsasCapture = [ordered]@{
              Capture = 'fixture'
              ClientIp = '192.0.2.10'
              ServerIp = '192.0.2.20'
              RequestTcpStreams = @('0')
              ConfirmedRequests = 4
              ConfirmedResponsesOrErrors = 4
              ServiceCounts = [ordered]@{
                GetNameList = 2
                GetVariableAccessAttributes = 2
              }
              DuplicateSemanticRequests = 0
              DuplicateGetNameListRequests = 0
              DuplicateGvaRequests = 0
              DuplicateDetails = @()
              SecondGetNameListSweepDetected = $false
              PeakOutstandingRequests = 3
              NegotiatedMaxOutstandingCalling = 10
              InvokeIdReuseWhileOutstanding = 0
              OrphanResponses = 0
              UnansweredRequestsAtCaptureEnd = 0
            }
          }
          $proof | ConvertTo-Json -Depth 12 | Set-Content $proofPath -Encoding utf8

          $arsasCommit = (git -C .\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant()
          $engineCommit = '4467124775d8d9d76f3db194f9fbfd97144767a8'
          $manifest = Join-Path $results 'SMART-CAPTURE-BUILD.txt'
          @(
            'ARSAS smart discovery field-capture build',
            "ARSAS commit: $arsasCommit",
            "ARIEC61850 commit: $engineCommit",
            'Engine PR: 134'
          ) | Set-Content $manifest -Encoding utf8

          $lockPath = Join-Path $results 'P0-5E-fixture-golden.lock.json'
          & $writer `
            -ProofJson $proofPath `
            -CapturePath $capture `
            -DeviceIdentity 'AA1E1F06R4' `
            -ArsasCommit $arsasCommit `
            -EngineCommit $engineCommit `
            -TargetPath $target `
            -BuildManifestPath $manifest `
            -OutputPath $lockPath `
            -AllowFixtureEvidence

          $lock = Get-Content $lockPath -Raw | ConvertFrom-Json
          if ($lock.Status -ne 'locked' -or
              $lock.SchemaVersion -ne 2 -or
              $lock.HardRequestBudget.MaxConfirmedRequests -ne 4 -or
              $lock.HardRequestBudget.MaxServiceRequests.GetNameList -ne 2 -or
              $lock.HardRequestBudget.MaxServiceRequests.GetVariableAccessAttributes -ne 2 -or
              $lock.GoldenSource.CaptureSha256 -notmatch '^[0-9a-f]{64}$' -or
              $lock.GoldenSource.ProofSha256 -notmatch '^[0-9a-f]{64}$' -or
              $lock.GoldenSource.BuildManifestSha256 -notmatch '^[0-9a-f]{64}$' -or
              $lock.GoldenSource.SemanticTargetSha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'P0-5e lock writer did not derive the expected fixture budget/provenance.'
          }

          $acceptPath = Join-Path $results 'P0-5E-fixture-accept-pass.json'
          & $verifier `
            -LockPath $lockPath `
            -ProofJson $proofPath `
            -DeviceIdentity 'AA1E1F06R4' `
            -CandidateArsasCommit $arsasCommit `
            -CandidateEngineCommit $engineCommit `
            -TargetPath $target `
            -OutputJson $acceptPath
          $accept = Get-Content $acceptPath -Raw | ConvertFrom-Json
          if ($accept.Verdict -ne 'PASS') { throw 'P0-5e golden fixture should pass its own lock.' }

          $growthProofPath = Join-Path $results 'P0-5D-fixture-growth.json'
          $growth = Get-Content $proofPath -Raw | ConvertFrom-Json
          $growth.ArsasCapture.ConfirmedRequests = 5
          $growth.ArsasCapture.ServiceCounts.GetVariableAccessAttributes = 3
          $growth | ConvertTo-Json -Depth 12 | Set-Content $growthProofPath -Encoding utf8
          $growthAcceptPath = Join-Path $results 'P0-5E-fixture-growth-rejected.json'
          & $verifier `
            -LockPath $lockPath `
            -ProofJson $growthProofPath `
            -DeviceIdentity 'AA1E1F06R4' `
            -CandidateArsasCommit $arsasCommit `
            -CandidateEngineCommit $engineCommit `
            -TargetPath $target `
            -OutputJson $growthAcceptPath `
            -NoFailExit
          $growthAcceptance = Get-Content $growthAcceptPath -Raw | ConvertFrom-Json
          if ($growthAcceptance.Verdict -ne 'FAIL' -or
              -not (@($growthAcceptance.AcceptanceFailures) -match 'Confirmed request budget exceeded')) {
            throw 'P0-5e failed to reject confirmed-request growth.'
          }

          $serviceProofPath = Join-Path $results 'P0-5D-fixture-unexpected-service.json'
          $serviceGrowth = Get-Content $proofPath -Raw | ConvertFrom-Json
          $serviceGrowth.ArsasCapture.ServiceCounts | Add-Member -NotePropertyName Read -NotePropertyValue 1
          $serviceGrowth | ConvertTo-Json -Depth 12 | Set-Content $serviceProofPath -Encoding utf8
          $serviceAcceptPath = Join-Path $results 'P0-5E-fixture-unexpected-service-rejected.json'
          & $verifier `
            -LockPath $lockPath `
            -ProofJson $serviceProofPath `
            -DeviceIdentity 'AA1E1F06R4' `
            -CandidateArsasCommit $arsasCommit `
            -CandidateEngineCommit $engineCommit `
            -TargetPath $target `
            -OutputJson $serviceAcceptPath `
            -NoFailExit
          $serviceAcceptance = Get-Content $serviceAcceptPath -Raw | ConvertFrom-Json
          if ($serviceAcceptance.Verdict -ne 'FAIL' -or
              -not (@($serviceAcceptance.AcceptanceFailures) -match "Unexpected MMS service 'Read'")) {
            throw 'P0-5e failed to reject an unexpected MMS service.'
          }

      - name: Upload P0-5e regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-p0-5e-golden-budget-fixtures
          path: ArIED61850Tester\TestResults\P0-5E-*.json
          if-no-files-found: warn
          retention-days: 14

  verify-provenance:
    name: Verify P0-5e capture build and target provenance
    runs-on: windows-latest
    steps:
      - name: Checkout exact ARSAS candidate
        uses: actions/checkout@v7
        with:
          path: ArIED61850Tester
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate revision
        shell: powershell
        run: |
          $actual = (git -C .\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:GITHUB_SHA.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "ARSAS source revision mismatch. Expected $expected, checked out $actual."
          }

      - name: Execute P0-5e provenance fixtures
        shell: powershell
        run: |
          $writer = '.\ArIED61850Tester\scripts\new-smart-discovery-golden-lock.ps1'
          $verifier = '.\ArIED61850Tester\scripts\verify-smart-discovery-golden-lock.ps1'
          $target = '.\ArIED61850Tester\evidence\smart-discovery-golden-target.json'
          foreach ($required in @($writer, $verifier, $target)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Missing P0-5e provenance source: $required" }
          }

          foreach ($script in @($writer, $verifier)) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "PowerShell parse failure in $script" }
          }

          $results = '.\ArIED61850Tester\TestResults'
          New-Item -ItemType Directory -Force $results | Out-Null
          $capture = Join-Path $results 'p0-5e-provenance-fixture.pcapng'
          [IO.File]::WriteAllBytes($capture, [Text.Encoding]::UTF8.GetBytes('CI fixture only - never physical authority'))

          $arsasCommit = (git -C .\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant()
          $engineCommit = '4467124775d8d9d76f3db194f9fbfd97144767a8'
          $manifest = Join-Path $results 'SMART-CAPTURE-BUILD.txt'
          @(
            'ARSAS smart discovery field-capture build',
            "ARSAS commit: $arsasCommit",
            "ARIEC61850 commit: $engineCommit",
            'Engine PR: 134'
          ) | Set-Content $manifest -Encoding utf8

          $proofPath = Join-Path $results 'P0-5D-provenance-source.json'
          $proof = [ordered]@{
            SchemaVersion = 1
            Phase = 'P0-5d'
            Verdict = 'PASS'
            AcceptanceFailures = @()
            ArsasCapture = [ordered]@{
              Capture = 'fixture'
              ClientIp = '192.0.2.10'
              ServerIp = '192.0.2.20'
              RequestTcpStreams = @('0')
              ConfirmedRequests = 4
              ConfirmedResponsesOrErrors = 4
              ServiceCounts = [ordered]@{
                GetNameList = 2
                GetVariableAccessAttributes = 2
              }
              DuplicateSemanticRequests = 0
              DuplicateGetNameListRequests = 0
              DuplicateGvaRequests = 0
              DuplicateDetails = @()
              SecondGetNameListSweepDetected = $false
              PeakOutstandingRequests = 3
              NegotiatedMaxOutstandingCalling = 10
              InvokeIdReuseWhileOutstanding = 0
              OrphanResponses = 0
              UnansweredRequestsAtCaptureEnd = 0
            }
          }
          $proof | ConvertTo-Json -Depth 12 | Set-Content $proofPath -Encoding utf8

          $lockPath = Join-Path $results 'P0-5E-provenance.lock.json'
          & $writer `
            -ProofJson $proofPath `
            -CapturePath $capture `
            -DeviceIdentity 'AA1E1F06R4' `
            -ArsasCommit $arsasCommit `
            -EngineCommit $engineCommit `
            -TargetPath $target `
            -BuildManifestPath $manifest `
            -OutputPath $lockPath `
            -AllowFixtureEvidence

          $lock = Get-Content $lockPath -Raw | ConvertFrom-Json
          if ($lock.SchemaVersion -ne 2 -or
              $lock.GoldenSource.BuildManifestSha256 -notmatch '^[0-9a-f]{64}$' -or
              $lock.GoldenSource.SemanticTargetSha256 -notmatch '^[0-9a-f]{64}$' -or
              $lock.GoldenSource.RawCaptureReverified) {
            throw 'Fixture lock did not carry expected P0-5e provenance metadata.'
          }

          $acceptPath = Join-Path $results 'P0-5E-provenance-pass.json'
          & $verifier `
            -LockPath $lockPath `
            -ProofJson $proofPath `
            -DeviceIdentity 'AA1E1F06R4' `
            -CandidateArsasCommit $arsasCommit `
            -CandidateEngineCommit $engineCommit `
            -TargetPath $target `
            -OutputJson $acceptPath
          $accept = Get-Content $acceptPath -Raw | ConvertFrom-Json
          if ($accept.Verdict -ne 'PASS') { throw 'Exact build/target fixture should pass the golden provenance lock.' }

          $wrongArsas = '1111111111111111111111111111111111111111'
          $mismatchPath = Join-Path $results 'P0-5E-provenance-arsas-mismatch.json'
          & $verifier `
            -LockPath $lockPath `
            -ProofJson $proofPath `
            -DeviceIdentity 'AA1E1F06R4' `
            -CandidateArsasCommit $wrongArsas `
            -CandidateEngineCommit $engineCommit `
            -TargetPath $target `
            -OutputJson $mismatchPath `
            -NoFailExit
          $mismatch = Get-Content $mismatchPath -Raw | ConvertFrom-Json
          if ($mismatch.Verdict -ne 'FAIL' -or
              -not (@($mismatch.AcceptanceFailures) -match 'Candidate ARSAS commit differs')) {
            throw 'P0-5e did not reject ARSAS build identity drift.'
          }

          $alteredTarget = Join-Path $results 'altered-target.json'
          $changed = Get-Content $target -Raw | ConvertFrom-Json
          $changed.SemanticTarget.LogicalNodes = 120
          $changed | ConvertTo-Json -Depth 12 | Set-Content $alteredTarget -Encoding utf8
          $targetMismatchPath = Join-Path $results 'P0-5E-provenance-target-mismatch.json'
          & $verifier `
            -LockPath $lockPath `
            -ProofJson $proofPath `
            -DeviceIdentity 'AA1E1F06R4' `
            -CandidateArsasCommit $arsasCommit `
            -CandidateEngineCommit $engineCommit `
            -TargetPath $alteredTarget `
            -OutputJson $targetMismatchPath `
            -NoFailExit
          $targetMismatch = Get-Content $targetMismatchPath -Raw | ConvertFrom-Json
          if ($targetMismatch.Verdict -ne 'FAIL' -or
              -not (@($targetMismatch.AcceptanceFailures) -match 'Semantic target hash differs')) {
            throw 'P0-5e did not reject semantic-target authority drift.'
          }

      - name: Upload P0-5e provenance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-p0-5e-golden-provenance-fixtures
          path: ArIED61850Tester\TestResults\P0-5E-*.json
