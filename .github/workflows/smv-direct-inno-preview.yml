name: Direct Inno SMV Preview EXE

# Publish a direct tested installer EXE. Consume a sealed canonical CI artifact
# internally to avoid duplicate full builds; never distribute its ZIP to users.
# Trusted, narrowly scoped branch only. Stable release is never modified.
on:
  push:
    branches: [feat/smv-sharp-latest-p0-20261022, fix/smv-arstack-actual-wire-interop-20261022]

permissions:
  contents: write
  actions: read

concurrency:
  group: smv-inno-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-preview:
    if: github.repository == 'masarray/arsas' && (github.ref == 'refs/heads/feat/smv-sharp-latest-p0-20261022' || github.ref == 'refs/heads/fix/smv-arstack-actual-wire-interop-20261022')
    runs-on: windows-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: powershell
    steps:
      - name: Fetch exact public GitHub source with fail-closed SHA check
        run: |
          git clone --quiet --depth 1 --single-branch --branch $env:GITHUB_REF_NAME "https://github.com/$env:GITHUB_REPOSITORY.git" ArIED61850Tester
          if ($LASTEXITCODE -ne 0) { throw 'Exact public SMV branch checkout failed.' }
          if ((git -C .\\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant() -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw 'Branch advanced during fetch; refuse stale installer source.'
          }

      - name: Validate SHA and immutable engine/native locks
        run: |
          $actual = (git -C .\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Source SHA mismatch.' }
          $iec = Get-Content .\ArIED61850Tester\engines\ARIEC61850.lock.json -Raw | ConvertFrom-Json
          $native = Get-Content .\ArIED61850Tester\engines\ARDIREC.lock.json -Raw | ConvertFrom-Json
          if ($iec.repository -ne 'masarray/ARIEC61850' -or $iec.commit -notmatch '^[0-9a-f]{40}$' -or $native.repository -ne 'masarray/ardirec' -or $native.commit -notmatch '^[0-9a-f]{40}$' -or $native.bridge.abi -ne 1 -or $native.bridge.mode -ne 'native-only') { throw 'Engine lock invalid.' }
          [xml]$props = Get-Content .\ArIED61850Tester\Directory.Build.props -Raw
          [xml]$project = Get-Content .\ArIED61850Tester\ArIED61850Tester.csproj -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $version -ne [string]$project.Project.PropertyGroup.Version -or $version -ne (Get-Content .\ArIED61850Tester\VERSION -Raw).Trim()) { throw 'Inconsistent app version.' }
          $short = $actual.Substring(0,12)
          "ARSAS_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMV_VERSION=$version-smvpreview.$short" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMV_TAG=smv-preview-$short" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ARIEC_SHA=$($iec.commit)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ARDIREC_SHA=$($native.commit)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enforce source and license boundaries
        run: .\ArIED61850Tester\scripts\verify-source-clean.ps1

      - name: Validate Inno packaging PowerShell syntax before expensive build
        run: |
          $tokens = $null
          $errors = $null
          $scriptPath = (Resolve-Path .\ArIED61850Tester\scripts\build-windows-installer.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ("Invalid installer PowerShell syntax: " + ($errors | ForEach-Object Message | Out-String)) }

      - name: Validate canonical package verifier safety cases
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python is required for package validation.' }
          python .\\ArIED61850Tester\\scripts\\test-ci-package-reuse.py
          if ($LASTEXITCODE -ne 0) { throw 'Canonical package verifier tests failed.' }

      - name: Materialize exact-head, hash-verified canonical Windows package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'smv-canonical-windows-package'
          $proofFile = Join-Path $env:RUNNER_TEMP 'smv-canonical-proof.json'
          python .\\ArIED61850Tester\\scripts\\verify-ci-package-reuse.py `
            --repository $env:GITHUB_REPOSITORY `
            --head-branch $env:GITHUB_REF_NAME `
            --head-sha $env:GITHUB_SHA `
            --source-sha $env:GITHUB_SHA `
            --engine-sha $env:ARIEC_SHA `
            --ardirec-sha $env:ARDIREC_SHA `
            --event-name push `
            --wait-seconds 1200 `
            --allow-in-progress-artifact `
            --require-native-ctest-proof `
            --output-dir $root `
            --proof-output $proofFile
          if ($LASTEXITCODE -ne 0) { throw 'No exact-head canonical Windows package authority.' }
          $proof = Get-Content $proofFile -Raw | ConvertFrom-Json
          if ($proof.sourceSha -ne $env:GITHUB_SHA -or $proof.engineSha -ne $env:ARIEC_SHA -or
              $proof.ardirecSha -ne $env:ARDIREC_SHA -or $proof.version -ne $env:ARSAS_VERSION -or
              [int]$proof.failed -ne 0 -or [int]$proof.notExecuted -ne 0 -or
              [int]$proof.passed -lt 1 -or [bool]$proof.releasePromotionAuthority) {
            throw 'Canonical package identity/full-regression acceptance failed.'
          }
          $inputDir = Join-Path $root ($proof.installerInputRoot -replace '/', '\\')
          $testAssembly = Join-Path $root ($proof.testAssemblyPath -replace '/', '\\')
          $comtrade = Join-Path $root ($proof.comtradeFixturePath -replace '/', '\\')
          $locus = Join-Path $root ($proof.locusFixturePath -replace '/', '\\')
          foreach ($required in @($inputDir, $testAssembly, $comtrade, $locus)) {
            if (-not (Test-Path $required)) { throw "Canonical package file missing: $required" }
          }
          "SMV_INPUT_DIR=$inputDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMV_TEST_ASSEMBLY=$testAssembly" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMV_COMTRADE_FIXTURE=$comtrade" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMV_LOCUS_FIXTURE=$locus" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMV_PACKAGE_RUN=$($proof.canonicalRunId)/$($proof.canonicalRunAttempt)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMV_PACKAGE_SHA256=$($proof.artifactSha256)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Exact-head canonical Windows package verified: $($proof.passed) regression tests PASS."

      - name: Ensure Inno Setup 6
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }

      - name: Compile tested Inno Setup executable directly (no ZIP)
        run: |
          & .\ArIED61850Tester\scripts\build-windows-installer.ps1 -Version $env:SMV_VERSION -Runtime win-x64 -PublishedDirectory $env:SMV_INPUT_DIR -OutputDirectory "$env:GITHUB_WORKSPACE\ArIED61850Tester\dist" -TestAssemblyPath $env:SMV_TEST_ASSEMBLY -FixtureCfg $env:SMV_COMTRADE_FIXTURE -LocusFixtureCfg $env:SMV_LOCUS_FIXTURE
          if ($LASTEXITCODE -ne 0) { throw 'Installer build or pre-package bridge smoke failed.' }

      - name: Silent install, installed-runtime smoke and uninstall
        run: |
          $exe = ".\ArIED61850Tester\dist\ARSAS-$env:SMV_VERSION-win-x64-setup.exe"
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'Installer missing.' }
          # Reproduce the actual customer upgrade location and UAC mode.
          # A protected Program Files folder exposes issues missed by RUNNER_TEMP.
          $target = Join-Path $env:ProgramFiles 'ARSAS-SMV-Preview-CI'
          # Start-Process joins argument elements: embed quotes inside /DIR so
          # "C:\Program Files\..." reaches Inno Setup as exactly ONE parameter.
          $dirArgument = '/DIR="' + $target + '"'
          $params = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CLOSEAPPLICATIONS',$dirArgument)
          $install = Start-Process -FilePath $exe -ArgumentList $params -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Protected-folder install failed: $($install.ExitCode)." }
          if (-not (Test-Path (Join-Path $target 'ARSAS.exe') -PathType Leaf)) {
            throw "Silent install did not use requested Program Files directory: $target"
          }
          # Existing releases may include Accessibility.dll, while later releases
          # do not. Test the exact shipped bytes of a real private DLL.
          $legacyAccessibility = Join-Path $target 'Accessibility.dll'
          $publishedAccessibility = Join-Path $env:SMV_INPUT_DIR "Accessibility.dll"
          if (-not (Test-Path $legacyAccessibility) -and -not (Test-Path $publishedAccessibility)) {
            [System.IO.File]::WriteAllBytes($legacyAccessibility, [byte[]](65,82,83,65,83,83,45,79,76,68))
            Write-Host 'Seeded a legacy Accessibility.dll as a prior-install fixture.'
          }
          $repairName = if (Test-Path $publishedAccessibility -PathType Leaf) { 'Accessibility.dll' } else { 'AR.Iec61850.Transports.Npcap.dll' }
          $repairPath = Join-Path $target $repairName
          if (-not (Test-Path $repairPath -PathType Leaf)) { throw "Shipped upgrade-test DLL is missing: $repairName" }
          $expectedHash = (Get-FileHash $repairPath -Algorithm SHA256).Hash
          [System.IO.File]::WriteAllBytes($repairPath, [byte[]](65,82,83,65,83,45,79,76,68,45,68,76,76))
          $upgrade = Start-Process -FilePath $exe -ArgumentList $params -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "In-place Program Files upgrade failed: $($upgrade.ExitCode)." }
          $actualHash = (Get-FileHash $repairPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "Upgrade did not restore shipped DLL: $repairName" }
          Write-Host "SMART_INNO_UPGRADE_PASS: Protected Program Files upgrade restored exact $repairName bytes."
          foreach ($file in @('ARSAS.exe','AR.Iec61850.Transports.Npcap.dll','SharpPcap.dll','PacketDotNet.dll','Tools\ArdIrec\ardirec_bridge.dll')) {
            if (-not (Test-Path (Join-Path $target $file) -PathType Leaf)) { throw "Installed runtime missing: $file" }
          }
          $env:ARSAS_ARDIREC_BRIDGE_PATH = Join-Path $target 'Tools\ArdIrec\ardirec_bridge.dll'
          $env:ARSAS_NATIVE_COMTRADE_TEST_CFG = $env:SMV_COMTRADE_FIXTURE
          $env:ARSAS_NATIVE_LOCUS_TEST_CFG = $env:SMV_LOCUS_FIXTURE
          dotnet vstest $env:SMV_TEST_ASSEMBLY '--TestCaseFilter:FullyQualifiedName~ArdIrecNativeBridgeIntegrationTests|FullyQualifiedName~ArdIrecLocusNativeSessionIntegrationTests'
          if ($LASTEXITCODE -ne 0) { throw 'Installed native runtime smoke failed.' }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)." }

      - name: Publish immutable GitHub prerelease with direct EXE asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = "$env:GITHUB_WORKSPACE\ArIED61850Tester\dist"
          $exe = Join-Path $dist "ARSAS-$env:SMV_VERSION-win-x64-setup.exe"
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'Validated installer missing.' }
          $name = Split-Path $exe -Leaf
          $sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = Join-Path $dist 'SHA256SUMS.txt'
          "$sha256  $name" | Set-Content $sums -Encoding ascii
          $provenance = Join-Path $dist 'SMV-PREVIEW-PROVENANCE.json'
          @{sourceSha=$env:GITHUB_SHA;engineSha=$env:ARIEC_SHA;ardirecSha=$env:ARDIREC_SHA;canonicalPackageRun=$env:SMV_PACKAGE_RUN;canonicalPackageSha256=$env:SMV_PACKAGE_SHA256;installer=$name;installerSha256=$sha256;installedSmokePassed=$true;channel='engineering-preview'} | ConvertTo-Json | Set-Content $provenance -Encoding utf8
          $notes = Join-Path $dist 'SMV-PREVIEW-NOTES.md'
          @("# ARSAS SMV Preview $env:SMV_VERSION",'','Direct Inno Setup EXE, without any workflow ZIP artifact.','Exact-SHA canonical Build ARSAS regression/native CTest plus direct Inno install, upgrade, installed smoke and uninstall passed.','Raw SMV channels are not calibrated voltage/current. Physical merging-unit acceptance remains pending.','Npcap must be installed separately. Authenticode signing is not asserted.',"Source: $env:GITHUB_SHA","SHA256: $sha256") | Set-Content $notes -Encoding utf8
          # gh release create refuses to create a second release with an existing
          # tag. Do not probe a missing release with a failing native CLI command:
          # Windows PowerShell 5.1 treats its stderr as a terminating error.
          gh release create $env:SMV_TAG $exe $sums $provenance --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ARSAS SMV Preview $env:SMV_VERSION" --notes-file $notes --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Direct release upload failed.' }
          $verified = gh release view $env:SMV_TAG --repo $env:GITHUB_REPOSITORY --json tagName,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $verified.isPrerelease -or $verified.tagName -ne $env:SMV_TAG -or -not ($verified.assets | Where-Object { $_.name -eq $name })) { throw 'Release asset verification failed.' }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:SMV_TAG/$name"
          "Direct Inno Setup EXE: $url" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Installer SHA-256: $sha256" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "DIRECT_INSTALLER_EXE=$url"
