name: ARSAS targeted control and analyzer fix

on:
  push:
    branches:
      - fix/real-ied-feedback-smooth-analyzers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Strict IEC 61850 control/process separation: never inject command result into monitored stVal.
          replace_exact(
              'Services/Iec61850MonitorRuntime.cs',
              '''        if (!request.TestMode && result.FeedbackConfirmed && !string.IsNullOrWhiteSpace(result.FeedbackValue) && result.FeedbackValue != "-")\n            ApplyControlFeedbackToMonitor(session, request.Signal, result.FeedbackValue);\n\n''',
              '''        // IMPORTANT: a successful/confirmed IEC 61850 control service is command-path evidence,\n        // not process-image authority. Never synthesize or inject stVal from Operate/SBO feedback here.\n        // The monitored state changes only through the independent acquisition path (RCB/report or\n        // an explicit authoritative MMS read performed by the monitor), matching IED engineering tools.\n\n''')

          # 2) Command window must not display the command result as if it were the actual process position.
          replace_exact(
              'ControlCommandWindow.xaml.cs',
              '''            CommandStage = result.Stage;\n            CommandStatus = BuildCommandResultText(result);\n            if (!string.IsNullOrWhiteSpace(result.FeedbackValue) && result.FeedbackValue != "-")\n                CurrentValue = result.FeedbackValue;\n            SetResultTone(result.IsSuccess ? "Success" : "Error");\n''',
              '''            CommandStage = result.IsSuccess && !TestMode ? "Command accepted" : result.Stage;\n            CommandStatus = BuildCommandResultText(result);\n            if (result.IsSuccess && !TestMode)\n            {\n                CommandStatus += " Command accepted by the IEC 61850 control service. Waiting for independent IED process feedback; monitored stVal is not changed from the command path.";\n            }\n            SetResultTone(result.IsSuccess ? "Success" : "Error");\n''')
          replace_exact(
              'ControlCommandWindow.xaml.cs',
              '''        if (!string.IsNullOrWhiteSpace(result.FeedbackElapsedText) && result.FeedbackElapsedText != "-")\n            details.Add($"Process feedback: {result.FeedbackElapsedText}.");\n''',
              '''        if (!string.IsNullOrWhiteSpace(result.FeedbackElapsedText) && result.FeedbackElapsedText != "-")\n            details.Add($"Control-side feedback verification: {result.FeedbackElapsedText}. This does not overwrite monitored stVal.");\n''')

          # 3) Time-based easing math shared by phasor + harmonics presentation only.
          Path('Services/PresentationEasingMath.cs').write_text(r'''namespace ArIED61850Tester.Services;

/// <summary>
/// Allocation-free presentation easing helpers. These functions are intentionally presentation-only:
/// raw COMTRADE/IEC 61850 engineering values remain untouched and authoritative.
/// </summary>
public static class PresentationEasingMath
{
    public static double ExponentialAlpha(double elapsedMilliseconds, double timeConstantMilliseconds)
    {
        if (!double.IsFinite(timeConstantMilliseconds) || timeConstantMilliseconds <= 0.0)
            return 1.0;
        if (double.IsPositiveInfinity(elapsedMilliseconds))
            return 1.0;
        if (!double.IsFinite(elapsedMilliseconds) || elapsedMilliseconds <= 0.0)
            return 0.0;

        // Time-based, therefore visually consistent when the UI cadence changes.
        var alpha = 1.0 - Math.Exp(-elapsedMilliseconds / timeConstantMilliseconds);
        return Math.Clamp(alpha, 0.0, 1.0);
    }

    public static double Smooth(double current, double target, double elapsedMilliseconds, double timeConstantMilliseconds)
    {
        if (!double.IsFinite(target)) return current;
        if (!double.IsFinite(current)) return target;
        var alpha = ExponentialAlpha(elapsedMilliseconds, timeConstantMilliseconds);
        return current + ((target - current) * alpha);
    }

    public static double ShortestAngleDeltaDegrees(double currentDegrees, double targetDegrees)
    {
        if (!double.IsFinite(currentDegrees) || !double.IsFinite(targetDegrees))
            return 0.0;
        var delta = (targetDegrees - currentDegrees) % 360.0;
        if (delta >= 180.0) delta -= 360.0;
        if (delta < -180.0) delta += 360.0;
        return delta;
    }

    public static double NormalizeAngleDegrees(double degrees)
    {
        if (!double.IsFinite(degrees)) return 0.0;
        var normalized = degrees % 360.0;
        if (normalized >= 180.0) normalized -= 360.0;
        if (normalized < -180.0) normalized += 360.0;
        return normalized;
    }

    public static double SmoothAngleDegrees(double currentDegrees, double targetDegrees, double elapsedMilliseconds, double timeConstantMilliseconds)
    {
        if (!double.IsFinite(targetDegrees)) return NormalizeAngleDegrees(currentDegrees);
        if (!double.IsFinite(currentDegrees)) return NormalizeAngleDegrees(targetDegrees);
        var alpha = ExponentialAlpha(elapsedMilliseconds, timeConstantMilliseconds);
        return NormalizeAngleDegrees(currentDegrees + (ShortestAngleDeltaDegrees(currentDegrees, targetDegrees) * alpha));
    }
}
''', encoding='utf-8')

          # 4) Phasor: smooth only display vectors at analysis-result cadence; no timer, no raw-value mutation.
          replace_exact(
              'Controls/ComtradePhasorView.cs',
              '''using System.Globalization;\nusing System.Windows;\nusing System.Windows.Media;\n''',
              '''using System.Diagnostics;\nusing System.Globalization;\nusing System.Windows;\nusing System.Windows.Media;\nusing ArIED61850Tester.Services;\n''')
          replace_exact(
              'Controls/ComtradePhasorView.cs',
              '''    private string _headerLabel = "Fundamental phasors at C1";\n    private string _referenceDetail = "Select a valid analysis reference";\n    private string _message = string.Empty;\n''',
              '''    private const double PresentationTimeConstantMs = 78.0;\n    private string _headerLabel = "Fundamental phasors at C1";\n    private string _referenceDetail = "Select a valid analysis reference";\n    private string _message = string.Empty;\n    private ComtradePhasorVector[] _smoothedVoltageVectors = Array.Empty<ComtradePhasorVector>();\n    private ComtradePhasorVector[] _smoothedCurrentVectors = Array.Empty<ComtradePhasorVector>();\n    private long _lastPresentationTimestamp;\n''')
          replace_exact(
              'Controls/ComtradePhasorView.cs',
              '''        var resolvedReference = string.IsNullOrWhiteSpace(referenceLabel) ? "Reference" : referenceLabel;\n        _headerLabel = $"Fundamental phasors at {resolvedReference}";\n        _referenceDetail = referenceDetail ?? string.Empty;\n        _voltagePanel = PreparePanel(voltageVectors);\n        _currentPanel = PreparePanel(currentVectors);\n        _message = string.Empty;\n        InvalidateVisual();\n''',
              '''        var resolvedReference = string.IsNullOrWhiteSpace(referenceLabel) ? "Reference" : referenceLabel;\n        _headerLabel = $"Fundamental phasors at {resolvedReference}";\n        _referenceDetail = referenceDetail ?? string.Empty;\n\n        var now = Stopwatch.GetTimestamp();\n        var elapsedMilliseconds = _lastPresentationTimestamp == 0\n            ? double.PositiveInfinity\n            : Stopwatch.GetElapsedTime(_lastPresentationTimestamp, now).TotalMilliseconds;\n        _lastPresentationTimestamp = now;\n\n        _smoothedVoltageVectors = SmoothVectors(_smoothedVoltageVectors, voltageVectors, elapsedMilliseconds);\n        _smoothedCurrentVectors = SmoothVectors(_smoothedCurrentVectors, currentVectors, elapsedMilliseconds);\n        _voltagePanel = PreparePanel(_smoothedVoltageVectors);\n        _currentPanel = PreparePanel(_smoothedCurrentVectors);\n        _message = string.Empty;\n        InvalidateVisual();\n''')
          replace_exact(
              'Controls/ComtradePhasorView.cs',
              '''        _voltagePanel = PreparedPhasorPanel.Empty;\n        _currentPanel = PreparedPhasorPanel.Empty;\n        _message = message ?? string.Empty;\n        InvalidateVisual();\n''',
              '''        _voltagePanel = PreparedPhasorPanel.Empty;\n        _currentPanel = PreparedPhasorPanel.Empty;\n        _smoothedVoltageVectors = Array.Empty<ComtradePhasorVector>();\n        _smoothedCurrentVectors = Array.Empty<ComtradePhasorVector>();\n        _lastPresentationTimestamp = 0;\n        _message = message ?? string.Empty;\n        InvalidateVisual();\n''')
          replace_exact(
              'Controls/ComtradePhasorView.cs',
              '''    private static PreparedPhasorPanel PreparePanel(IReadOnlyList<ComtradePhasorVector>? source)\n''',
              '''    private static ComtradePhasorVector[] SmoothVectors(\n        IReadOnlyList<ComtradePhasorVector> previous,\n        IReadOnlyList<ComtradePhasorVector>? target,\n        double elapsedMilliseconds)\n    {\n        if (target is null || target.Count == 0)\n            return Array.Empty<ComtradePhasorVector>();\n\n        var topologyMatches = previous.Count == target.Count && previous.Count > 0;\n        if (topologyMatches)\n        {\n            for (var index = 0; index < target.Count; index++)\n            {\n                if (!string.Equals(previous[index].Label, target[index].Label, StringComparison.Ordinal) ||\n                    !string.Equals(previous[index].Phase, target[index].Phase, StringComparison.Ordinal) ||\n                    !string.Equals(previous[index].Units, target[index].Units, StringComparison.Ordinal))\n                {\n                    topologyMatches = false;\n                    break;\n                }\n            }\n        }\n\n        var output = new ComtradePhasorVector[target.Count];\n        if (!topologyMatches)\n        {\n            for (var index = 0; index < target.Count; index++)\n                output[index] = target[index];\n            return output; // First sample / topology change snaps immediately: no artificial ramp from zero.\n        }\n\n        for (var index = 0; index < target.Count; index++)\n        {\n            var before = previous[index];\n            var next = target[index];\n            output[index] = new ComtradePhasorVector(\n                next.Label,\n                next.Phase,\n                next.Units,\n                PresentationEasingMath.Smooth(before.MagnitudeRms, next.MagnitudeRms, elapsedMilliseconds, PresentationTimeConstantMs),\n                PresentationEasingMath.SmoothAngleDegrees(before.AngleDegrees, next.AngleDegrees, elapsedMilliseconds, PresentationTimeConstantMs));\n        }\n        return output;\n    }\n\n    private static PreparedPhasorPanel PreparePanel(IReadOnlyList<ComtradePhasorVector>? source)\n''')

          # 5) Harmonics workstation: smooth display spectra only; preserve raw/native spectrum and analysis result.
          replace_exact(
              'Controls/ComtradeHarmonicsWorkstationView.cs',
              '''using System.Globalization;\nusing System.Windows;\n''',
