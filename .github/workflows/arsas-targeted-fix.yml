name: ARSAS targeted control and analyzer fix

on:
  push:
    branches:
      - "fix/real-ied-feedback-smooth-analyzers"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused source patch
        run: python .github/scripts/apply_arsas_targeted_fix.py
      - name: Validate and commit patch
        shell: bash
        run: |
          rm -f .github/workflows/arsas-targeted-fix.yml
          rm -f .github/scripts/apply_arsas_targeted_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: separate control feedback and smooth analyzers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
