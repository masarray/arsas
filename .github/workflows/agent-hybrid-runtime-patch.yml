name: Agent guarded hybrid runtime patch

on:
  push:
    branches:
      - agent/consume-hybrid-report-planner-p23

permissions:
  contents: write

jobs:
  patch-runtime:
    if: ${{ !contains(github.event.head_commit.message, '[hybrid-runtime-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact guarded patch
        run: python .agent/apply_hybrid_runtime_patch.py

      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/Iec61850MonitorRuntime.cs
          if git diff --cached --quiet; then
            echo "Runtime patch produced no diff; refusing an empty patch commit."
            exit 1
          fi
          git commit -m "Integrate ARIEC hybrid acquisition into monitor runtime [hybrid-runtime-applied]"
          git push origin HEAD:${{ github.ref_name }}
