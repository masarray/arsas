name: Validate IO List Testing

on:
  pull_request:
    paths:
      - "MainWindow.IoTesting.cs"
      - "IoListTestingWindow.xaml"
      - "IoListTestingWindow.xaml.cs"
      - "Models/IoTesting/**"
      - "Services/IoTesting/**"
      - "tests/ARSAS.Tests/IoTest*"
      - "tests/ARSAS.Tests/IoList*"
      - "tests/ARSAS.Tests/IoFat*"
      - "tests/ARSAS.Tests/FatDataSet*"
      - "tests/ARSAS.Tests/FatScl*"
      - "engines/ARIEC61850.lock.json"
      - ".github/workflows/validate-io-testing.yml"
      - "scripts/verify-ci-canonical-reuse.py"
      - "scripts/test-ci-canonical-reuse.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-io-testing:
    name: Build and test IO List Testing
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'windows-latest' }}

    steps:
      - name: Checkout exact ARSAS application revision
        uses: actions/checkout@v7
        with:
          path: ARSAS
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - id: engine
        name: Resolve exact immutable ARIEC61850 engine identity
        uses: ./ARSAS/.github/actions/resolve-ariec-engine
        with:
          lock-path: ARSAS/engines/ARIEC61850.lock.json

      - name: Run offline canonical evidence safety fixtures
        if: github.event_name == 'pull_request'
        run: python3 ARSAS/scripts/test-ci-canonical-reuse.py

      - name: Prove exact canonical IO domain tests passed
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
          ENGINE_SHA: ${{ steps.engine.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p ARSAS/TestResults
          python3 ARSAS/scripts/verify-ci-canonical-reuse.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-branch "$PR_HEAD_BRANCH" \
            --head-sha "$PR_HEAD_SHA" \
            --merge-sha "$PR_MERGE_SHA" \
            --engine-sha "$ENGINE_SHA" \
            --wait-seconds 960 \
            --allow-in-progress-artifact \
            --require-test-substring IoTest \
            --require-test-substring IoList \
            --require-test-substring IoFat \
            --require-test-substring FatDataSet \
            --require-test-substring FatScl \
            --output ARSAS/TestResults/io-canonical-domain-proof.json

      - name: Upload exact canonical IO test proof
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-io-testing-test-results
          path: ARSAS/TestResults/io-canonical-domain-proof.json
          if-no-files-found: error

      - name: Checkout immutable ARIEC61850 engine revision for manual diagnostics
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.engine.outputs.repository }}
          ref: ${{ steps.engine.outputs.commit }}
          path: ARIEC61850
          persist-credentials: false
          fetch-depth: 1

      - name: Setup .NET 8 for manual diagnostics
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore focused test project
        if: github.event_name == 'workflow_dispatch'
        run: dotnet restore .\ARSAS\tests\ARSAS.Tests\ARSAS.Tests.csproj

      - name: Build focused IO testing project
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $log = ".\ARSAS\io-testing-build.log"
          dotnet build .\ARSAS\tests\ARSAS.Tests\ARSAS.Tests.csproj -c Release --no-restore *> $log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            Write-Host "=== IO Testing compiler errors ===" -ForegroundColor Red
            $errors = @(Select-String -Path $log -Pattern ': error ')
            if ($errors.Count -eq 0) {
              Get-Content $log -Tail 100 | ForEach-Object { Write-Host $_ -ForegroundColor Red }
            }
            else {
              $errors | ForEach-Object { Write-Host $_.Line -ForegroundColor Red }
            }
            exit $buildExitCode
          }
          Get-Content $log -Tail 12

      - name: Upload IO testing compiler diagnostics
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-io-testing-compiler-log
          path: ARSAS/io-testing-build.log
          if-no-files-found: error

      - name: Run IO testing regression tests
        if: github.event_name == 'workflow_dispatch'
        run: dotnet test .\ARSAS\tests\ARSAS.Tests\ARSAS.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~IoTest|FullyQualifiedName~IoList|FullyQualifiedName~IoFat|FullyQualifiedName~FatDataSet|FullyQualifiedName~FatScl" --logger "trx;LogFileName=io-testing-tests.trx" --results-directory .\ARSAS\TestResults

      - name: Upload IO testing test results
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-io-testing-test-results
          path: ARSAS/TestResults/*.trx
          if-no-files-found: ignore
