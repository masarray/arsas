name: Apply portable smoke test correction

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/agent-fix-portable-smoke.yml"
      - "scripts/agent_fix_portable_smoke.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply corrected smoke-test process handling
        run: python scripts/agent_fix_portable_smoke.py

      - name: Commit corrected source
        shell: bash
        run: |
          rm .github/workflows/agent-fix-portable-smoke.yml
          rm scripts/agent_fix_portable_smoke.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: wait for portable GUI smoke test process"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
