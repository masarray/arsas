name: Release ARSAS Windows packages

on:
  push:
    branches: [ main ]
    paths:
      - ".release/windows.json"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.6.19"
        required: true
        default: "1.6.20"
        type: string
      publish_release:
        description: "Create or update a GitHub Release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark a manually published release as pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  windows-release:
    name: Build, test and release ARSAS Windows packages
    runs-on: windows-latest

    steps:
      - name: Checkout exact ARSAS release source
        uses: actions/checkout@v7
        with:
          path: ArIED61850Tester
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release source identity
        shell: powershell
        run: |
          $actual = (git -C .\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:GITHUB_SHA.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Release source mismatch. Expected $expected, checked out $actual."
          }
          "RELEASE_SOURCE_COMMIT=$actual" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve release identity and immutable engine locks
        id: release
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $rawVersion = "${{ inputs.version }}"
          }
          elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $rawVersion = $env:GITHUB_REF_NAME
          }
          elseif ($env:GITHUB_REF -eq "refs/heads/main") {
            $manifestPath = ".\ArIED61850Tester\.release\windows.json"
            if (-not (Test-Path $manifestPath -PathType Leaf)) {
              throw "Release manifest was not found: $manifestPath"
            }
            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            $rawVersion = [string]$manifest.version
          }
          else {
            throw "Release version source could not be resolved for event $env:GITHUB_EVENT_NAME and ref $env:GITHUB_REF."
          }

          $version = $rawVersion.Trim()
          if ($version.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$rawVersion'. Use semantic versioning such as 1.6.19 or 1.7.0-rc.1."
          }

          [xml]$versionProps = Get-Content ".\ArIED61850Tester\Directory.Build.props" -Raw
          [xml]$project = Get-Content ".\ArIED61850Tester\ArIED61850Tester.csproj" -Raw
          $canonicalVersion = [string]$versionProps.Project.PropertyGroup.Version
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $versionFile = (Get-Content ".\ArIED61850Tester\VERSION" -Raw).Trim()
          if ($canonicalVersion -ne $version -or
              $projectVersion -ne $version -or
              $versionFile -ne $version) {
            throw "Release version $version does not match canonical ARSAS metadata: props=$canonicalVersion project=$projectVersion VERSION=$versionFile."
          }

          $iecLock = Get-Content ".\ArIED61850Tester\engines\ARIEC61850.lock.json" -Raw | ConvertFrom-Json
          if ($iecLock.repository -notmatch '^[^/]+/[^/]+$' -or
              $iecLock.ref -ne 'main' -or
              $iecLock.commit -notmatch '^[0-9a-f]{40}$') {
            throw "ARIEC61850 lock metadata is invalid."
          }

          $ardirecLock = Get-Content ".\ArIED61850Tester\engines\ARDIREC.lock.json" -Raw | ConvertFrom-Json
          if ($ardirecLock.schema -ne 3 -or
              $ardirecLock.repository -notmatch '^[^/]+/[^/]+$' -or
              [string]::IsNullOrWhiteSpace([string]$ardirecLock.ref) -or
              $ardirecLock.commit -notmatch '^[0-9a-f]{40}$' -or
              $ardirecLock.bridge.abi -ne 1 -or
              $ardirecLock.bridge.mode -ne 'native-only' -or
              $ardirecLock.bridge.relativeLibrary -ne 'Tools/ArdIrec/ardirec_bridge.dll') {
            throw "ArdIrec field-tested native bridge lock metadata is invalid."
          }

          $requiredCapabilities = @(
            'cursor_measurement',
            'channel_semantics',
            'value_representation',
            'status_state',
            'digital_edge_snap',
            'phasor',
            'harmonics',
            'distance_locus'
          )
          $lockedCapabilities = @($ardirecLock.bridge.requiredCapabilities)
          $missingCapabilities = @($requiredCapabilities | Where-Object { $lockedCapabilities -notcontains $_ })
          if ($missingCapabilities.Count -gt 0) {
            throw "ArdIrec release bridge is missing required analysis capabilities: $($missingCapabilities -join ', ')."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARIEC61850_REPOSITORY=$($iecLock.repository)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARIEC61850_COMMIT=$($iecLock.commit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARDIREC_REPOSITORY=$($ardirecLock.repository)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARDIREC_COMMIT=$($ardirecLock.commit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARDIREC_BRIDGE_ABI=$($ardirecLock.bridge.abi)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARDIREC_BRIDGE_RELATIVE_LIBRARY=$($ardirecLock.bridge.relativeLibrary)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout immutable ARIEC61850 engine revision for manual fallback
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$env:ARIEC61850_REPOSITORY.git" ARIEC61850
          git -C .\ARIEC61850 fetch --quiet --depth 1 origin $env:ARIEC61850_COMMIT
          git -C .\ARIEC61850 checkout --quiet --detach $env:ARIEC61850_COMMIT
          $actual = (git -C .\ARIEC61850 rev-parse HEAD).Trim()
          if ($actual -ne $env:ARIEC61850_COMMIT) {
            throw "ARIEC61850 pin mismatch. Expected $env:ARIEC61850_COMMIT, got $actual."
          }

      - name: Checkout immutable ArdIrec native engine revision for manual fallback
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$env:ARDIREC_REPOSITORY.git" ArdIrec
          git -C .\ArdIrec fetch --quiet --depth 1 origin $env:ARDIREC_COMMIT
          git -C .\ArdIrec checkout --quiet --detach $env:ARDIREC_COMMIT
          $actual = (git -C .\ArdIrec rev-parse HEAD).Trim()
          if ($actual -ne $env:ARDIREC_COMMIT) {
            throw "ArdIrec pin mismatch. Expected $env:ARDIREC_COMMIT, got $actual."
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify source and licensing boundaries
        shell: powershell
        run: .\ArIED61850Tester\scripts\verify-source-clean.ps1

      - name: Verify physical-proven Smart Discovery route before release build
        shell: powershell
        run: |
          $native = '.\ArIED61850Tester\Services\NativeIec61850Client.cs'
          $before = (Get-FileHash $native -Algorithm SHA256).Hash
          & .\ArIED61850Tester\scripts\enable-smart-discovery-capture.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Release refuses a legacy/incomplete Smart Discovery route.' }
          $after = (Get-FileHash $native -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Release verification mutated discovery source; refusing non-reproducible build.' }

          $source = Get-Content $native -Raw
          foreach ($required in @(
            'return await DiscoverSignalsSmartForCaptureAsync(cancellationToken, progress).ConfigureAwait(false);',
            '__P0_5C_CONNECT_RESET__',
            '__P0_5C_DISPOSE_RESET__',
            '_lastDiscovery.Snapshot.DomainVariables')) {
            if ($source -notmatch [regex]::Escape($required)) {
              throw "Release Smart Discovery contract missing: $required"
            }
          }

      - name: Run offline sealed-package safety fixtures
        if: github.event_name != 'workflow_dispatch'
        shell: powershell
        run: python .\ArIED61850Tester\scripts\test-ci-package-reuse.py

      - name: Promote exact sealed canonical Windows package for release
        if: github.event_name != 'workflow_dispatch'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'arsas-release-canonical-package'
          $proofPath = Join-Path $env:RUNNER_TEMP 'arsas-release-canonical-package-proof.json'
          python .\ArIED61850Tester\scripts\verify-ci-package-reuse.py `
            --repository $env:GITHUB_REPOSITORY `
            --head-branch main `
            --head-sha $env:GITHUB_SHA `
            --source-sha $env:GITHUB_SHA `
            --engine-sha $env:ARIEC61850_COMMIT `
            --ardirec-sha $env:ARDIREC_COMMIT `
            --event-name push `
            --wait-seconds 1200 `
            --allow-in-progress-artifact `
            --output-dir $packageRoot `
            --proof-output $proofPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Production release requires the exact sealed Build ARSAS package for this main commit.'
          }

          $proof = Get-Content $proofPath -Raw | ConvertFrom-Json
          if ($proof.sourceSha -ne $env:GITHUB_SHA -or
              $proof.engineSha -ne $env:ARIEC61850_COMMIT -or
              $proof.ardirecSha -ne $env:ARDIREC_COMMIT -or
              $proof.version -ne $env:RELEASE_VERSION -or
              [int]$proof.failed -ne 0 -or
              [int]$proof.notExecuted -ne 0 -or
              [int]$proof.passed -lt 1 -or
              [bool]$proof.releasePromotionAuthority) {
            throw 'Canonical package identity does not match release authority.'
          }

          $installerInput = Join-Path $packageRoot ($proof.installerInputRoot -replace '/', '\')
          $portable = Join-Path $packageRoot ($proof.portablePath -replace '/', '\')
          $testAssembly = Join-Path $packageRoot ($proof.testAssemblyPath -replace '/', '\')
          $releaseFixture = Join-Path $packageRoot ($proof.releaseFixturePath -replace '/', '\')
          $locusFixture = Join-Path $packageRoot ($proof.locusFixturePath -replace '/', '\')
          foreach ($required in @($installerInput, $portable, $testAssembly, $releaseFixture, $locusFixture)) {
            if (-not (Test-Path $required)) {
              throw "Verified release package materialization is incomplete: $required"
            }
          }

          $dist = Join-Path $env:GITHUB_WORKSPACE 'ArIED61850Tester\dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          $releaseInput = Join-Path $dist "ARSAS-$env:RELEASE_VERSION-win-x64"
          if (Test-Path $releaseInput) { Remove-Item $releaseInput -Recurse -Force }
          Copy-Item $installerInput $releaseInput -Recurse -Force

          $releasePortable = Join-Path $dist "ARSAS-$env:RELEASE_VERSION-win-x64-portable.exe"
          Copy-Item $portable $releasePortable -Force
          $portableSha = (Get-FileHash $releasePortable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($portableSha -ne $proof.portableSha256 -or
              [long](Get-Item $releasePortable).Length -ne [long]$proof.portableSizeBytes) {
            throw 'Promoted release portable bytes differ from the sealed package proof.'
          }

          $bridge = Join-Path $releaseInput 'Tools\ArdIrec\ardirec_bridge.dll'
          $bridgeSha = (Get-FileHash $bridge -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bridgeSha -ne $proof.nativeBridgeSha256) {
            throw 'Promoted release native bridge differs from the sealed package proof.'
          }

          $evidenceDir = '.\ArIED61850Tester\TestResults\release-promoted-evidence'
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          Copy-Item (Join-Path $packageRoot 'evidence\arsas-tests.trx') (Join-Path $evidenceDir 'arsas-tests.trx') -Force
          Copy-Item $proofPath (Join-Path $evidenceDir 'ci-release-package-proof.json') -Force

          "RELEASE_INSTALLER_INPUT_DIR=$releaseInput" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PORTABLE_PATH=$releasePortable" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TEST_ASSEMBLY=$testAssembly" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_COMTRADE_FIXTURE=$releaseFixture" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_LOCUS_FIXTURE=$locusFixture" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PACKAGE_AUTHORITY=sealed-build-arsas:$($proof.canonicalRunId)/$($proof.canonicalRunAttempt)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PACKAGE_RUN=$($proof.canonicalRunId)/$($proof.canonicalRunAttempt)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PACKAGE_ARTIFACT_SHA256=$($proof.artifactSha256)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CANONICAL_PORTABLE_SHA256=$($proof.portableSha256)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          @(
            '## CI-P3C exact-byte release promotion',
            '',
            "- source: $env:GITHUB_SHA",
            "- engine: $env:ARIEC61850_COMMIT",
            "- ArdIrec: $env:ARDIREC_COMMIT",
            "- Build ARSAS run: $($proof.canonicalRunId)/$($proof.canonicalRunAttempt)",
            "- canonical regression: $($proof.passed) passed / $($proof.failed) failed",
            "- portable SHA-256: $($proof.portableSha256)",
            "- sealed artifact SHA-256: $($proof.artifactSha256)",
            '- release does not rebuild application bytes'
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Restore, build and test exact release source for manual fallback
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          dotnet restore .\ArIED61850Tester\ArIED61850Tester.sln
          if ($LASTEXITCODE -ne 0) { throw "Release solution restore failed." }
          dotnet build .\ArIED61850Tester\ArIED61850Tester.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Release solution build failed." }
          dotnet test .\ArIED61850Tester\tests\ARSAS.Tests\ARSAS.Tests.csproj `
            -c Release `
            --no-build `
            --no-restore `
            --logger "trx;LogFileName=arsas-release-tests.trx" `
            --results-directory .\ArIED61850Tester\TestResults
          if ($LASTEXITCODE -ne 0) { throw "Release application regression tests failed." }

      - name: Publish installer source folder for manual fallback
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          .\ArIED61850Tester\scripts\publish-windows-portable.ps1 `
            -Version $env:RELEASE_VERSION `
            -Runtime win-x64 `
            -SingleFile $false `
            -SelfContained $true `
            -EngineProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850\AR.Iec61850.csproj" `
            -NpcapProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850.Transports.Npcap\AR.Iec61850.Transports.Npcap.csproj" `
            -ArdIrecSource "$env:GITHUB_WORKSPACE\ArdIrec"

          "RELEASE_INSTALLER_INPUT_DIR=$env:GITHUB_WORKSPACE\ArIED61850Tester\dist\ARSAS-$env:RELEASE_VERSION-win-x64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TEST_ASSEMBLY=$env:GITHUB_WORKSPACE\ArIED61850Tester\tests\ARSAS.Tests\bin\Release\net8.0-windows\ARSAS.Tests.dll" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_COMTRADE_FIXTURE=$env:GITHUB_WORKSPACE\ArIED61850Tester\tests\fixtures\comtrade\p1-release-smoke.cfg" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_LOCUS_FIXTURE=$env:GITHUB_WORKSPACE\ArdIrec\tests\data\distance_p1.cfg" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PACKAGE_AUTHORITY=manual-local-build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PACKAGE_RUN=manual-local-build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PACKAGE_ARTIFACT_SHA256=manual-local-build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise managed native bridge before release packaging
        shell: powershell
        run: |
          $bridge = Join-Path $env:RELEASE_INSTALLER_INPUT_DIR "Tools\ArdIrec\ardirec_bridge.dll"
          foreach ($required in @($bridge, $env:RELEASE_TEST_ASSEMBLY, $env:RELEASE_COMTRADE_FIXTURE, $env:RELEASE_LOCUS_FIXTURE)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Release native verification prerequisite is missing: $required"
            }
          }

          $env:ARSAS_ARDIREC_BRIDGE_PATH = $bridge
          $env:ARSAS_NATIVE_COMTRADE_TEST_CFG = $env:RELEASE_COMTRADE_FIXTURE
          $env:ARSAS_NATIVE_LOCUS_TEST_CFG = $env:RELEASE_LOCUS_FIXTURE
          & dotnet vstest $env:RELEASE_TEST_ASSEMBLY `
            "--TestCaseFilter:FullyQualifiedName~ArdIrecNativeBridgeIntegrationTests|FullyQualifiedName~ArdIrecLocusNativeSessionIntegrationTests"
          if ($LASTEXITCODE -ne 0) { throw "Release managed ArdIrec bridge/locus integration test failed." }

      - name: Publish real portable single EXE for manual fallback
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          .\ArIED61850Tester\scripts\publish-windows-portable.ps1 `
            -Version $env:RELEASE_VERSION `
            -Runtime win-x64 `
            -SingleFile $true `
            -SelfContained $true `
            -EngineProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850\AR.Iec61850.csproj" `
            -NpcapProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850.Transports.Npcap\AR.Iec61850.Transports.Npcap.csproj" `
            -ArdIrecSource "$env:GITHUB_WORKSPACE\ArdIrec"
          "RELEASE_PORTABLE_PATH=$env:GITHUB_WORKSPACE\ArIED61850Tester\dist\ARSAS-$env:RELEASE_VERSION-win-x64-portable.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $manualPortableSha = (Get-FileHash $env:RELEASE_PORTABLE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          "RELEASE_CANONICAL_PORTABLE_SHA256=$manualPortableSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload canonical release regression evidence
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-${{ steps.release.outputs.version }}-release-tests
          path: ArIED61850Tester/TestResults/release-promoted-evidence/*
          if-no-files-found: error

      - name: Upload manual release test evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-${{ steps.release.outputs.version }}-release-tests
          path: ArIED61850Tester/TestResults/*.trx
          if-no-files-found: error

      - name: Smoke-test exact release portable single EXE
        shell: powershell
        run: |
          $exe = $env:RELEASE_PORTABLE_PATH
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Release portable single EXE is missing: $exe" }
          $actualSha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $env:RELEASE_CANONICAL_PORTABLE_SHA256) {
            throw 'Release portable bytes changed after package promotion.'
          }
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP "ARSAS-release-bundle-cache"
          $diagnostic = Join-Path ([System.IO.Path]::GetTempPath()) "ARSAS-portable-smoke-error.txt"
          Remove-Item $diagnostic -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList @("--portable-smoke-test") -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Portable single EXE smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $diagnostic) { Get-Content $diagnostic | Write-Host }
            throw "Portable single EXE smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Install Inno Setup compiler
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: powershell
        run: |
          .\ArIED61850Tester\scripts\build-windows-installer.ps1 `
            -Version $env:RELEASE_VERSION `
            -Runtime win-x64 `
            -PublishedDirectory $env:RELEASE_INSTALLER_INPUT_DIR `
            -OutputDirectory "$env:GITHUB_WORKSPACE\ArIED61850Tester\dist" `
            -TestAssemblyPath $env:RELEASE_TEST_ASSEMBLY `
            -FixtureCfg $env:RELEASE_COMTRADE_FIXTURE `
            -LocusFixtureCfg $env:RELEASE_LOCUS_FIXTURE

      - name: Smoke-test silent installer and uninstaller
        shell: powershell
        run: |
          $installerPath = ".\ArIED61850Tester\dist\ARSAS-$env:RELEASE_VERSION-win-x64-setup.exe"
          if (-not (Test-Path $installerPath -PathType Leaf)) { throw "Windows installer was not produced: $installerPath" }

          $installRoot = Join-Path $env:RUNNER_TEMP "ARSAS-installer-smoke"
          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }

          $installArguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/CURRENTUSER",
            "/DIR=$installRoot"
          )
          $install = Start-Process -FilePath $installerPath -ArgumentList $installArguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }

          $requiredInstalledFiles = @(
            "ARSAS.exe",
            "AR.Iec61850.Transports.Npcap.dll",
            "SharpPcap.dll",
            "PacketDotNet.dll",
            "Tools\ArdIrec\ardirec_bridge.dll"
          )
          foreach ($file in $requiredInstalledFiles) {
            $path = Join-Path $installRoot $file
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Installed package is incomplete: $path"
            }
          }

          foreach ($forbidden in @(
            "Tools\ArdIrec\ardirec.exe",
            "Tools\ArdIrec\Qt6Core.dll",
            "Tools\ArdIrec\Qt6Gui.dll",
            "Tools\ArdIrec\Qt6Qml.dll",
            "Tools\ArdIrec\Qt6Quick.dll",
            "Tools\ArdIrec\platforms\qwindows.dll"
          )) {
            $path = Join-Path $installRoot $forbidden
            if (Test-Path $path) {
              throw "External ArdIrec/Qt runtime must not be packaged: $path"
            }
          }

          $env:ARSAS_ARDIREC_BRIDGE_PATH = Join-Path $installRoot "Tools\ArdIrec\ardirec_bridge.dll"
          $env:ARSAS_NATIVE_COMTRADE_TEST_CFG = $env:RELEASE_COMTRADE_FIXTURE
          $env:ARSAS_NATIVE_LOCUS_TEST_CFG = $env:RELEASE_LOCUS_FIXTURE
          & dotnet vstest $env:RELEASE_TEST_ASSEMBLY `
            "--TestCaseFilter:FullyQualifiedName~ArdIrecNativeBridgeIntegrationTests|FullyQualifiedName~ArdIrecLocusNativeSessionIntegrationTests"
          if ($LASTEXITCODE -ne 0) {
            throw "Installed release bridge/locus runtime validation failed."
          }

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "Installer did not create an uninstaller." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }

      - name: Create versioned SHA-256 checksums
        shell: powershell
        run: |
          .\ArIED61850Tester\scripts\create-windows-release-checksums.ps1 `
            -Version $env:RELEASE_VERSION `
            -Runtime win-x64 `
            -DistDirectory "$env:GITHUB_WORKSPACE\ArIED61850Tester\dist"

      - name: Stage stable public download assets
        shell: powershell
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "ArIED61850Tester\dist"
          $versionedInstaller = Join-Path $dist "ARSAS-$env:RELEASE_VERSION-win-x64-setup.exe"
          $versionedPortable = Join-Path $dist "ARSAS-$env:RELEASE_VERSION-win-x64-portable.exe"
          $publicInstaller = Join-Path $dist "ARSAS-Windows-x64-Setup.exe"
          $publicPortable = Join-Path $dist "ARSAS-Windows-x64-Portable.exe"
          $publicChecksums = Join-Path $dist "ARSAS-Windows-x64-SHA256SUMS.txt"

          Copy-Item $versionedInstaller $publicInstaller -Force
          Copy-Item $versionedPortable $publicPortable -Force

          @($publicInstaller, $publicPortable) | ForEach-Object {
            $hash = Get-FileHash $_ -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($_))"
          } | Set-Content -Path $publicChecksums -Encoding ascii

          foreach ($path in @($publicInstaller, $publicPortable, $publicChecksums)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Public release asset was not staged: $path" }
          }

      - name: Generate SPDX 2.3 package SBOM
        shell: powershell
        run: |
          python .\ArIED61850Tester\scripts\generate-release-sbom.py `
            --package-dir "$env:GITHUB_WORKSPACE\ArIED61850Tester\dist\ARSAS-$env:RELEASE_VERSION-win-x64" `
            --version $env:RELEASE_VERSION `
            --source-commit $env:GITHUB_SHA `
            --output "$env:GITHUB_WORKSPACE\ArIED61850Tester\dist\ARSAS-Windows-x64-SBOM.spdx.json"

      - name: Write app and engine provenance evidence
        shell: powershell
        run: |
          $evidence = [ordered]@{
            schemaVersion = 2
            product = "ARSAS"
            version = $env:RELEASE_VERSION
            applicationCommit = $env:GITHUB_SHA
            engineRepository = $env:ARIEC61850_REPOSITORY
            engineCommit = $env:ARIEC61850_COMMIT
            comtradeViewerRepository = $env:ARDIREC_REPOSITORY
            comtradeViewerCommit = $env:ARDIREC_COMMIT
            comtradeBridgeAbi = [int]$env:ARDIREC_BRIDGE_ABI
            comtradeBridgeRelativeLibrary = $env:ARDIREC_BRIDGE_RELATIVE_LIBRARY
            canonicalPackageAuthority = $env:RELEASE_PACKAGE_AUTHORITY
            canonicalPackageRun = $env:RELEASE_PACKAGE_RUN
            canonicalPackageArtifactSha256 = $env:RELEASE_PACKAGE_ARTIFACT_SHA256
            canonicalPortableSha256 = $env:RELEASE_CANONICAL_PORTABLE_SHA256
            workflow = "release-windows.yml"
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content `
            -Path ".\ArIED61850Tester\dist\ARSAS-Windows-x64-PROVENANCE.json" `
            -Encoding utf8

      - name: Validate release checksums, SBOM and provenance
        shell: powershell
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "ArIED61850Tester\dist"
          $checksums = Get-Content (Join-Path $dist "ARSAS-Windows-x64-SHA256SUMS.txt")
          foreach ($line in $checksums) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum line: $line" }
            $expected = $Matches[1]
            $path = Join-Path $dist $Matches[2]
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch for $path" }
          }
          $sbom = Get-Content (Join-Path $dist "ARSAS-Windows-x64-SBOM.spdx.json") -Raw | ConvertFrom-Json
          if ($sbom.spdxVersion -ne "SPDX-2.3" -or $sbom.packages[0].name -ne "ARSAS" -or $sbom.files.Count -lt 20) {
            throw "Generated SPDX SBOM is incomplete."
          }
          $provenance = Get-Content (Join-Path $dist "ARSAS-Windows-x64-PROVENANCE.json") -Raw | ConvertFrom-Json
          if ($provenance.schemaVersion -ne 2 -or
              $provenance.applicationCommit -ne $env:GITHUB_SHA -or
              $provenance.engineCommit -ne $env:ARIEC61850_COMMIT -or
              $provenance.comtradeViewerCommit -ne $env:ARDIREC_COMMIT -or
              $provenance.comtradeBridgeAbi -ne 1 -or
              $provenance.comtradeBridgeRelativeLibrary -ne 'Tools/ArdIrec/ardirec_bridge.dll' -or
              $provenance.canonicalPackageAuthority -ne $env:RELEASE_PACKAGE_AUTHORITY -or
              $provenance.canonicalPackageRun -ne $env:RELEASE_PACKAGE_RUN -or
              $provenance.canonicalPackageArtifactSha256 -ne $env:RELEASE_PACKAGE_ARTIFACT_SHA256 -or
              $provenance.canonicalPortableSha256 -ne $env:RELEASE_CANONICAL_PORTABLE_SHA256) {
            throw "Release provenance does not match the tested app, IEC engine and native COMTRADE bridge revisions."
          }

      - name: Attest installer artifact digest
        uses: actions/attest@v4
        with:
          subject-path: ArIED61850Tester/dist/ARSAS-Windows-x64-Setup.exe

      - name: Attest portable package with SPDX SBOM
        uses: actions/attest@v4
        with:
          subject-path: ArIED61850Tester/dist/ARSAS-Windows-x64-Portable.exe
          sbom-path: ArIED61850Tester/dist/ARSAS-Windows-x64-SBOM.spdx.json

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-${{ steps.release.outputs.version }}-windows
          if-no-files-found: error
          path: |
            ArIED61850Tester/dist/ARSAS-${{ steps.release.outputs.version }}-win-x64-portable.exe
            ArIED61850Tester/dist/ARSAS-${{ steps.release.outputs.version }}-win-x64-setup.exe
            ArIED61850Tester/dist/SHA256SUMS.txt
            ArIED61850Tester/dist/ARSAS-Windows-x64-Portable.exe
            ArIED61850Tester/dist/ARSAS-Windows-x64-Setup.exe
            ArIED61850Tester/dist/ARSAS-Windows-x64-SHA256SUMS.txt
            ArIED61850Tester/dist/ARSAS-Windows-x64-SBOM.spdx.json
            ArIED61850Tester/dist/ARSAS-Windows-x64-PROVENANCE.json

      - name: Create or update GitHub Release
        if: (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "ArIED61850Tester\dist"
          $assets = @(
            (Join-Path $dist "ARSAS-Windows-x64-Setup.exe")
            (Join-Path $dist "ARSAS-Windows-x64-Portable.exe")
            (Join-Path $dist "ARSAS-Windows-x64-SHA256SUMS.txt")
            (Join-Path $dist "ARSAS-Windows-x64-SBOM.spdx.json")
            (Join-Path $dist "ARSAS-Windows-x64-PROVENANCE.json")
          )

          $null = cmd /c "gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY >NUL 2>NUL"
          if ($LASTEXITCODE -eq 0) {
            # Existing stable tags/assets are immutable. A rerun with the same source and
            # identical bytes is a no-op; a different source or binary is rejected.
            $tagCommit = git -C .\ArIED61850Tester rev-list -n 1 $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0 -or "$tagCommit".Trim() -ne $env:GITHUB_SHA) {
              throw "Existing release $env:RELEASE_TAG belongs to a different source commit; use a new version/tag."
            }

            $published = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect existing release assets." }
            $expectedNames = @($assets | ForEach-Object { [IO.Path]::GetFileName($_) })
            $publishedNames = @($published.assets | ForEach-Object { $_.name })
            if ($publishedNames.Count -ne $expectedNames.Count) {
              throw "Existing release asset count differs; refusing to mutate published binaries."
            }
            foreach ($name in $expectedNames) {
              if ($publishedNames -notcontains $name) {
                throw "Existing release is missing $name; refusing in-place repair of a published tag."
              }
            }

            $downloadDir = Join-Path $env:RUNNER_TEMP "arsas-existing-release-verification"
            New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $downloadDir
            if ($LASTEXITCODE -ne 0) { throw "Cannot download existing release assets for integrity verification." }
            foreach ($asset in $assets) {
              $existingAsset = Join-Path $downloadDir ([IO.Path]::GetFileName($asset))
              if (-not (Test-Path -LiteralPath $existingAsset -PathType Leaf)) {
                throw "Missing existing release asset $existingAsset."
              }
              $rebuiltHash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash
              $publishedHash = (Get-FileHash -LiteralPath $existingAsset -Algorithm SHA256).Hash
              if ($rebuiltHash -ne $publishedHash) {
                throw "Existing release asset differs: $([IO.Path]::GetFileName($asset)). Publish a new version/tag instead."
              }
            }
            "RELEASE_ALREADY_PUBLISHED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Existing release matches the exact source and all published asset hashes; no mutation performed."
            exit 0
          }

          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "ARSAS $env:RELEASE_VERSION",
            "--generate-notes",
            "--latest"
          )
          if ($env:RELEASE_VERSION.Contains("-") -or ($env:GITHUB_REF_TYPE -ne "tag" -and $env:GITHUB_REF -ne "refs/heads/main" -and $env:MANUAL_PRERELEASE -eq "true")) {
            $arguments += "--prerelease"
          }
          $arguments += $assets

          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release." }

      - name: Record verified release publication
        if: ((github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)) && env.RELEASE_ALREADY_PUBLISHED != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "ArIED61850Tester\dist"
          $installer = Join-Path $dist "ARSAS-Windows-x64-Setup.exe"
          $portable = Join-Path $dist "ARSAS-Windows-x64-Portable.exe"
          $checksums = Join-Path $dist "ARSAS-Windows-x64-SHA256SUMS.txt"
          $sbom = Join-Path $dist "ARSAS-Windows-x64-SBOM.spdx.json"
          $provenance = Join-Path $dist "ARSAS-Windows-x64-PROVENANCE.json"

          $record = [ordered]@{
            version = $env:RELEASE_VERSION
            tag = $env:RELEASE_TAG
            channel = "stable"
            publishedAtUtc = [DateTime]::UtcNow.ToString("o")
            sourceCommit = $env:GITHUB_SHA
            engine = [ordered]@{
              repository = $env:ARIEC61850_REPOSITORY
              commit = $env:ARIEC61850_COMMIT
            }
            comtradeViewer = [ordered]@{
              repository = $env:ARDIREC_REPOSITORY
              commit = $env:ARDIREC_COMMIT
              nativeBridgeAbi = [int]$env:ARDIREC_BRIDGE_ABI
              nativeBridgeRelativeLibrary = $env:ARDIREC_BRIDGE_RELATIVE_LIBRARY
            }
            installer = [ordered]@{
              name = "ARSAS-Windows-x64-Setup.exe"
              url = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/ARSAS-Windows-x64-Setup.exe"
              sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
              sizeBytes = (Get-Item $installer).Length
            }
            portable = [ordered]@{
              name = "ARSAS-Windows-x64-Portable.exe"
              url = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/ARSAS-Windows-x64-Portable.exe"
              sha256 = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
              sizeBytes = (Get-Item $portable).Length
            }
            checksums = [ordered]@{
              name = "ARSAS-Windows-x64-SHA256SUMS.txt"
              url = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/ARSAS-Windows-x64-SHA256SUMS.txt"
              sizeBytes = (Get-Item $checksums).Length
            }
            supplyChain = [ordered]@{
              sbomName = "ARSAS-Windows-x64-SBOM.spdx.json"
              sbomUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/ARSAS-Windows-x64-SBOM.spdx.json"
              sbomSha256 = (Get-FileHash $sbom -Algorithm SHA256).Hash.ToLowerInvariant()
              sbomSizeBytes = (Get-Item $sbom).Length
              provenanceName = "ARSAS-Windows-x64-PROVENANCE.json"
              provenanceUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/ARSAS-Windows-x64-PROVENANCE.json"
              provenanceSha256 = (Get-FileHash $provenance -Algorithm SHA256).Hash.ToLowerInvariant()
              attestationRepository = "https://github.com/$env:GITHUB_REPOSITORY/attestations"
              attestationWorkflow = "release-windows.yml"
            }
          }

          $json = $record | ConvertTo-Json -Depth 8
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json + "`n"))
          $apiPath = "repos/$env:GITHUB_REPOSITORY/contents/.release/published.json"
          $existingSha = $null
          $existing = gh api $apiPath 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            $existingSha = ($existing | ConvertFrom-Json).sha
          }

          $body = [ordered]@{
            message = "chore: record published ARSAS $env:RELEASE_VERSION release"
            content = $content
            branch = "main"
          }
          if ($existingSha) { $body.sha = $existingSha }

          $request = $body | ConvertTo-Json -Compress
          $requestPath = Join-Path $env:RUNNER_TEMP "arsas-published-release-request.json"
          [System.IO.File]::WriteAllText(
            $requestPath,
            $request,
            [System.Text.UTF8Encoding]::new($false))
          gh api --method PUT $apiPath --input $requestPath *> $null
          if ($LASTEXITCODE -ne 0) { throw "Failed to record verified release publication." }
