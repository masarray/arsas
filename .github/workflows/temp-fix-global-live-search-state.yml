name: Temporary Live Monitor search state correction

on:
  push:
    branches:
      - fix/event-driven-rcb-session-live-monitor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-driven-rcb-session-live-monitor
          fetch-depth: 0
      - run: python scripts/fix-global-live-search-state.py
      - run: git diff --check
      - name: Commit search state correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.GlobalLiveSearch.cs GridUxBehavior.cs tests/ARSAS.Tests/EventDrivenSessionLiveMonitorRegressionTests.cs
          git commit -m "Bind global Live Monitor search to installed grid state"
          git push origin HEAD:fix/event-driven-rcb-session-live-monitor
