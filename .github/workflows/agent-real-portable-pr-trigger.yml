name: Trigger real portable patch from PR

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/agent-real-portable-patch.yml"
      - ".github/workflows/agent-real-portable-pr-trigger.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute embedded patch
        shell: bash
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          import textwrap

          helper = Path('.github/workflows/agent-real-portable-patch.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = helper.index(start_marker) + len(start_marker)
          end = helper.index(end_marker, start)
          script = textwrap.dedent(helper[start:end])
          exec(compile(script, 'embedded-portable-patch.py', 'exec'))
          PYRUN

      - name: Commit patched source
        shell: bash
        run: |
          rm .github/workflows/agent-real-portable-patch.yml
          rm .github/workflows/agent-real-portable-pr-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publish real portable Windows single EXE"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
