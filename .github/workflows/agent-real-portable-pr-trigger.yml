name: Trigger real portable patch from PR

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/agent-real-portable-patch.yml"
      - ".github/workflows/agent-real-portable-pr-trigger.yml"
      - "scripts/agent_real_portable_patch.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply real portable source patch
        run: python scripts/agent_real_portable_patch.py

      - name: Commit patched source
        shell: bash
        run: |
          rm .github/workflows/agent-real-portable-patch.yml
          rm .github/workflows/agent-real-portable-pr-trigger.yml
          rm scripts/agent_real_portable_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publish real portable Windows single EXE"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
