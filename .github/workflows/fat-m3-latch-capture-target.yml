name: FAT M3 capture target latch migration

on:
  push:
    branches:
      - fix/fat-workstation-convergence
    paths:
      - .github/workflows/fat-m3-latch-capture-target.yml
      - tools/fat_m3_latch_capture_target.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: fix/fat-workstation-convergence
          fetch-depth: 0

      - name: Apply guarded M3 migration
        run: python tools/fat_m3_latch_capture_target.py

      - name: Remove one-shot migration helpers
        run: |
          rm tools/fat_m3_latch_capture_target.py
          rm .github/workflows/fat-m3-latch-capture-target.yml

      - name: Commit M3 source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: start M3 selected IED binding with capture target latch"
          git push origin HEAD:fix/fat-workstation-convergence
