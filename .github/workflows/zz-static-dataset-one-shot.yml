name: One-shot Static DataSet report-only refactor

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scl-task-first-quick-start
          fetch-depth: 0

      - name: Apply dataset-centric report-only refactor
        run: python .github/scripts/static_dataset_patch.py

      - name: Commit refactor and remove one-shot tooling
        shell: bash
        run: |
          git rm .github/workflows/zz-static-dataset-one-shot.yml .github/scripts/static_dataset_patch.py
          git add MainWindow.SharedSclWorkspace.cs Services/Iec61850MonitorRuntime.cs Services/Iec61850MonitoringModeRegistry.cs Services/Iec61850StaticDataSetSelectionPolicy.cs tests/ARSAS.Tests/StaticDataSetReportOnlyModeRegressionTests.cs
          git config user.name "ARSAS automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Static DataSet: dataset-centric report-only monitoring [static-dataset-patched]"
          git push origin HEAD:feat/scl-task-first-quick-start
