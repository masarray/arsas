name: Agent guarded hybrid execution revalidation

on:
  push:
    branches:
      - agent/consume-hybrid-report-planner-p23

permissions:
  contents: write

jobs:
  revalidate-execution:
    if: ${{ !contains(github.event.head_commit.message, '[hybrid-execution-revalidated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact guarded revalidation patch
        run: python .agent/apply_hybrid_execution_revalidation.py

      - name: Commit guarded revalidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/NativeIec61850Client.HybridReporting.cs
          if git diff --cached --quiet; then
            echo "Execution revalidation produced no diff; refusing an empty commit."
            exit 1
          fi
          git commit -m "Revalidate ARIEC hybrid plan before execution [hybrid-execution-revalidated]"
          git push origin HEAD:${{ github.ref_name }}
