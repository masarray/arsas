name: Temporary P1 workspace noise patch

on:
  push:
    branches:
      - polish/p1-workspace-noise-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/p1-workspace-noise-cleanup
          fetch-depth: 0
      - run: python scripts/apply-p1-workspace-noise.py
      - run: git diff --check
      - name: Commit P1 presentation source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.GooseSubscriber.cs Models/MonitorModels.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply P1 workspace noise cleanup"
          git push origin HEAD:polish/p1-workspace-noise-cleanup
