name: Reusable ARSAS Windows Build and Test

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact ARSAS source SHA (PR merge tree or main commit)
        type: string
        required: true
      shadow_mode:
        description: Prevent this primitive from being mistaken for release/promotion authority
        type: boolean
        default: true
      fast_dev:
        description: Opt-in bounded test scope; not a FAT or release gate
        type: boolean
        default: false
      focus:
        description: FAST DEV regression selection
        type: string
        default: all
      engine_trial_sha:
        description: Explicit experimental ARIEC commit for isolated FAST DEV only
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows-build-and-test:
    name: Shared exact-SHA Windows compilation and regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact ARSAS source
        uses: actions/checkout@v7
        with:
          path: ARSAS
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert source identity and shadow-only execution
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          SHADOW_ONLY: ${{ inputs.shadow_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SHADOW_ONLY -ne 'true') {
            throw 'CI-P1 reusable job is not approved as production/release authority.'
          }
          if ($env:EXPECTED_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'CI-P1 source_sha must be an immutable 40-character Git SHA.'
          }
          $actual = (git -C .\ARSAS rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -cne $env:EXPECTED_SOURCE_SHA) {
            throw "ARSAS source SHA mismatch: expected $env:EXPECTED_SOURCE_SHA, got $actual."
          }

      - name: Verify immutable engine resolver synthetic fixtures
        shell: pwsh
        run: .\ARSAS\scripts\test-resolve-ariec-lock.ps1

      - id: engine
        name: Resolve exact pinned ARIEC61850 engine identity
        uses: ./ARSAS/.github/actions/resolve-ariec-engine
        with:
          lock-path: ARSAS/engines/ARIEC61850.lock.json

      - name: Checkout exact engine SHA
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.engine.outputs.repository }}
          ref: ${{ inputs.fast_dev && inputs.engine_trial_sha != '' && inputs.engine_trial_sha || steps.engine.outputs.commit }}
          path: ARIEC61850
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact engine and immutable history provenance
        shell: pwsh
        env:
          EXPECTED_ENGINE_SHA: ${{ inputs.fast_dev && inputs.engine_trial_sha != '' && inputs.engine_trial_sha || steps.engine.outputs.commit }}
          PINNED_ENGINE_SHA: ${{ steps.engine.outputs.commit }}
          TRIAL_ENGINE_SHA: ${{ inputs.engine_trial_sha }}
          FAST_DEV: ${{ inputs.fast_dev }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TRIAL_ENGINE_SHA -and $env:FAST_DEV -ne 'true') {
            throw 'An engine trial is forbidden outside explicit FAST DEV.'
          }
          if ($env:TRIAL_ENGINE_SHA -and $env:TRIAL_ENGINE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'ENGINE_TRIAL_SHA must be an exact 40-character Git SHA.'
          }
          $actual = (git -C .\ARIEC61850 rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -cne $env:EXPECTED_ENGINE_SHA) {
            throw "ARIEC61850 exact checkout drifted: expected $env:EXPECTED_ENGINE_SHA, got $actual."
          }
          if ($env:TRIAL_ENGINE_SHA) {
            if ($actual -ceq $env:PINNED_ENGINE_SHA) { throw 'Trial engine unexpectedly matches production pin.' }
            Write-Host "NON-PROMOTABLE ENGINE TRIAL: $actual; unchanged production pin: $env:PINNED_ENGINE_SHA"
          } else {
            Write-Host "Reproducible compilation: ARSAS + production pinned ARIEC61850 $actual."
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache immutable NuGet packages only
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ci-p1-nuget-win-x64-${{ hashFiles('ARSAS/**/*.csproj', 'ARIEC61850/**/*.csproj', 'ARSAS/Directory.Packages.props', 'ARIEC61850/Directory.Packages.props') }}
          restore-keys: |
            ci-p1-nuget-win-x64-

      - name: Materialize temporary FAST DEV engine validation lock
        if: ${{ inputs.fast_dev && inputs.engine_trial_sha != '' }}
        shell: pwsh
        env:
          TRIAL_ENGINE_SHA: ${{ inputs.engine_trial_sha }}
          APPROVED_ENGINE_SHA: ${{ steps.engine.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath '.\ARSAS\engines\ARIEC61850.lock.json' -Raw | ConvertFrom-Json
          $actual = (git -C .\ARIEC61850 rev-parse HEAD).Trim().ToLowerInvariant()
          if ($lock.commit -cne $env:APPROVED_ENGINE_SHA -or
              $env:TRIAL_ENGINE_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $actual -cne $env:TRIAL_ENGINE_SHA -or
              $actual -ceq $lock.commit) {
            throw 'Trial engine identity or approved production baseline disagrees.'
          }
          $lock.commit = $actual
          $lock | Add-Member -NotePropertyName nonPromotableTrial -NotePropertyValue $true -Force
          $lock | Add-Member -NotePropertyName approvedBaselineCommit -NotePropertyValue $env:APPROVED_ENGINE_SHA -Force
          $ephemeral = Join-Path $env:RUNNER_TEMP 'ariec-ci-p1-nonpromotion-lock.json'
          $lock | ConvertTo-Json -Depth 64 | Set-Content -LiteralPath $ephemeral -Encoding utf8
          Write-Host "Validated CI-only engine $actual against unchanged approved lock."

      - name: Restore solution once
        run: dotnet restore .\ARSAS\ArIED61850Tester.sln

      - name: Build solution once
        shell: pwsh
        env:
          TRIAL_ENGINE_SHA: ${{ inputs.engine_trial_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildArgs = @('.\ARSAS\ArIED61850Tester.sln', '-c', 'Release', '--no-restore')
          if ($env:TRIAL_ENGINE_SHA) {
            $ephemeral = Join-Path $env:RUNNER_TEMP 'ariec-ci-p1-nonpromotion-lock.json'
            if (-not (Test-Path -LiteralPath $ephemeral)) { throw 'Trial-only validator lock missing.' }
            $buildArgs += "-p:ArIec61850LockPath=$ephemeral"
          }
          & dotnet build @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'CI-P1 Windows compilation failed.' }

      - name: Run ARSAS regression (full or focused FAST DEV)
        shell: pwsh
        env:
          FAST_DEV: ${{ inputs.fast_dev }}
          FOCUS: ${{ inputs.focus }}
          TRIAL_ENGINE_SHA: ${{ inputs.engine_trial_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @(
            'test', '.\ARSAS\tests\ARSAS.Tests\ARSAS.Tests.csproj',
            '-c', 'Release', '--no-build', '--no-restore',
            '--logger', 'trx;LogFileName=ci-p1-shadow.trx',
            '--results-directory', '.\ARSAS\TestResults'
          )
          if ($env:FAST_DEV -eq 'true') {
            $filter = switch ($env:FOCUS) {
              'quality-browser' { 'FullyQualifiedName~QualityInvalidAttentionTests|FullyQualifiedName~IedBrowserPresentationTests|FullyQualifiedName~M2TypedQualityEvidenceTests|FullyQualifiedName~P0ReadEvidenceCsvBehaviorTests|FullyQualifiedName~P0SiebcuReadAllAndLayoutRegressionTests' }
              'smv' { 'FullyQualifiedName~SmvArstack|FullyQualifiedName~SmvLiveCaptureTests|FullyQualifiedName~SmvObservedTimebaseTests|FullyQualifiedName~SmvDigSubPortTests' }
              'command-read' { 'FullyQualifiedName~ModelDrivenAutoCommandDockTests|FullyQualifiedName~P109UStableCommandProjectionTests|FullyQualifiedName~P109WCommandDockLifecycleArchitectureTests|FullyQualifiedName~P0CswiCrossDataSetCommandDiscoveryTests|FullyQualifiedName~P0GrxCswiSelectionVisibilityTests|FullyQualifiedName~P0GrxSclLiveCswiParityTests|FullyQualifiedName~P0ReadEvidenceCsvBehaviorTests|FullyQualifiedName~P109KGenericControlSafetyTests|FullyQualifiedName~ZivBscStepControlRegressionTests|FullyQualifiedName~G1ControlCorrectnessRegressionTests' }
              'all' { 'FullyQualifiedName~QualityInvalidAttentionTests|FullyQualifiedName~SmvArstack|FullyQualifiedName~P0CswiCrossDataSetCommandDiscoveryTests|FullyQualifiedName~P0ReadEvidenceCsvBehaviorTests' }
              default { throw 'Unknown FAST DEV scope; refusing to silently skip tests.' }
            }
            $arguments += @('--filter', $filter)
            Write-Host "NON-FAT scoped regression only ($env:FOCUS). No release/physical authority."
          } else {
            Write-Host "FULL ARSAS regression; no selected-test filter."
          }
          if ($env:TRIAL_ENGINE_SHA) {
            $ephemeral = Join-Path $env:RUNNER_TEMP 'ariec-ci-p1-nonpromotion-lock.json'
            if (-not (Test-Path -LiteralPath $ephemeral)) { throw 'Trial-only validator lock missing before test.' }
            $arguments += "-p:ArIec61850LockPath=$ephemeral"
          }
          # One .NET test invocation for both modes; CI sprawl budget unchanged.
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Selected ARSAS regression failed.' }
          $trxPath = '.\ARSAS\TestResults\ci-p1-shadow.trx'
          if (-not (Test-Path -LiteralPath $trxPath)) {
            throw 'No TRX proof for selected regression; refusing empty pass.'
          }
          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counts = $trx.TestRun.ResultSummary.Counters
          if ($null -eq $counts -or [int]$counts.executed -lt 1 -or [int]$counts.failed -gt 0) {
            throw "No actual passing tests or failures in FAST DEV/full TRX."
          }
          Write-Host "Exact-source regression results: executed=$($counts.executed) passed=$($counts.passed) failed=$($counts.failed)."

      - name: Build locked ArdIrec bridge and native regression for SG7 BCU trial
        if: ${{ inputs.fast_dev && inputs.engine_trial_sha != '' && inputs.focus == 'command-read' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bridge = [string](.\ARSAS\scripts\build-ardirec-bridge.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sg7-ardirec-bridge') `
            -CTestJunitPath (Join-Path $env:RUNNER_TEMP 'sg7-ardirec-ctest.xml') |
            Select-Object -Last 1)
          $bridge = $bridge.Trim()
          if (-not (Test-Path -LiteralPath $bridge -PathType Leaf) -or
              -not (Test-Path (Join-Path $env:RUNNER_TEMP 'sg7-ardirec-ctest.xml') -PathType Leaf)) {
            throw 'Native bridge build / CTest evidence missing.'
          }
          "SG7_NATIVE_BRIDGE=$bridge" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish actual self-contained SG7 BCU Ed2 trial Windows EXE
        if: ${{ inputs.fast_dev && inputs.engine_trial_sha != '' && inputs.focus == 'command-read' }}
        shell: pwsh
        env:
          ARSAS_NONPROMOTION_ENGINE_TRIAL: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $temporary = Join-Path $env:RUNNER_TEMP 'ariec-ci-p1-nonpromotion-lock.json'
          if (-not (Test-Path $temporary -PathType Leaf) -or
              -not (Test-Path $env:SG7_NATIVE_BRIDGE -PathType Leaf)) {
            throw 'Engine/ArdIrec exact-SHA trial packaging prerequisites missing.'
          }
          .\ARSAS\scripts\publish-windows-portable.ps1 `
            -Version '1.6.40-sg7bcued2trial' `
            -Runtime win-x64 `
            -SingleFile $true `
            -SelfContained $true `
            -EngineProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850\AR.Iec61850.csproj" `
            -NpcapProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850.Transports.Npcap\AR.Iec61850.Transports.Npcap.csproj" `
            -ArdIrecBridgePath $env:SG7_NATIVE_BRIDGE `
            -EngineValidationLockPath $temporary
          if ($LASTEXITCODE -ne 0) { throw 'Single EXE trial publish failed.' }

      - name: Execute portable EXE smoke and seal physical FAT trial identity
        if: ${{ inputs.fast_dev && inputs.engine_trial_sha != '' && inputs.focus == 'command-read' }}
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPERIMENTAL_ENGINE: ${{ inputs.engine_trial_sha }}
          BASELINE_ENGINE: ${{ steps.engine.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '.\ARSAS\dist'
          $source = Join-Path $root 'ARSAS-1.6.40-sg7bcued2trial-win-x64-portable.exe'
          $identityPath = Join-Path $root 'ARSAS-1.6.40-sg7bcued2trial-win-x64-portable-build-identity.json'
          if (-not (Test-Path $source -PathType Leaf) -or -not (Test-Path $identityPath -PathType Leaf)) {
            throw 'Single file EXE / portable identity missing.'
          }
          $ident = Get-Content $identityPath -Raw | ConvertFrom-Json
          $exeHash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $bridgeHash = (Get-FileHash $env:SG7_NATIVE_BRIDGE -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceSha = (git -C .\ARSAS rev-parse HEAD).Trim().ToLowerInvariant()
          $engineSha = (git -C .\ARIEC61850 rev-parse HEAD).Trim().ToLowerInvariant()
          $lock = Get-Content '.\ARSAS\engines\ARIEC61850.lock.json' -Raw | ConvertFrom-Json
          if ($ident.sourceCommit -cne $env:SOURCE_SHA -or
              $ident.engineCommit -cne $env:EXPERIMENTAL_ENGINE -or
              $ident.ardIrecBridgeSha256 -cne $bridgeHash -or
              $ident.portableSha256 -cne $exeHash -or
              $sourceSha -cne $env:SOURCE_SHA -or
              $engineSha -cne $env:EXPERIMENTAL_ENGINE -or
              $lock.commit -cne $env:BASELINE_ENGINE -or
              $engineSha -ceq $env:BASELINE_ENGINE) {
            throw 'Exact SHA provenance, binary hash, or unchanged production lock failed.'
          }
          $exePath = (Resolve-Path $source).Path
          $proc = Start-Process -FilePath $exePath -ArgumentList @('--portable-smoke-test') -PassThru
          if (-not $proc.WaitForExit(90000)) {
            $proc.Kill()
            throw 'Portable EXE smoke timeout.'
          }
          if ($proc.ExitCode -ne 0) { throw "Portable EXE smoke failed: $($proc.ExitCode)" }
          $out = '.\ARSAS\TestResults\sg7-bcu-fat-trial'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $name = 'ARSAS-SG7_BCU-ED2-FAT-TRIAL-' + $engineSha.Substring(0,8) + '-win-x64.exe'
          $exe = Join-Path $out $name
          Copy-Item $source $exe -Force
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $exeHash) {
            throw 'Staged trial EXE differs from smoke-tested EXE.'
          }
          Copy-Item $identityPath (Join-Path $out 'portable-build-identity.json') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'sg7-ardirec-ctest.xml') (Join-Path $out 'native-ardirec-ctest.xml') -Force
          [ordered]@{
            schemaVersion = 1
            kind = 'arsas-nonrelease-supervised-iec61850-ed2-fat-trial'
            sourceSha = $sourceSha
            engineTrialSha = $engineSha
            sourceApprovedEngineSha = $lock.commit
            ardIrecSourceSha = $ident.ardIrecLockCommit
            nativeBridgeSha256 = $bridgeHash
            exeFileName = $name
            exeSha256 = $exeHash
            exeSizeBytes = (Get-Item $exe).Length
            smokeTestExitCode = $proc.ExitCode
            regressionTrx = 'ci-p1-shadow.trx'
            externalRelayTestPerformed = $false
            productionReleaseAuthority = $false
          } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out 'FAT-TRIAL-SHA256.json') -Encoding utf8
          @'
          ARSAS SG7_BCU IEC 61850 EDITION 2 | SUPERVISED FAT TRIAL
          -------------------------------------------------------
          THIS IS NOT AN OFFICIAL RELEASE; NO PHYSICAL RELAY TEST HAS BEEN PERFORMED.
          Extract the EXE. Check its SHA256 against FAT-TRIAL-SHA256.json
          using PowerShell: Get-FileHash -Algorithm SHA256 .\ARSAS-SG7_BCU-*.exe
          Single-file self-contained Windows x64, pinned native bridge included.
          Stage 1: Connect / discover / monitor / reporting READ ONLY.
          Stage 2: Inspect verified Command Dock candidates, including renamed
          GE Bkr0XCBR2.Pos, disconnector and TapChg, and confirm StatusOnly blocked.
          Stage 3: Only under test engineer/operator approval, physically isolated
          safe bench and documented switching permission, test SBOw / Operate /
          CommandTermination; preserve interlock, negative response, LastApplError,
          actual status q/t, reporting BufferOverflow/Invalid evidence.
          No automatic Operate retry when acceptance/feedback is uncertain.
          An automation PASS does not prove physical command success.
          The repository production engine lock remains the qualified #184.
          '@ | Set-Content (Join-Path $out 'READ-ME-FIRST.txt') -Encoding utf8
          Write-Host "EXE SMOKE SUCCESS: $name SHA256 $exeHash"
          Write-Host 'SUPERVISED FAT candidate only. No release or physical command authority.'

      - name: Write non-promotion build authority manifest
        if: always()
        shell: pwsh
        env:
          ENGINE_SHA: ${{ inputs.fast_dev && inputs.engine_trial_sha != '' && inputs.engine_trial_sha || steps.engine.outputs.commit }}
          BASELINE_ENGINE_SHA: ${{ steps.engine.outputs.commit }}
          ENGINE_TRIAL_SHA: ${{ inputs.engine_trial_sha }}
          ENGINE_REPOSITORY: ${{ steps.engine.outputs.repository }}
          HISTORICAL_ENGINE_SHA: ${{ steps.engine.outputs.merged-main-commit }}
          PHYSICAL_TESTED_ENGINE_SHA: ${{ steps.engine.outputs.physical-tested-commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = (git -C .\ARSAS rev-parse HEAD).Trim().ToLowerInvariant()
          $engineActual = if (Test-Path -LiteralPath .\ARIEC61850\.git) {
            (git -C .\ARIEC61850 rev-parse HEAD).Trim().ToLowerInvariant()
          } else { '' }
          $reportFiles = @(Get-ChildItem -Path .\ARSAS\TestResults -Filter '*.trx' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name)
          $manifest = [ordered]@{
            schemaVersion = 1
            kind = if ('${{ inputs.fast_dev }}' -eq 'true') { 'ci-p1-fast-dev-nonfat' } else { 'ci-p1-nonpromotion-shadow' }
            fastDev = '${{ inputs.fast_dev }}'
            focus = '${{ inputs.focus }}'
            engineTrialSha = $env:ENGINE_TRIAL_SHA
            approvedPinnedEngineSha = $env:BASELINE_ENGINE_SHA
            engineIsExperimental = -not [string]::IsNullOrWhiteSpace($env:ENGINE_TRIAL_SHA)
            validatorLockKind = if ($env:ENGINE_TRIAL_SHA) { 'ephemeral-nonpromotion' } else { 'source-approved-lock' }
            fullRegressionQualified = ('${{ inputs.fast_dev }}' -ne 'true' -and [string]::IsNullOrWhiteSpace($env:ENGINE_TRIAL_SHA))
            exactArsasSha = $sourceSha
            exactEngineSha = $engineActual
            expectedEngineSha = $env:ENGINE_SHA
            engineRepository = $env:ENGINE_REPOSITORY
            historicalMergedEngineSha = $env:HISTORICAL_ENGINE_SHA
            historicalPhysicalTestedSha = $env:PHYSICAL_TESTED_ENGINE_SHA
            engineExactShaVerified = ($engineActual -ceq $env:ENGINE_SHA)
            testReports = $reportFiles
            workflowRunId = $env:GITHUB_RUN_ID
            noReleaseOrPromotion = $true
          }
          $path = Join-Path $env:RUNNER_TEMP 'ci-p1-shadow-manifest.json'
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $path -Encoding UTF8
          if ($manifest.engineExactShaVerified -ne $true -or $reportFiles.Count -eq 0) {
            throw 'CI-P1 shadow SHA/TRX proof is incomplete; fail closed.'
          }

      # CI-sprawl budget permits one upload action. Compute exact FAST vs
      # diagnostic paths once, without changing release or FAT authority.
      - name: Choose FAST EXE or diagnostic artifact
        id: artifact-mode
        if: always()
        shell: pwsh
        env:
          FAST_DEV: ${{ inputs.fast_dev }}
          TRIAL_SHA: ${{ inputs.engine_trial_sha }}
          FOCUS: ${{ inputs.focus }}
        run: |
          $trial = ($env:FAST_DEV -eq 'true' -and
                    $env:TRIAL_SHA -match '^[0-9a-f]{40}
          retention-days: 14
 -and
                    $env:FOCUS -eq 'command-read')
          if ($trial) {
            "artifact_name=ARSAS-SG7-BCU-FAT-TRIAL-$env:GITHUB_RUN_ID.exe" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "artifact_path=ARSAS/TestResults/sg7-bcu-fat-trial/ARSAS-SG7_BCU-ED2-FAT-TRIAL-*-win-x64.exe" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "artifact_archive=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "artifact_name=ci-p1-shadow-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "artifact_path<<END_OF_PATHS" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "ARSAS/TestResults/*.trx" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "$env:RUNNER_TEMP/ci-p1-shadow-manifest.json" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "END_OF_PATHS" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "artifact_archive=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Upload directly downloadable FAST EXE or normal CI proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-mode.outputs.artifact_name }}
          path: ${{ steps.artifact-mode.outputs.artifact_path }}
          archive: ${{ steps.artifact-mode.outputs.artifact_archive }}
          if-no-files-found: error
          retention-days: 14
          retention-days: 14
