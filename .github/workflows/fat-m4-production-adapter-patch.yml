name: FAT M4 production adapter patch

on:
  push:
    branches:
      - fix/fat-workstation-convergence
    paths:
      - tools/fat_m4_production_adapter_patch.py
      - .github/workflows/fat-m4-production-adapter-patch.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fat-workstation-convergence
          fetch-depth: 0
      - name: Apply guarded M4 production adapter wiring
        run: python3 tools/fat_m4_production_adapter_patch.py
      - name: Remove one-shot helpers
        run: rm tools/fat_m4_production_adapter_patch.py .github/workflows/fat-m4-production-adapter-patch.yml
      - name: Commit generated source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/IoTesting/IoTestMultiSessionCoordinator.cs IoListTestingWindow.xaml.cs tools/fat_m4_production_adapter_patch.py .github/workflows/fat-m4-production-adapter-patch.yml
          git commit -m "M4: latch production FAT target across prepare and continue"
          git push origin HEAD:fix/fat-workstation-convergence
