name: CI P1 Advisory Classifier and Opt-in Shadow

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/classify-ci-changes.py"
      - "scripts/test-classify-ci-changes.py"
      - "scripts/resolve-ariec-lock.ps1"
      - "scripts/test-resolve-ariec-lock.ps1"
      - "engines/**"
      - "Services/**"
      - "Models/**"
      - "tests/**"
      - "evidence/**"
      - "engine-patches/**"
      - "*.cs"
      - "*.csproj"
      - "*.sln"
      - "*.xaml"
      - "MainWindow*.cs"
  workflow_dispatch:
    inputs:
      fast_dev:
        description: 'FAST DEV compile + scoped regression; never release qualified'
        type: boolean
        default: false
      focus:
        description: 'Focused regression group'
        type: choice
        options: [quality-browser, smv, command-read, all]
        default: quality-browser
      engine_trial_sha:
        description: 'Optional exact 40-char experimental ARIEC SHA; FAST DEV only, never FAT'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-p1-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed areas (advisory, fail-safe)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changed.outputs.build }}
      tests: ${{ steps.changed.outputs.tests }}
      iec: ${{ steps.changed.outputs.iec }}
      sv: ${{ steps.changed.outputs.sv }}
      io: ${{ steps.changed.outputs.io }}
      packaging: ${{ steps.changed.outputs.packaging }}
      ci: ${{ steps.changed.outputs.ci }}
      risk: ${{ steps.changed.outputs.risk }}
      engine_trial_sha: ${{ steps.trial.outputs.sha }}
    steps:
      - name: Checkout PR merge source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Run conservative classifier fixtures
        run: python3 scripts/test-classify-ci-changes.py

      - id: changed
        name: Classify exact PR merge diff or conservative fallback
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/classify-ci-changes.py \
              --from-pr-merge \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/classify-ci-changes.py \
              --paths "__unclassified_source_change__" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

      - id: trial
        name: Resolve explicit nonrelease engine trial (label-gated)
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-p1-shadow') }}
        shell: bash
        run: |
          if [[ -f engines/ARIEC61850.trial.json ]]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re

          with open("engines/ARIEC61850.lock.json", encoding="utf-8") as handle:
              production = json.load(handle)
          with open("engines/ARIEC61850.trial.json", encoding="utf-8") as handle:
              trial = json.load(handle)
          sha = str(trial.get("commit", ""))
          if (not re.fullmatch(r"[0-9a-f]{40}", sha)
              or trial.get("runMode") != "fast-dev-nonpromotion"
              or trial.get("scope") != "command-read"
              or sha == production.get("commit")):
              raise SystemExit("Invalid or non-isolated engine trial manifest")
          print("sha=" + sha)
          PY
          fi

  windows-shadow:
    name: Compare reusable build/test with legacy authority
    needs: classify
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' ||
         github.head_ref == 'ci/p1-fast-gate-shadow' ||
         contains(github.event.pull_request.labels.*.name, 'ci-p1-shadow')) &&
        (needs.classify.outputs.build == 'true' ||
         github.head_ref == 'ci/p1-fast-gate-shadow')
      }}
    uses: ./.github/workflows/_ci-p1-windows-build-test.yml
    with:
      # PR validation must package the immutable branch HEAD, not GitHub's
      # synthetic refs/pull/<n>/merge SHA. The synthetic merge remains covered
      # independently by canonical PR CI; FAST DEV evidence must match the
      # exact operator-downloaded source revision.
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      shadow_mode: true
      fast_dev: ${{ (github.event_name == 'workflow_dispatch' && inputs.fast_dev == true) || (github.event_name == 'pull_request' && needs.classify.outputs.engine_trial_sha != '') }}
      focus: ${{ github.event_name == 'workflow_dispatch' && inputs.fast_dev == true && inputs.focus || needs.classify.outputs.engine_trial_sha != '' && 'command-read' || 'all' }}
      engine_trial_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.fast_dev == true && inputs.engine_trial_sha || needs.classify.outputs.engine_trial_sha || '' }}
    secrets: {}
