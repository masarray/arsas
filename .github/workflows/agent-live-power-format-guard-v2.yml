name: Agent live power formatting guard v2

on:
  push:
    branches:
      - agent/fix-live-power-measurements

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize reviewed indentation by unique anchors
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('Services/NativeMmsDiscoveryMapper.cs')
          lines = path.read_text(encoding='utf-8').splitlines()

          def unique_index(text):
              matches = [i for i, line in enumerate(lines) if line.strip() == text]
              if len(matches) != 1:
                  raise SystemExit(f'format guard failed for {text}: matches={len(matches)}')
              return matches[0]

          first = unique_index('if (IsFundamentalScalarMeasurementObject(first))')
          expected_first = [
              'if (IsFundamentalScalarMeasurementObject(first))',
              '{',
              'if (current.Any(p => string.Equals(p, "mag", StringComparison.OrdinalIgnoreCase) ||',
              'string.Equals(p, "instMag", StringComparison.OrdinalIgnoreCase)))',
              'yield return Append(current, "f");',
              'else',
              'yield return Append(current, "mag", "f");',
              'yield break;',
              '}',
              '',
              'if (current.Any(p => string.Equals(p, "mag", StringComparison.OrdinalIgnoreCase) ||',
              'string.Equals(p, "instMag", StringComparison.OrdinalIgnoreCase)))',
              '{'
          ]
          if [lines[first + n].strip() for n in range(len(expected_first))] != expected_first:
              raise SystemExit('format guard failed: scalar power leaf block shape changed')
          indents_first = [12, 12, 16, 20, 20, 16, 20, 16, 12, 0, 12, 16, 12]
          for n, indent in enumerate(indents_first):
              if expected_first[n] == '':
                  lines[first + n] = ''
              else:
                  lines[first + n] = (' ' * indent) + expected_first[n]

          second_text = 'if ((lnClass is "MMXU" or "MMXN") && IsFundamentalScalarMeasurementObject(name))'
          second = unique_index(second_text)
          expected_second = [
              second_text,
              '{',
              'yield return new FallbackPoint(name, "MX", "mag.f", "Float32", "Measurement", InferUnitFromDataObject(name));',
              'yield break;',
              '}',
              '',
              'if (LooksLikeAnalogDataObject(name))',
              '{'
          ]
          if [lines[second + n].strip() for n in range(len(expected_second))] != expected_second:
              raise SystemExit('format guard failed: shallow scalar power block shape changed')
          indents_second = [8, 8, 12, 12, 8, 0, 8, 8]
          for n, indent in enumerate(indents_second):
              if expected_second[n] == '':
                  lines[second + n] = ''
              else:
                  lines[second + n] = (' ' * indent) + expected_second[n]

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          '@ | python -

      - name: Resolve and checkout locked engine
        shell: pwsh
        run: |
          $lock = Get-Content .\engines\ARIEC61850.lock.json -Raw | ConvertFrom-Json
          if ($lock.repository -notmatch '^[^/]+/[^/]+$' -or $lock.commit -notmatch '^[0-9a-f]{40}$') { throw "Invalid engine lock" }
          $enginePath = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "ARIEC61850"
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$($lock.repository).git" $enginePath
          git -C $enginePath fetch --quiet --depth 1 origin $lock.commit
          git -C $enginePath checkout --quiet --detach $lock.commit
          if ((git -C $enginePath rev-parse HEAD).Trim() -ne $lock.commit) { throw "Engine pin mismatch" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Re-run targeted and full regression suite
        shell: pwsh
        run: |
          dotnet test tests/ARSAS.Tests/ARSAS.Tests.csproj --configuration Release --filter FullyQualifiedName~LivePowerMeasurementRegressionTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/ARSAS.Tests/ARSAS.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit formatting only after green verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-live-power-format-guard-v2.yml
          git add Services/NativeMmsDiscoveryMapper.cs
          git diff --cached --check
          git commit -m "style: normalize power discovery formatting"
          git push origin HEAD:agent/fix-live-power-measurements
