name: Validate ARSAS Windows installer

on:
  push:
    branches: [ main ]
    paths:
      - "installer/**"
      - "scripts/build-windows-installer.ps1"
      - "scripts/create-windows-release-checksums.ps1"
      - "scripts/publish-windows-portable.ps1"
      - "scripts/stage-ardirec-viewer.ps1"
      - "scripts/write-ci-package-manifest.py"
      - "scripts/verify-ci-package-reuse.py"
      - "scripts/test-ci-package-reuse.py"
      - ".github/workflows/build.yml"
      - ".github/workflows/installer-windows.yml"
      - "FaultRecordWindow.ComtradeOpen.cs"
      - "ComtradeWorkspaceWindow*"
      - "Controls/Comtrade*"
      - "Services/ArdIrec*"
      - "Services/Comtrade*"
      - "tests/ARSAS.Tests/ArdIrec*Tests.cs"
      - "tests/ARSAS.Tests/Comtrade*Tests.cs"
      - "ArIED61850Tester.csproj"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Services/NativeIec61850Client.cs"
      - "Services/NativeIec61850Client.SmartDiscoveryCapture.cs"
      - "Services/NativeIec61850Client.SmartDiscoveryLifecycle.cs"
      - "scripts/enable-smart-discovery-capture.ps1"
      - "tests/ARSAS.Tests/SmartDiscoveryProductionPromotionRegressionTests.cs"
      - "VERSION"
      - "engines/ARIEC61850.lock.json"
      - "engines/ARDIREC.lock.json"
  pull_request:
    paths:
      - "installer/**"
      - "scripts/build-windows-installer.ps1"
      - "scripts/create-windows-release-checksums.ps1"
      - "scripts/publish-windows-portable.ps1"
      - "scripts/stage-ardirec-viewer.ps1"
      - "scripts/write-ci-package-manifest.py"
      - "scripts/verify-ci-package-reuse.py"
      - "scripts/test-ci-package-reuse.py"
      - ".github/workflows/build.yml"
      - ".github/workflows/installer-windows.yml"
      - "FaultRecordWindow.ComtradeOpen.cs"
      - "ComtradeWorkspaceWindow*"
      - "Controls/Comtrade*"
      - "Services/ArdIrec*"
      - "Services/Comtrade*"
      - "tests/ARSAS.Tests/ArdIrec*Tests.cs"
      - "tests/ARSAS.Tests/Comtrade*Tests.cs"
      - "ArIED61850Tester.csproj"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Services/NativeIec61850Client.cs"
      - "Services/NativeIec61850Client.SmartDiscoveryCapture.cs"
      - "Services/NativeIec61850Client.SmartDiscoveryLifecycle.cs"
      - "scripts/enable-smart-discovery-capture.ps1"
      - "tests/ARSAS.Tests/SmartDiscoveryProductionPromotionRegressionTests.cs"
      - "VERSION"
      - "engines/ARIEC61850.lock.json"
      - "engines/ARDIREC.lock.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installer:
    name: Build install and field-runtime smoke test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact ARSAS application revision
        uses: actions/checkout@v7
        with:
          path: ArIED61850Tester
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact installer source identity
        shell: powershell
        run: |
          $actual = (git -C .\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:GITHUB_SHA.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Installer source mismatch. Expected $expected, got $actual."
          }

      - name: Resolve application version and immutable engine locks
        shell: powershell
        run: |
          [xml]$versionProps = Get-Content ".\ArIED61850Tester\Directory.Build.props" -Raw
          [xml]$project = Get-Content ".\ArIED61850Tester\ArIED61850Tester.csproj" -Raw
          $version = [string]$versionProps.Project.PropertyGroup.Version
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $versionFile = (Get-Content ".\ArIED61850Tester\VERSION" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$' -or
              $projectVersion -ne $version -or $versionFile -ne $version) {
            throw "ARSAS version metadata is inconsistent: props=$version project=$projectVersion VERSION=$versionFile"
          }

          $iecLock = Get-Content ".\ArIED61850Tester\engines\ARIEC61850.lock.json" -Raw | ConvertFrom-Json
          if ($iecLock.repository -notmatch '^[^/]+/[^/]+$' -or
              $iecLock.ref -ne 'main' -or $iecLock.commit -notmatch '^[0-9a-f]{40}$') {
            throw "ARIEC61850 lock metadata is invalid."
          }

          $ardirecLock = Get-Content ".\ArIED61850Tester\engines\ARDIREC.lock.json" -Raw | ConvertFrom-Json
          if ($ardirecLock.schema -ne 3 -or
              $ardirecLock.repository -notmatch '^[^/]+/[^/]+$' -or
              $ardirecLock.commit -notmatch '^[0-9a-f]{40}$' -or
              $ardirecLock.bridge.abi -ne 1 -or
              $ardirecLock.bridge.relativeLibrary -ne 'Tools/ArdIrec/ardirec_bridge.dll' -or
              $ardirecLock.bridge.mode -ne 'native-only') {
            throw "ArdIrec P1D.5 bridge-only lock metadata is invalid."
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARIEC61850_REPOSITORY=$($iecLock.repository)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARIEC61850_COMMIT=$($iecLock.commit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARDIREC_REPOSITORY=$($ardirecLock.repository)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARDIREC_COMMIT=$($ardirecLock.commit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python for sealed package verification
        if: github.event_name != 'workflow_dispatch'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run offline package verifier safety fixtures
        if: github.event_name != 'workflow_dispatch'
        run: python .\ArIED61850Tester\scripts\test-ci-package-reuse.py

      - name: Reuse exact tested canonical Windows package
        if: github.event_name != 'workflow_dispatch'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $eventName = 'pull_request'
            $headBranch = $env:PR_HEAD_BRANCH
            $headSha = $env:PR_HEAD_SHA
          }
          else {
            $eventName = 'push'
            $headBranch = 'main'
            $headSha = $env:GITHUB_SHA
          }

          $packageRoot = Join-Path $env:RUNNER_TEMP 'arsas-canonical-windows-package'
          $proofPath = Join-Path $env:RUNNER_TEMP 'arsas-canonical-windows-package-proof.json'
          python .\ArIED61850Tester\scripts\verify-ci-package-reuse.py `
            --repository $env:GITHUB_REPOSITORY `
            --head-branch $headBranch `
            --head-sha $headSha `
            --source-sha $env:GITHUB_SHA `
            --engine-sha $env:ARIEC61850_COMMIT `
            --ardirec-sha $env:ARDIREC_COMMIT `
            --event-name $eventName `
            --wait-seconds 1200 `
            --allow-in-progress-artifact `
            --output-dir $packageRoot `
            --proof-output $proofPath
          if ($LASTEXITCODE -ne 0) {
            throw "Installer requires the exact sealed Build ARSAS package payload."
          }

          $proof = Get-Content $proofPath -Raw | ConvertFrom-Json
          if ($proof.sourceSha -ne $env:GITHUB_SHA -or
              $proof.engineSha -ne $env:ARIEC61850_COMMIT -or
              $proof.ardirecSha -ne $env:ARDIREC_COMMIT -or
              $proof.version -ne $env:APP_VERSION -or
              [int]$proof.failed -ne 0 -or
              [int]$proof.notExecuted -ne 0 -or
              [int]$proof.passed -lt 1 -or
              [bool]$proof.releasePromotionAuthority) {
            throw "Canonical Windows package proof does not match installer source authority."
          }

          $installerInput = Join-Path $packageRoot ($proof.installerInputRoot -replace '/', '\')
          $testAssembly = Join-Path $packageRoot ($proof.testAssemblyPath -replace '/', '\')
          $comtradeFixture = Join-Path $packageRoot ($proof.comtradeFixturePath -replace '/', '\')
          $locusFixture = Join-Path $packageRoot ($proof.locusFixturePath -replace '/', '\')
          foreach ($required in @($installerInput, $testAssembly, $comtradeFixture, $locusFixture)) {
            if (-not (Test-Path $required)) {
              throw "Verified package materialization is incomplete: $required"
            }
          }

          "INSTALLER_INPUT_DIR=$installerInput" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_TEST_ASSEMBLY=$testAssembly" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_COMTRADE_FIXTURE=$comtradeFixture" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_LOCUS_FIXTURE=$locusFixture" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_PACKAGE_RUN=$($proof.canonicalRunId)/$($proof.canonicalRunAttempt)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_PACKAGE_ARTIFACT_SHA256=$($proof.artifactSha256)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          @(
            '## CI-P3 installer package reuse',
            '',
            "- exact source: $env:GITHUB_SHA",
            "- engine: $env:ARIEC61850_COMMIT",
            "- ArdIrec: $env:ARDIREC_COMMIT",
            "- Build ARSAS run: $($proof.canonicalRunId)/$($proof.canonicalRunAttempt)",
            "- full regression: $($proof.passed) passed, $($proof.failed) failed",
            "- package files: $($proof.fileCount)",
            "- proof stage: $($proof.proofStage)",
            '- installer remains separate compile/install/runtime-smoke authority'
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Checkout immutable ARIEC61850 engine revision for manual build
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$env:ARIEC61850_REPOSITORY.git" ARIEC61850
          git -C .\ARIEC61850 fetch --quiet --depth 1 origin $env:ARIEC61850_COMMIT
          git -C .\ARIEC61850 checkout --quiet --detach $env:ARIEC61850_COMMIT
          $actual = (git -C .\ARIEC61850 rev-parse HEAD).Trim()
          if ($actual -ne $env:ARIEC61850_COMMIT) { throw "ARIEC61850 pin mismatch." }

      - name: Checkout immutable ArdIrec engine revision for manual build
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$env:ARDIREC_REPOSITORY.git" ArdIrec
          git -C .\ArdIrec fetch --quiet --depth 1 origin $env:ARDIREC_COMMIT
          git -C .\ArdIrec checkout --quiet --detach $env:ARDIREC_COMMIT
          $actual = (git -C .\ArdIrec rev-parse HEAD).Trim()
          if ($actual -ne $env:ARDIREC_COMMIT) { throw "ArdIrec pin mismatch. Expected $env:ARDIREC_COMMIT got $actual." }

      - name: Setup .NET 8 for native verification
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Verify physical-proven Smart Discovery route
        shell: powershell
        run: |
          $native = '.\ArIED61850Tester\Services\NativeIec61850Client.cs'
          $before = (Get-FileHash $native -Algorithm SHA256).Hash
          & .\ArIED61850Tester\scripts\enable-smart-discovery-capture.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Installer refuses a legacy/incomplete Smart Discovery route.' }
          $after = (Get-FileHash $native -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Installer verification mutated discovery source.' }

      - name: Restore build and test application solution for manual packaging
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          dotnet restore .\ArIED61850Tester\ArIED61850Tester.sln
          if ($LASTEXITCODE -ne 0) { throw "Solution restore failed." }
          dotnet build .\ArIED61850Tester\ArIED61850Tester.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Solution build failed." }
          dotnet test .\ArIED61850Tester\tests\ARSAS.Tests\ARSAS.Tests.csproj -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Application regression tests failed." }

      - name: Publish installer source for manual packaging
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          .\ArIED61850Tester\scripts\publish-windows-portable.ps1 `
            -Version $env:APP_VERSION `
            -Runtime win-x64 `
            -SingleFile $false `
            -SelfContained $true `
            -EngineProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850\AR.Iec61850.csproj" `
            -NpcapProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850.Transports.Npcap\AR.Iec61850.Transports.Npcap.csproj"
          if ($LASTEXITCODE -ne 0) { throw "Manual installer source publish failed." }

      - name: Stage pinned ArdIrec native analysis bridge for manual packaging
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          .\ArIED61850Tester\scripts\stage-ardirec-viewer.ps1 `
            -ArdIrecSource "$env:GITHUB_WORKSPACE\ArdIrec" `
            -PublishedDirectory "$env:GITHUB_WORKSPACE\ArIED61850Tester\dist\ARSAS-$env:APP_VERSION-win-x64" `
            -BuildDirectory "$env:RUNNER_TEMP\ardirec-installer-build"
          if ($LASTEXITCODE -ne 0) { throw "Manual ArdIrec staging failed." }

          "INSTALLER_INPUT_DIR=$env:GITHUB_WORKSPACE\ArIED61850Tester\dist\ARSAS-$env:APP_VERSION-win-x64" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_TEST_ASSEMBLY=$env:GITHUB_WORKSPACE\ArIED61850Tester\tests\ARSAS.Tests\bin\Release\net8.0-windows\ARSAS.Tests.dll" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_COMTRADE_FIXTURE=$env:GITHUB_WORKSPACE\ArdIrec\tests\data\minimal_1999.cfg" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_LOCUS_FIXTURE=$env:GITHUB_WORKSPACE\ArdIrec\tests\data\distance_p1.cfg" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANONICAL_PACKAGE_RUN=manual-local-build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup compiler
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Compile installer from exact tested payload
        shell: powershell
        run: |
          .\ArIED61850Tester\scripts\build-windows-installer.ps1 `
            -Version $env:APP_VERSION `
            -Runtime win-x64 `
            -PublishedDirectory $env:INSTALLER_INPUT_DIR `
            -OutputDirectory "$env:GITHUB_WORKSPACE\ArIED61850Tester\dist" `
            -TestAssemblyPath $env:CANONICAL_TEST_ASSEMBLY `
            -FixtureCfg $env:CANONICAL_COMTRADE_FIXTURE `
            -LocusFixtureCfg $env:CANONICAL_LOCUS_FIXTURE

      - name: Silent install and field-runtime smoke test
        shell: powershell
        run: |
          $installerPath = ".\ArIED61850Tester\dist\ARSAS-$env:APP_VERSION-win-x64-setup.exe"
          if (-not (Test-Path $installerPath -PathType Leaf)) { throw "Installer not found: $installerPath" }
          $installRoot = Join-Path $env:RUNNER_TEMP "ARSAS-installer-smoke"
          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }

          $install = Start-Process -FilePath $installerPath -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=$installRoot"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }

          foreach ($file in @(
            "ARSAS.exe",
            "AR.Iec61850.Transports.Npcap.dll",
            "SharpPcap.dll",
            "PacketDotNet.dll",
            "Tools\ArdIrec\ardirec_bridge.dll"
          )) {
            $installedFile = Join-Path $installRoot $file
            if (-not (Test-Path $installedFile -PathType Leaf)) { throw "Missing installed file: $installedFile" }
          }
          foreach ($removed in @(
            "Tools\ArdIrec\ardirec.exe",
            "Tools\ArdIrec\Qt6Core.dll",
            "Tools\ArdIrec\Qt6Gui.dll",
            "Tools\ArdIrec\Qt6Qml.dll",
            "Tools\ArdIrec\Qt6Quick.dll",
            "Tools\ArdIrec\platforms\qwindows.dll"
          )) {
            $path = Join-Path $installRoot $removed
            if (Test-Path $path) { throw "Removed desktop fallback is still packaged: $path" }
          }

          $env:ARSAS_ARDIREC_BRIDGE_PATH = Join-Path $installRoot "Tools\ArdIrec\ardirec_bridge.dll"
          $env:ARSAS_NATIVE_COMTRADE_TEST_CFG = $env:CANONICAL_COMTRADE_FIXTURE
          $env:ARSAS_NATIVE_LOCUS_TEST_CFG = $env:CANONICAL_LOCUS_FIXTURE
          & dotnet vstest $env:CANONICAL_TEST_ASSEMBLY `
            "--TestCaseFilter:FullyQualifiedName~ArdIrecNativeBridgeIntegrationTests|FullyQualifiedName~ArdIrecLocusNativeSessionIntegrationTests"
          if ($LASTEXITCODE -ne 0) { throw "Installed bridge/locus runtime validation failed." }

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "Uninstaller was not created." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }

      - name: Create release checksums
        shell: powershell
        run: |
          .\ArIED61850Tester\scripts\create-windows-release-checksums.ps1 `
            -Version $env:APP_VERSION `
            -Runtime win-x64 `
            -DistDirectory "$env:GITHUB_WORKSPACE\ArIED61850Tester\dist"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-${{ env.APP_VERSION }}-win-x64-installer
          if-no-files-found: error
          path: |
            ArIED61850Tester/dist/ARSAS-${{ env.APP_VERSION }}-win-x64-setup.exe
            ArIED61850Tester/dist/SHA256SUMS.txt
