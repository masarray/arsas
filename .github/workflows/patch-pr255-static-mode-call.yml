name: Patch PR255 Static mode registry call

on:
  push:
    branches:
      - fix/static-dataset-report-projection-parity
    paths:
      - .github/workflows/patch-pr255-static-mode-call.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/static-dataset-report-projection-parity
          fetch-depth: 0
      - name: Fix Static mode registry call
        shell: python
        run: |
          from pathlib import Path
          path = Path('Services/NativeIec61850Client.HybridReporting.cs')
          text = path.read_text(encoding='utf-8')
          old = 'Iec61850MonitoringModeRegistry.IsStaticDataSetReportOnly(device.DeviceId)'
          new = 'Iec61850MonitoringModeRegistry.IsStaticDataSetReportOnly(device)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one registry-call anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix and remove staging workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-pr255-static-mode-call.yml
          git add Services/NativeIec61850Client.HybridReporting.cs
          git commit -m "fix: use device identity for Static mode registry"
          git push origin HEAD:fix/static-dataset-report-projection-parity
