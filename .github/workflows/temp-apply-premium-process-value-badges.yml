name: Temporary premium process-value badge patch

on:
  push:
    branches:
      - ui/premium-process-value-badges

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/premium-process-value-badges
          fetch-depth: 0
      - name: Apply process-value presentation patch
        run: python scripts/patch-premium-process-value-badges.py
      - name: Validate diff
        run: git diff --check
      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Presentation patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml Models/MonitorModels.cs Services/Iec61850MonitorRuntime.cs
          git commit -m "Use premium semantic badges for process values"
          git push origin HEAD:ui/premium-process-value-badges
