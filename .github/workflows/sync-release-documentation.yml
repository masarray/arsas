name: Synchronize release documentation evidence

on:
  push:
    branches: [ main ]
    paths:
      - ".release/windows.json"
      - ".github/workflows/sync-release-documentation.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-release-documentation
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize stable release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve latest published stable release from GitHub
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Documentation follows the already-published GitHub stable channel,
          # not the main branch's potentially older application VERSION.
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "GitHub latest stable tag is invalid: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read exact GitHub Release metadata and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _release-sync
          release_ready=false
          for attempt in $(seq 1 60); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > _release-sync/release.tmp.json 2>/dev/null; then
              mv _release-sync/release.tmp.json _release-sync/release.json
              release_ready=true
              break
            fi
            echo "Release $RELEASE_TAG is not visible yet (attempt $attempt/60); retrying in 10 seconds."
            sleep 10
          done
          if [[ "$release_ready" != "true" ]]; then
            echo "Published release $RELEASE_TAG did not become visible within the synchronization window." >&2
            exit 1
          fi

          checksum_ready=false
          for attempt in $(seq 1 12); do
            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir _release-sync \
              --pattern 'ARSAS-Windows-x64-SHA256SUMS.txt' \
              --clobber; then
              checksum_ready=true
              break
            fi
            echo "Checksum asset is not downloadable yet (attempt $attempt/12); retrying in 10 seconds."
            sleep 10
          done
          if [[ "$checksum_ready" != "true" ]]; then
            echo "Checksum asset for $RELEASE_TAG did not become downloadable." >&2
            exit 1
          fi
          git fetch --tags --force
          source_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve tagged source commit for $RELEASE_TAG" >&2
            exit 1
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

      - name: Build normalized public release evidence
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          root = Path("_release-sync")
          release = json.loads((root / "release.json").read_text(encoding="utf-8"))
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("Only a published stable release may feed public documentation")
          if release.get("tag_name") != os.environ["RELEASE_TAG"]:
              raise SystemExit("Release tag does not match VERSION")

          assets = {item.get("name"): item for item in release.get("assets", [])}
          required = {
              "installer": "ARSAS-Windows-x64-Setup.exe",
              "portable": "ARSAS-Windows-x64-Portable.exe",
              "checksums": "ARSAS-Windows-x64-SHA256SUMS.txt",
          }
          for name in required.values():
              if name not in assets:
                  raise SystemExit(f"Required release asset is missing: {name}")

          checksum_path = root / required["checksums"]
          hashes = {}
          for line in checksum_path.read_text(encoding="ascii").splitlines():
              match = re.fullmatch(r"([0-9a-fA-F]{64})\s+\*?(.+)", line.strip())
              if match:
                  hashes[match.group(2).strip()] = match.group(1).lower()
          for name in (required["installer"], required["portable"]):
              if name not in hashes:
                  raise SystemExit(f"SHA-256 is missing for {name}")
              if int(assets[name].get("size", 0)) < 1_000_000:
                  raise SystemExit(f"Release asset size is invalid for {name}")

          stable_root = "https://github.com/masarray/arsas/releases/latest/download"
          evidence = {
              "schemaVersion": 1,
              "product": "ARSAS",
              "version": os.environ["RELEASE_VERSION"],
              "tag": os.environ["RELEASE_TAG"],
              "channel": "stable",
              "publishedAtUtc": release["published_at"],
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "releaseUrl": release["html_url"],
              "installer": {
                  "name": required["installer"],
                  "url": f"{stable_root}/{required['installer']}",
                  "sha256": hashes[required["installer"]],
                  "sizeBytes": int(assets[required["installer"]]["size"]),
              },
              "portable": {
                  "name": required["portable"],
                  "url": f"{stable_root}/{required['portable']}",
                  "sha256": hashes[required["portable"]],
                  "sizeBytes": int(assets[required["portable"]]["size"]),
              },
              "checksums": {
                  "name": required["checksums"],
                  "url": f"{stable_root}/{required['checksums']}",
                  "sizeBytes": int(assets[required["checksums"]]["size"]),
              },
              "codeSigning": {
                  "status": "unsigned",
                  "platform": "Authenticode",
                  "detail": "The current public Windows installer and portable binaries do not carry a commercial Authenticode publisher signature. Verify the published SHA-256 value before use. SmartScreen warnings are therefore possible and are not hidden from users.",
              },
          }
          rendered = json.dumps(evidence, indent=2) + "\n"
          (root / "published.json").write_text(rendered, encoding="utf-8")

      - name: Validate normalized evidence
        shell: python
        run: |
          import json
          import re
          from pathlib import Path
          evidence = json.loads(Path("_release-sync/published.json").read_text())
          if evidence.get("schemaVersion") != 1 or evidence.get("product") != "ARSAS" or evidence.get("channel") != "stable":
              raise SystemExit("Normalized release identity is invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", evidence.get("sourceCommit", "")):
              raise SystemExit("Tagged source commit is invalid")
          for key in ("installer", "portable"):
              item = evidence[key]
              if not re.fullmatch(r"[0-9a-f]{64}", item.get("sha256", "")) or int(item.get("sizeBytes", 0)) < 1_000_000:
                  raise SystemExit(f"Invalid {key} evidence")

      - name: Synchronize landing release notes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync-landing-release.py \
            --evidence _release-sync/published.json \
            --release _release-sync/release.json \
            --notes landing/release-notes.json

      - name: Update public landing release records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_STABLE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Publication truth must not change while this runner is syncing.
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest_tag" != "$EXPECTED_STABLE_TAG" ]; then
            echo "A newer stable release appeared; refusing to publish stale landing records." >&2
            exit 1
          fi
          git fetch origin main
          # This checkout may contain CRLF-normalized or generated tracked
          # evidence that belongs to a DIFFERENT workflow. Rebase/autostash
          # against it is unsafe. Commit reviewed landing files in an isolated
          # fresh worktree based on the newest published main instead.
          clean_tree="$RUNNER_TEMP/arsas-release-landing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add --detach "$clean_tree" origin/main
          cp landing/latest.json "$clean_tree/landing/latest.json"
          cp landing/release-notes.json "$clean_tree/landing/release-notes.json"
          git -C "$clean_tree" config user.name "github-actions[bot]"
          git -C "$clean_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$clean_tree" add -- landing/latest.json landing/release-notes.json
          staged="$(git -C "$clean_tree" diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "Public landing release records are already synchronized."
          else
            while IFS= read -r file; do
              case "$file" in
                landing/latest.json|landing/release-notes.json) ;;
                *) echo "Unexpected staged release file: $file" >&2; exit 1 ;;
              esac
            done <<< "$staged"
            git -C "$clean_tree" commit -m "docs: synchronize ARSAS ${{ steps.version.outputs.version }} release landing"
            # Fast-forward only. If main changed concurrently, fail closed and
            # rerun against the new main; never force-update release metadata.
            git -C "$clean_tree" push origin HEAD:main
          fi

      - name: Update independent release-evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w 0 _release-sync/published.json)"
          api_path="repos/$GITHUB_REPOSITORY/contents/published.json"
          existing_sha="$(gh api "$api_path?ref=release-evidence" --jq .sha)"
          body="$(python - "$content" "$existing_sha" <<'PY'
          import json, sys
          print(json.dumps({
              "message": "docs: synchronize stable ARSAS release evidence",
              "content": sys.argv[1],
              "sha": sys.argv[2],
              "branch": "release-evidence",
          }))
          PY
          )"
          printf '%s' "$body" | gh api --method PUT "$api_path" --input - >/dev/null

      - name: Dispatch synchronized product website
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched Pages deployment for synchronized stable release ${{ steps.version.outputs.version }}."

      - name: Summarize synchronized release
        shell: python
        run: |
          import json
          from pathlib import Path
          value = json.loads(Path("_release-sync/published.json").read_text())
          print(f"ARSAS {value['version']} release documentation evidence synchronized")
          print(f"Installer: {value['installer']['sizeBytes']} bytes · {value['installer']['sha256']}")
          print(f"Portable: {value['portable']['sizeBytes']} bytes · {value['portable']['sha256']}")
