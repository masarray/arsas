name: v1.6.36 real IED authority root fix

on:
  push:
    branches:
      - fix/v1636-real-ied-feedback-smooth-analyzers
    paths:
      - .github/workflows/v1636-real-ied-authority-root-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/v1636-real-ied-feedback-smooth-analyzers
          fetch-depth: 0

      - name: Remove command-derived process authority at the root
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          runtime_path = Path("Services/Iec61850MonitorRuntime.cs")
          source = runtime_path.read_text(encoding="utf-8")

          field_block = '''        public string CommandFeedbackValue { get; set; } = string.Empty;
          public DateTime LastCommandFeedbackUtc { get; set; } = DateTime.MinValue;
          public DateTime CommandFeedbackGuardUntilUtc { get; set; } = DateTime.MinValue;
          public DateTime CommandReportDeadlineUtc { get; set; } = DateTime.MinValue;
          public bool AwaitingCommandReportEdge { get; set; }
          public bool CommandReportMissLogged { get; set; }
          public bool StaleReportSuppressedLogged { get; set; }
          '''
          if field_block not in source:
              raise SystemExit("command-feedback state block not found exactly")
          source = source.replace(field_block, "", 1)

          def cut_between(text: str, start_marker: str, end_marker: str, label: str) -> str:
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:start] + text[end:]

          source = cut_between(
              source,
              "    private void ApplyControlFeedbackToMonitor(DeviceSession session, SignalDefinition signal, string feedbackValue)\n",
              "    public HybridReportPhysicalValidationSnapshot CaptureHybridReportPhysicalValidation(string deviceId)\n",
              "synthetic control feedback injector")

          source = cut_between(
              source,
              "                var hasSourceTimestamp = TryParseReportTimestampUtc(update.ReportTimestamp, out var reportSourceUtc);\n",
              "                var hadValueBeforeReport = state.HasValue;\n",
              "command/report stale suppression prelude")

          correlation_start = "                if (commandValueMatches &&\n"
          correlation_end = "                var reportSource = string.IsNullOrWhiteSpace(state.AcquisitionLabel)\n"
          start = source.find(correlation_start)
          if start < 0:
              raise SystemExit("command/report correlation block start not found")
          end = source.find(correlation_end, start)
          if end < 0:
              raise SystemExit("command/report correlation block end not found")
          replacement = '''                // IEC 61850 process truth comes from independent acquisition, never from
          // a prior control result. A real IED report is therefore never suppressed,
          // rewritten, or correlated against command-side feedback before publication.
          if (valueChangedByReport || IsChangeReportReason(update.Reason))
          {
              state.ReportChangeVerified = true;
              state.ReportMissLogged = false;
          }

          '''
          source = source[:start] + replacement + source[end:]

          source = cut_between(
              source,
              "                if (reportAssigned && state.AwaitingCommandReportEdge &&\n",
              "                var pollDetectedChange = state.HasValue && !string.Equals(state.Value, display, StringComparison.Ordinal);\n",
              "command report deadline fallback")

          source = cut_between(
              source,
              "    private static IReadOnlyList<string> BuildControlFeedbackReferences(SignalDefinition signal)\n",
              "    private static Iec61850MonitorPoint? FindPointForReportReference(DeviceSession session, string reference)\n",
              "command feedback reference helpers")

          forbidden = [
              "ApplyControlFeedbackToMonitor",
              "CommandFeedbackValue",
              "LastCommandFeedbackUtc",
              "CommandFeedbackGuardUntilUtc",
              "CommandReportDeadlineUtc",
              "AwaitingCommandReportEdge",
              "CommandReportMissLogged",
              "StaleReportSuppressedLogged",
              "BuildControlFeedbackReferences",
              "FindPointForControlFeedback",
              "stale report value {display} was suppressed after command-confirmed",
          ]
          leftovers = [token for token in forbidden if token in source]
          if leftovers:
              raise SystemExit("synthetic/correlation state remains: " + ", ".join(leftovers))
          if "not process-image authority" not in source:
              raise SystemExit("process-authority invariant comment unexpectedly missing")

          runtime_path.write_text(source, encoding="utf-8", newline="\n")

          test_path = Path("tests/ARSAS.Tests/G1ControlCorrectnessRegressionTests.cs")
          tests = test_path.read_text(encoding="utf-8")
          anchor = '        Assert.DoesNotContain("ApplyControlFeedbackToMonitor(session, request.Signal, result.FeedbackValue)", runtimeSource, StringComparison.Ordinal);\n'
          if anchor not in tests:
              raise SystemExit("G1 regression anchor not found")
          extra = '''        Assert.DoesNotContain("ApplyControlFeedbackToMonitor(", runtimeSource, StringComparison.Ordinal);
          Assert.DoesNotContain("CommandFeedbackValue", runtimeSource, StringComparison.Ordinal);
          Assert.DoesNotContain("CommandFeedbackGuardUntilUtc", runtimeSource, StringComparison.Ordinal);
          Assert.DoesNotContain("AwaitingCommandReportEdge", runtimeSource, StringComparison.Ordinal);
          Assert.DoesNotContain("BuildControlFeedbackReferences", runtimeSource, StringComparison.Ordinal);
          Assert.DoesNotContain("FindPointForControlFeedback", runtimeSource, StringComparison.Ordinal);
          Assert.Contains("A real IED report is therefore never suppressed", runtimeSource, StringComparison.Ordinal);
          '''
          if 'Assert.DoesNotContain("CommandFeedbackGuardUntilUtc"' not in tests:
              tests = tests.replace(anchor, anchor + extra, 1)
          test_path.write_text(tests, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Source-level regression gate
        shell: pwsh
        run: |
          $runtime = Get-Content .\Services\Iec61850MonitorRuntime.cs -Raw
          $tests = Get-Content .\tests\ARSAS.Tests\G1ControlCorrectnessRegressionTests.cs -Raw
          $forbidden = @(
            'ApplyControlFeedbackToMonitor',
            'CommandFeedbackValue',
            'LastCommandFeedbackUtc',
            'CommandFeedbackGuardUntilUtc',
            'CommandReportDeadlineUtc',
            'AwaitingCommandReportEdge',
            'CommandReportMissLogged',
            'StaleReportSuppressedLogged',
            'BuildControlFeedbackReferences',
            'FindPointForControlFeedback'
          )
          foreach ($token in $forbidden) {
            if ($runtime.Contains($token)) { throw "Forbidden synthetic process-authority token remains: $token" }
          }
          if (-not $runtime.Contains('A real IED report is therefore never suppressed')) {
            throw 'Independent IED report authority invariant is missing.'
          }
          if (-not $tests.Contains('CommandFeedbackGuardUntilUtc')) {
            throw 'Regression test does not protect against command-derived report suppression.'
          }
          git diff --check

      - name: Commit root-cause fix and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/v1636-real-ied-authority-root-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/Iec61850MonitorRuntime.cs tests/ARSAS.Tests/G1ControlCorrectnessRegressionTests.cs .github/workflows/v1636-real-ied-authority-root-fix.yml
          git diff --cached --check
          git commit -m "fix(control): keep process state authoritative to IED reports"
          git push origin HEAD:fix/v1636-real-ied-feedback-smooth-analyzers
