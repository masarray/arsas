name: Temporary P1 workspace inspection

on:
  push:
    branches:
      - polish/p1-workspace-noise-cleanup

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/p1-workspace-noise-cleanup
      - run: python scripts/inspect-p1-workspaces.py
