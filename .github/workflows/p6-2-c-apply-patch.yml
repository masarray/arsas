name: P6.2-C apply smart reconnect patch

on:
  push:
    branches:
      - fix/p6-2-c-smart-reconnect
    paths:
      - .p6-2-c/apply.ready

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed P6.2-C patch parts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(.p6-2-c/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No staged patch files were found."
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "Checking $patch"
            git apply --check "$patch"
            git apply "$patch"
          done
          rm -rf .p6-2-c
          rm -f .github/workflows/p6-2-c-apply-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p6.2-c): make MMS recovery bounded and staged"
          git push origin HEAD:fix/p6-2-c-smart-reconnect
