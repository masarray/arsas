name: Temporary P0 responsive bootstrap alignment

on:
  push:
    branches:
      - polish/p0-visual-system-unification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/p0-visual-system-unification
          fetch-depth: 0
      - run: python scripts/align-p0-responsive-bootstrap.py
      - run: git diff --check
      - name: Commit aligned presentation source
        shell: bash
        run: |
          if git diff --quiet -- MainWindow.xaml SasOperationalUiPolicy.cs tests/ARSAS.Tests/VisualSystemP0RegressionTests.cs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml SasOperationalUiPolicy.cs tests/ARSAS.Tests/VisualSystemP0RegressionTests.cs
          git commit -m "Align P0 nav bootstrap with responsive authority"
          git push origin HEAD:polish/p0-visual-system-unification
