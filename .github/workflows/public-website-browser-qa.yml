name: Public website browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - "landing/**"
      - "scripts/test-public-browser-qa.py"
      - ".github/workflows/public-website-browser-qa.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "scripts/test-public-browser-qa.py"
      - ".github/workflows/public-website-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Headless Chromium EN-ID visual and keyboard smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright with isolated Chromium
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.56.0" "pillow>=10,<13"
          python -m playwright install --with-deps chromium
      - name: Generate exact public v1.6.42 website
        run: |
          set -euo pipefail
          cp landing/latest.json /tmp/arsas-published.json
          python scripts/build-product-site.py --output _site --release-evidence /tmp/arsas-published.json
          python scripts/generate-privacy-pages.py --output _site --release-evidence /tmp/arsas-published.json --measurement-id ""
          python scripts/build-responsive-media.py _site
          python scripts/inject-site-measurement.py _site --measurement-id ""
      - name: Smoke EN/ID pages on Chromium 360-1920px
        run: |
          set -euo pipefail
          python scripts/test-public-browser-qa.py --site _site --output _browser-qa
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsas-public-site-browser-qa
          path: _browser-qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize browser findings
        if: always()
        run: |
          if test -f _browser-qa/browser-qa.md; then
            cat _browser-qa/browser-qa.md >> "$GITHUB_STEP_SUMMARY"
          fi
