name: Apply timestamp rounding report fix

on:
  push:
    branches:
      - fix/fat-timestamp-rounding
    paths:
      - .github/workflows/apply-timestamp-rounding-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact report timestamp replacements
        shell: pwsh
        run: ./scripts/apply-timestamp-rounding-fix.ps1
