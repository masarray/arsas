name: G1.1 control wording patch

on:
  push:
    branches: [fix/g1-control-correctness]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g1-control-correctness
      - shell: python
        run: |
          from pathlib import Path
          p = Path('Services/Iec61850MonitorRuntime.cs')
          text = p.read_text(encoding='utf-8')
          old = '$"Control intent accepted: {request.Signal.ObjectReference} value={request.ValueText}; test={request.TestMode}; interlock={request.InterlockCheck}; synchro={request.SynchroCheck}; origin={request.OriginCategory}/{request.Originator}."'
          new = '$"Control execution requested: {request.Signal.ObjectReference} value={request.ValueText}; test={request.TestMode}; interlock={request.InterlockCheck}; synchro={request.SynchroCheck}; origin={request.OriginCategory}/{request.Originator}; IED acceptance is determined only from native MMS wire evidence."'
          if text.count(old) != 1:
              raise SystemExit(f'expected one runtime wording occurrence, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          t = Path('tests/ARSAS.Tests/G1ControlCorrectnessRegressionTests.cs')
          test = t.read_text(encoding='utf-8')
          anchor = '        Assert.Contains("CONTROL_REJECTED_BY_IED:", runtime, StringComparison.Ordinal);\n'
          addition = anchor + '        Assert.Contains("Control execution requested:", runtime, StringComparison.Ordinal);\n        Assert.DoesNotContain("Control intent accepted:", runtime, StringComparison.Ordinal);\n'
          if test.count(anchor) != 1:
              raise SystemExit('test anchor missing')
          t.write_text(test.replace(anchor, addition, 1), encoding='utf-8')
          Path('.github/workflows/g11-wording-patch.yml').unlink()
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "G1.1 make IED acceptance wording evidence-based"
          git push origin HEAD:fix/g1-control-correctness
