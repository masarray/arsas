name: Align IED relay build invariant

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-build-guard:
    if: github.event.pull_request.head.ref == 'agent/ied-relay-icon-industrial-qa' && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ied-relay-icon-industrial-qa
          fetch-depth: 0

      - name: Update relay-icon invariant
        shell: pwsh
        run: |
          $path = '.github/workflows/build.yml'
          $text = Get-Content $path -Raw
          $old = @'
              $main -notmatch '<Viewbox Width="44" Height="44" Stretch="Uniform"' -or
'@
          $new = @'
              $main -notmatch '<Viewbox Width="50" Height="50" Stretch="Uniform"' -or
              $main -notmatch 'x:Name="MonitorStateBadge"' -or
              $main -match '<Control\.Effect><DropShadowEffect BlurRadius="5" ShadowDepth="1" Opacity="0\.22" Color="#26313B"/></Control\.Effect>' -or
'@
          if (-not $text.Contains($old)) {
            throw 'The legacy 44x44 relay invariant was not found.'
          }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding utf8

      - name: Verify updated guard against current source
        shell: pwsh
        run: |
          $main = Get-Content MainWindow.xaml -Raw
          if ($main -notmatch '<Viewbox Width="50" Height="50" Stretch="Uniform"' -or
              $main -notmatch 'x:Name="MonitorStateBadge"' -or
              $main -match '<Control\.Effect><DropShadowEffect BlurRadius="5" ShadowDepth="1" Opacity="0\.22" Color="#26313B"/></Control\.Effect>') {
            throw 'The new industrial relay layout does not satisfy the updated invariant.'
          }

      - name: Commit guard update
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/ied-relay-ci-guard-fix.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build.yml .github/workflows/ied-relay-ci-guard-fix.yml
          git commit -m 'ci: align relay icon visual invariant'
          git push origin HEAD:agent/ied-relay-icon-industrial-qa
