name: G1.1 field control patch

on:
  push:
    branches:
      - fix/g1-control-correctness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g1-control-correctness
          fetch-depth: 0
      - name: Apply G1.1 field-derived patch
        shell: python
        run: |
          from pathlib import Path
          import json, re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_regex(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex replacement count={count}')
              p.write_text(updated, encoding='utf-8')

          # Manual workstation commands are station-level operator controls, not maintenance-tool controls.
          replace_once(
              'Models/ControlModels.cs',
              'public string OriginCategory { get; init; } = "Maintenance";',
              'public string OriginCategory { get; init; } = "StationControl";')

          replace_once(
              'ControlCommandWindow.xaml.cs',
              'OriginCategory = "Maintenance"',
              'OriginCategory = "StationControl"')

          replace_regex(
              'ControlCommandWindow.xaml.cs',
              r'    private static string BuildCommandResultText\(Iec61850ControlCommandResult result\)\n    \{.*?\n    \}\n\n    private static bool TryExtractNumber',
              '''    private static string BuildCommandResultText(Iec61850ControlCommandResult result)\n    {\n        var details = new List<string>();\n        var rejectedStep = result.WireSteps.FirstOrDefault(step => !step.RequestAccepted);\n        if (rejectedStep != null)\n        {\n            var rejectedStage = rejectedStep.Action.Equals("SelectWithValue", StringComparison.OrdinalIgnoreCase) ? "SBOw" : rejectedStep.Action;\n            details.Add($"IED REJECTED {rejectedStage}: {result.Message}");\n            var operateSent = result.WireSteps.Any(step => step.Action.Equals("Operate", StringComparison.OrdinalIgnoreCase));\n            if (rejectedStage.Equals("SBOw", StringComparison.OrdinalIgnoreCase) && !operateSent)\n            {\n                details.Add("Operate was NOT sent because SBOw selection failed.");\n                details.Add("CommandTermination is not expected because Operate never started.");\n            }\n        }\n        else\n        {\n            details.Add(result.Message);\n        }\n\n        if (result.CompletionState.Equals("NotSent", StringComparison.OrdinalIgnoreCase))\n            details.Add("No MMS control request was sent to the IED.");\n        else if (!string.IsNullOrWhiteSpace(result.ResponseHex))\n            details.Add("MMS request/response wire evidence was captured.");\n        else if (!string.IsNullOrWhiteSpace(result.RequestHex))\n            details.Add("MMS request encoding was captured, but no MMS response was captured.");\n        if (result.WireSteps.Count > 0)\n            details.Add($"Wire sequence: {string.Join(" → ", result.WireSteps.Select(step => step.Action))}.");\n        if (result.CommandTerminationReceived)\n            details.Add(result.PositiveTermination ? "Positive CommandTermination received." : "Negative CommandTermination received.");\n        if (!string.IsNullOrWhiteSpace(result.ControlError))\n            details.Add($"ControlError: {result.ControlError}.");\n        if (!string.IsNullOrWhiteSpace(result.AddCause))\n        {\n            details.Add($"AddCause: {result.AddCause}.");\n            details.Add(ExplainAddCause(result.AddCause));\n        }\n        if (!string.IsNullOrWhiteSpace(result.LastApplErrorText))\n            details.Add(result.LastApplErrorText);\n        if (!string.IsNullOrWhiteSpace(result.ElapsedText) && result.ElapsedText != "-")\n            details.Add($"Control service: {result.ElapsedText}.");\n        if (!string.IsNullOrWhiteSpace(result.FeedbackElapsedText) && result.FeedbackElapsedText != "-")\n            details.Add($"Process feedback: {result.FeedbackElapsedText}.");\n        if (!string.IsNullOrWhiteSpace(result.TotalElapsedText) && result.TotalElapsedText != "-")\n            details.Add($"Total: {result.TotalElapsedText}.");\n        return string.Join(" ", details.Where(text => !string.IsNullOrWhiteSpace(text)));\n    }\n\n    private static string ExplainAddCause(string addCause)\n        => (addCause ?? string.Empty).Trim().ToLowerInvariant() switch\n        {\n            "blocked-by-interlocking" => "IED BLOCKED COMMAND BY INTERLOCKING.",\n            "blocked-by-synchrocheck" => "IED BLOCKED COMMAND BY SYNCHROCHECK.",\n            "blocked-by-mode" => "IED blocked the command because the active control mode does not permit it.",\n            "blocked-by-process" => "IED blocked the command by process conditions.",\n            "blocked-by-health" => "IED blocked the command because of device/process health conditions.",\n            "no-access-authority" => "IED reports that this client/origin has no control access authority.",\n            "not-supported" => "IED reports that the requested control condition/service is not supported.",\n            _ => string.Empty\n        };\n\n    private static bool TryExtractNumber''')

          # Quick command path: remove the false implication that wire send already happened,
          # use station-level origin, and surface the rejected service prominently.
          replace_once(
              'MainWindow.xaml.cs',
              '$"MMS command submitted: {signal.ObjectReference}; sequence={claim.Sequence}; value={claim.RequestedValue}."',
              '$"IEC 61850 control execution started: {signal.ObjectReference}; sequence={claim.Sequence}; value={claim.RequestedValue}; wire send is not assumed until native evidence is returned."')
          replace_once(
              'MainWindow.xaml.cs',
              'OriginCategory = "Maintenance"',
              'OriginCategory = "StationControl"')
          replace_regex(
              'MainWindow.xaml.cs',
              r'    private static string BuildQuickControlResult\(Iec61850ControlCommandResult result\)\n    \{.*?\n    \}\n\n    private async void ControlDetails_Click',
              '''    private static string BuildQuickControlResult(Iec61850ControlCommandResult result)\n    {\n        var timing = new List<string>();\n        if (!string.IsNullOrWhiteSpace(result.ElapsedText) && result.ElapsedText != "-")\n            timing.Add($"control {result.ElapsedText}");\n        if (!string.IsNullOrWhiteSpace(result.FeedbackElapsedText) && result.FeedbackElapsedText != "-")\n            timing.Add($"feedback {result.FeedbackElapsedText}");\n        var suffix = timing.Count == 0 ? string.Empty : $" • {string.Join(" • ", timing)}";\n\n        if (!result.IsSuccess)\n        {\n            var rejectedStep = result.WireSteps.FirstOrDefault(step => !step.RequestAccepted);\n            if (rejectedStep != null)\n            {\n                var stage = rejectedStep.Action.Equals("SelectWithValue", StringComparison.OrdinalIgnoreCase) ? "SBOw" : rejectedStep.Action;\n                var operateSent = result.WireSteps.Any(step => step.Action.Equals("Operate", StringComparison.OrdinalIgnoreCase));\n                var stopped = stage.Equals("SBOw", StringComparison.OrdinalIgnoreCase) && !operateSent\n                    ? " • Operate NOT sent"\n                    : string.Empty;\n                var cause = string.IsNullOrWhiteSpace(result.AddCause) ? string.Empty : $" • AddCause={result.AddCause}";\n                return $"IED REJECTED {stage}: {result.Message}{cause}{stopped}{suffix}";\n            }\n        }\n\n        return result.IsSuccess\n            ? $"{result.Stage}: {result.FeedbackValue}{suffix}"\n            : $"{result.Stage}: {result.Message}{suffix}";\n    }\n\n    private async void ControlDetails_Click''')

          # Invalid/unknown caller category must default to a station-level manual control origin.
          replace_once(
              'Services/NativeIec61850Client.cs',
              ': ArControl.Iec61850OriginCategory.Maintenance;',
              ': ArControl.Iec61850OriginCategory.StationControl;')

          # Runtime diagnostic: expose effective origin and a high-level IED rejection line.
          replace_once(
              'Services/Iec61850MonitorRuntime.cs',
              '$"Control intent accepted: {request.Signal.ObjectReference} value={request.ValueText}; test={request.TestMode}; interlock={request.InterlockCheck}; synchro={request.SynchroCheck}."',
              '$"Control intent accepted: {request.Signal.ObjectReference} value={request.ValueText}; test={request.TestMode}; interlock={request.InterlockCheck}; synchro={request.SynchroCheck}; origin={request.OriginCategory}/{request.Originator}."')

          runtime_marker = '''        Log(result.IsSuccess ? "INFO" : "ERROR", session.Device.Name,\n            $"Control {result.Stage}: {request.Signal.ObjectReference}; sequence={result.SequenceText}; requested={result.RequestedValue}; feedback={result.FeedbackValue}; {protocolEvidence}; {result.Message}");\n\n        if (result.WireSteps.Count > 0)'''
          runtime_replacement = '''        Log(result.IsSuccess ? "INFO" : "ERROR", session.Device.Name,\n            $"Control {result.Stage}: {request.Signal.ObjectReference}; sequence={result.SequenceText}; requested={result.RequestedValue}; feedback={result.FeedbackValue}; {protocolEvidence}; {result.Message}");\n\n        var rejectedWireStep = result.WireSteps.FirstOrDefault(step => !step.RequestAccepted);\n        if (rejectedWireStep != null)\n        {\n            var rejectedStage = rejectedWireStep.Action.Equals("SelectWithValue", StringComparison.OrdinalIgnoreCase)\n                ? "SBOw"\n                : rejectedWireStep.Action;\n            var operateSent = result.WireSteps.Any(step => step.Action.Equals("Operate", StringComparison.OrdinalIgnoreCase));\n            Log("ERROR", session.Device.Name,\n                $"CONTROL_REJECTED_BY_IED: stage={rejectedStage}; reference={rejectedWireStep.Reference}; reason={result.Message}; controlError={(string.IsNullOrWhiteSpace(result.ControlError) ? "-" : result.ControlError)}; addCause={(string.IsNullOrWhiteSpace(result.AddCause) ? "-" : result.AddCause)}; OperateSent={operateSent}; origin={request.OriginCategory}/{request.Originator}.");\n        }\n\n        if (result.WireSteps.Count > 0)'''
          replace_once('Services/Iec61850MonitorRuntime.cs', runtime_marker, runtime_replacement)

          # Pin the exact G1.1 engine that names the field MMS DataAccessError.
          lock_path = Path('engines/ARIEC61850.lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['commit'] = 'a18e550d07f7bbe4ff7753c180b02615075f6292'
          lock['sourcePullRequest'] = 90
          if 'G1.1' not in lock['purpose']:
              lock['purpose'] += ' G1.1 decodes MMS Write DataAccessError values explicitly, including physical SIPROTEC SBOw response code 3 as object-access-denied, while preserving unknown numeric vendor codes for diagnostics.'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')

          # Keep G1 regressions tied to field evidence and prevent silent origin/retry regressions.
          test_path = Path('tests/ARSAS.Tests/G1ControlCorrectnessRegressionTests.cs')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('438d14b0dd6dce1b86b9d1c63d6bddd13510b11a', 'a18e550d07f7bbe4ff7753c180b02615075f6292')
          test = test.replace(
              '        Assert.Contains("ordered SBO/SBOw-to-Operate wire evidence", json.GetProperty("purpose").GetString(), StringComparison.OrdinalIgnoreCase);',
              '        Assert.Contains("ordered SBO/SBOw-to-Operate wire evidence", json.GetProperty("purpose").GetString(), StringComparison.OrdinalIgnoreCase);\n        Assert.Contains("object-access-denied", json.GetProperty("purpose").GetString(), StringComparison.OrdinalIgnoreCase);')
          anchor = '''    [Fact]\n    public void G1_DoesNotReenableDynamicReportingOrChangeReconnectPolicy()'''
          inserted = '''    [Fact]\n    public void G11_FieldRejection_IsExplicitAndManualOriginIsStationControl()\n    {\n        var model = File.ReadAllText(Path.Combine(RepoRoot(), "Models", "ControlModels.cs"));\n        var dialog = File.ReadAllText(Path.Combine(RepoRoot(), "ControlCommandWindow.xaml.cs"));\n        var main = File.ReadAllText(Path.Combine(RepoRoot(), "MainWindow.xaml.cs"));\n        var client = File.ReadAllText(Path.Combine(RepoRoot(), "Services", "NativeIec61850Client.cs"));\n        var runtime = File.ReadAllText(Path.Combine(RepoRoot(), "Services", "Iec61850MonitorRuntime.cs"));\n\n        Assert.Contains("OriginCategory { get; init; } = \\"StationControl\\"", model, StringComparison.Ordinal);\n        Assert.Contains("OriginCategory = \\"StationControl\\"", dialog, StringComparison.Ordinal);\n        Assert.Contains("OriginCategory = \\"StationControl\\"", main, StringComparison.Ordinal);\n        Assert.Contains("Iec61850OriginCategory.StationControl", client, StringComparison.Ordinal);\n        Assert.DoesNotContain("MMS command submitted:", main, StringComparison.Ordinal);\n        Assert.Contains("wire send is not assumed until native evidence is returned", main, StringComparison.OrdinalIgnoreCase);\n        Assert.Contains("IED REJECTED SBOw", dialog, StringComparison.Ordinal);\n        Assert.Contains("Operate was NOT sent because SBOw selection failed", dialog, StringComparison.Ordinal);\n        Assert.Contains("IED BLOCKED COMMAND BY INTERLOCKING", dialog, StringComparison.Ordinal);\n        Assert.Contains("IED BLOCKED COMMAND BY SYNCHROCHECK", dialog, StringComparison.Ordinal);\n        Assert.Contains("requested control condition/service is not supported", dialog, StringComparison.Ordinal);\n        Assert.Contains("CONTROL_REJECTED_BY_IED:", runtime, StringComparison.Ordinal);\n        Assert.Contains("OperateSent={operateSent}", runtime, StringComparison.Ordinal);\n        Assert.Contains("origin={request.OriginCategory}/{request.Originator}", runtime, StringComparison.Ordinal);\n        Assert.DoesNotContain("RetryControl", runtime, StringComparison.OrdinalIgnoreCase);\n    }\n\n    [Fact]\n    public void G1_DoesNotReenableDynamicReportingOrChangeReconnectPolicy()'''
          if anchor not in test:
              raise SystemExit('G1 test insertion anchor missing')
          test = test.replace(anchor, inserted, 1)
          test_path.write_text(test, encoding='utf-8')

          # This workflow is an applicator only; remove it from the resulting source commit.
          Path('.github/workflows/g11-field-control-patch.yml').unlink()

      - name: Commit G1.1 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "G1.1 surface IED control rejection and use station origin"
          git push origin HEAD:fix/g1-control-correctness
