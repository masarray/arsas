name: Temporary P0 review fix

on:
  push:
    branches:
      - polish/p0-visual-system-unification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/p0-visual-system-unification
          fetch-depth: 0
      - run: python scripts/fix-p0-review-findings.py
      - run: git diff --check
      - name: Commit reviewed source and tests
        shell: bash
        run: |
          if git diff --quiet -- MainWindow.xaml tests/ARSAS.Tests/VisualSystemP0RegressionTests.cs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml tests/ARSAS.Tests/VisualSystemP0RegressionTests.cs
          git commit -m "Fix P0 visual review findings"
          git push origin HEAD:polish/p0-visual-system-unification
