name: Temporary Live Monitor regression patch

on:
  push:
    branches:
      - fix/live-monitor-regression-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-monitor-regression-audit
          fetch-depth: 0
      - run: python scripts/patch-live-monitor-regression.py
      - run: git diff --check
      - name: Commit regression fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.xaml.cs Services/Iec61850MonitorRuntime.cs
          git commit -m "Restore Live Signal search and fail-safe polling"
          git push origin HEAD:fix/live-monitor-regression-audit
