name: Apply release workflow post-publication hardening

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/patch-release-workflow-post-publication.yml"
      - "scripts/patch_release_workflow_post_publication.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-workflow-post-publication
          fetch-depth: 0

      - name: Apply release workflow hardening
        run: python scripts/patch_release_workflow_post_publication.py

      - name: Commit hardened workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-release-workflow-post-publication.yml
          rm scripts/patch_release_workflow_post_publication.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden release post-publication workflows"
          git push origin HEAD:fix/release-workflow-post-publication
