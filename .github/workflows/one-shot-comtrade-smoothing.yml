name: One-shot COMTRADE smoothing patch

on:
  push:
    branches:
      - fix/comtrade-smooth-scrub-all-workspaces
    paths:
      - .github/scripts/one-shot-comtrade-smoothing.py
      - .github/workflows/one-shot-comtrade-smoothing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout smoothing branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply verified source transformation
        run: python .github/scripts/one-shot-comtrade-smoothing.py
      - name: Verify patch hygiene
        run: |
          git diff --check
          git status --short
      - name: Commit smoothing source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/PresentationEasingMath.cs \
                  Controls/ComtradeDisturbanceView.cs \
                  Controls/ComtradePhasorView.cs \
                  Controls/ComtradeHarmonicsWorkstationView.cs \
                  Controls/ComtradeLocusView.cs \
                  tests/ARSAS.Tests/PresentationEasingMathTests.cs
          git commit -m "perf(comtrade): smooth scrub presentation across workspaces"
          git push origin HEAD:fix/comtrade-smooth-scrub-all-workspaces
