name: Apply rendered portable validation patch

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/patch-validate-product-build-v1.6.20.yml"
      - "scripts/patch_validate_product_build_v1_6_20.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-v1.6.20-public-release
          fetch-depth: 0

      - name: Patch rendered-site portable trust validation
        run: python scripts/patch_validate_product_build_v1_6_20.py

      - name: Commit validator change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-product-build.py
          git diff --cached --check
          git commit -m "fix: validate portable single EXE in rendered site"
          git push origin HEAD:docs/sync-v1.6.20-public-release
