name: Temporary Live Search XAML format fix

on:
  push:
    branches:
      - fix/live-monitor-regression-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-monitor-regression-audit
          fetch-depth: 0
      - run: python scripts/fix-live-search-xaml-format.py
      - run: git diff --check
      - name: Commit XAML correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml
          git commit -m "Fix Live Search signal-count XAML format"
          git push origin HEAD:fix/live-monitor-regression-audit
