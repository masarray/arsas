name: Temporary dark footer contrast patch

on:
  push:
    branches:
      - fix/dark-footer-text-contrast

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dark-footer-text-contrast
          fetch-depth: 0
      - name: Patch two dark footer summaries
        run: python scripts/patch-dark-footer-contrast.py
      - name: Validate diff
        run: git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Footer contrast patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RcbExportFilterWindow.xaml SignalSelectionWizardWindow.xaml
          git commit -m "Improve dark footer text contrast"
          git push origin HEAD:fix/dark-footer-text-contrast
