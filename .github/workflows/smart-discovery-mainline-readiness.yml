name: Smart Discovery Mainline Readiness

on:
  pull_request:
    paths:
      - "*.cs"
      - "**/*.cs"
      - "*.csproj"
      - "**/*.csproj"
      - "*.sln"
      - "**/*.sln"
      - "*.props"
      - "**/*.props"
      - "*.targets"
      - "**/*.targets"
      - "global.json"
      - "*.xaml"
      - "**/*.xaml"
      - "app.manifest"
      - "VERSION"
      - ".release/**"
      - ".github/workflows/**"
      - "Assets/**"
      - "Resources/**"
      - "installer/**"
      - "engine-patches/**"
      - "landing/release-notes*.json"
      - "landing/latest.json"
      - "engines/**"
      - "scripts/**"
      - "tests/**"
      - "evidence/**"
      - "docs/INTEROPERABILITY_REFERENCE_CONTRACT.md"
      - ".github/workflows/smart-discovery-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mainline-readiness:
    name: Require R10 physical authority before mainline review
    runs-on: windows-latest
    steps:
      - name: Checkout ARSAS candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify R10 physical convergence authority
        shell: powershell
        run: |
          $target = Get-Content .\evidence\interoperability-reference-target.json -Raw | ConvertFrom-Json
          $lock = Get-Content .\engines\ARIEC61850.lock.json -Raw | ConvertFrom-Json

          if ($target.status -ne 'physical-retest-passed-merge-ready' -or
              -not [bool]$target.promotion.physicalRetestPassed -or
              [bool]$target.promotion.physicalRetestRequired -or
              -not [bool]$target.promotion.mergeAllowedAfterPhysicalRetest) {
            throw 'R10 physical convergence authority is not in the accepted state.'
          }

          $r10 = $target.physicalEvidence.arsasR10
          foreach ($edition in @($r10.reuseEdition2, $r10.reuseEdition1)) {
            if ([int]$edition.failedReads -ne 0 -or
                [int]$edition.projectionErrors -ne 0 -or
                [int]$edition.cacheLoss -ne 0 -or
                [int]$edition.reportBackedRuntimePoints -ne 58 -or
                [int]$edition.unresolvedRuntimePoints -ne 0 -or
                -not [bool]$edition.actualInformationReportObserved) {
              throw 'R10 trusted-SCL reuse proof regressed.'
            }
          }

          if ($lock.commit -ne $target.activeStack.engineModelAndScl.mainMerge -or
              $lock.commit -ne $r10.testedArtifact.engineMergedMain -or
              $lock.physicalTestedCommit -ne $r10.testedArtifact.engineTestedHead -or
              $lock.mergedMainTree -ne $r10.testedArtifact.engineTree) {
            throw 'ARSAS engine lock no longer matches the R10 physical authority.'
          }

          "ENGINE_REPOSITORY=$($lock.repository)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ENGINE_COMMIT=$($lock.commit)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout exact merged ARIEC61850 authority
        shell: powershell
        run: |
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$env:ENGINE_REPOSITORY.git" ..\ARIEC61850
          git -C ..\ARIEC61850 fetch --quiet --depth 1 origin $env:ENGINE_COMMIT
          git -C ..\ARIEC61850 checkout --quiet --detach $env:ENGINE_COMMIT
          $actual = (git -C ..\ARIEC61850 rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:ENGINE_COMMIT) {
            throw "R10 engine authority mismatch. Expected $env:ENGINE_COMMIT, got $actual."
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate and test merged engine authority
        shell: powershell
        run: |
          dotnet restore ..\ARIEC61850\ARIEC61850.sln
          dotnet build ..\ARIEC61850\ARIEC61850.sln -c Release --no-restore
          dotnet test ..\ARIEC61850\tests\AR.Iec61850.Tests\AR.Iec61850.Tests.csproj -c Release --no-build --no-restore

      - name: Set up Python for canonical regression evidence verification
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require successful canonical Build ARSAS for same PR merge and engine
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          python .\scripts\verify-ci-canonical-reuse.py `
            --repository $env:GITHUB_REPOSITORY `
            --head-branch $env:PR_HEAD_BRANCH `
            --head-sha $env:PR_HEAD_SHA `
            --merge-sha $env:PR_MERGE_SHA `
            --engine-sha $env:ENGINE_COMMIT `
            --wait-seconds 960 `
            --allow-in-progress-artifact `
            --output (Join-Path $env:RUNNER_TEMP 'ci-r10-canonical-reuse.json')
          if ($LASTEXITCODE -ne 0) {
            throw 'R10 Mainline Readiness cannot reuse canonical ARSAS regression evidence.'
          }

      - name: Report independent engine test plus exact ARSAS regression reuse
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $proof = Get-Content (Join-Path $env:RUNNER_TEMP 'ci-r10-canonical-reuse.json') -Raw | ConvertFrom-Json
          if ([int]$proof.failed -ne 0 -or [int]$proof.notExecuted -ne 0 -or
              [int]$proof.passed -lt 1 -or $proof.engineSha -ne $env:ENGINE_COMMIT) {
            throw 'R10 accepted engine/regression evidence is incomplete.'
          }
          @(
            '## R10 Mainline Readiness — independent engine + canonical ARSAS tests',
            '',
            "- R10 engine integration SHA: $env:ENGINE_COMMIT",
            "- canonical Build ARSAS run: $($proof.canonicalRunId)",
            "- exact ARSAS PR merge SHA: $($proof.mergeSha)",
            "- full ARSAS regression: $($proof.passed) passed, $($proof.failed) failed",
            "- canonical proof stage: $($proof.proofStage)",
            "- canonical workflow completed: $($proof.workflowCompleted)",
            "- packaging/smoke proven here: $($proof.packagingSmokeProven)",
            '- Build ARSAS remains the independent packaging/smoke check',
            '- Historical physical authority validated independently before this reuse'
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  manual-regression:
    name: Manual exact-SHA ARSAS regression for R10 readiness
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_ci-p1-windows-build-test.yml
    with:
      source_sha: ${{ github.sha }}
      shadow_mode: true
    secrets: {}
