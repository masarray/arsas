name: Smart Discovery Mainline Readiness

on:
  pull_request:
    paths:
      - "*.cs"
      - "**/*.cs"
      - "*.csproj"
      - "**/*.csproj"
      - "*.sln"
      - "**/*.sln"
      - "*.props"
      - "**/*.props"
      - "*.targets"
      - "**/*.targets"
      - "global.json"
      - "*.xaml"
      - "**/*.xaml"
      - "app.manifest"
      - "VERSION"
      - ".release/**"
      - ".github/workflows/**"
      - "Assets/**"
      - "Resources/**"
      - "installer/**"
      - "engine-patches/**"
      - "landing/release-notes*.json"
      - "landing/latest.json"
      - "engines/**"
      - "scripts/**"
      - "tests/**"
      - "evidence/**"
      - "docs/INTEROPERABILITY_REFERENCE_CONTRACT.md"
      - ".github/workflows/smart-discovery-*.yml"
  workflow_dispatch:

jobs:
  mainline-readiness:
    name: Require R10 physical authority before mainline review
    runs-on: windows-latest
    steps:
      - name: Checkout ARSAS candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify R10 physical convergence authority
        shell: powershell
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          $target = Get-Content .\evidence\interoperability-reference-target.json -Raw | ConvertFrom-Json
          $lock = Get-Content .\engines\ARIEC61850.lock.json -Raw | ConvertFrom-Json

          if ($target.status -ne 'physical-retest-passed-merge-ready' -or
              -not [bool]$target.promotion.physicalRetestPassed -or
              [bool]$target.promotion.physicalRetestRequired -or
              -not [bool]$target.promotion.mergeAllowedAfterPhysicalRetest) {
            throw 'R10 physical convergence authority is not in the accepted state.'
          }

          $r10 = $target.physicalEvidence.arsasR10
          foreach ($edition in @($r10.reuseEdition2, $r10.reuseEdition1)) {
            if ([int]$edition.failedReads -ne 0 -or
                [int]$edition.projectionErrors -ne 0 -or
                [int]$edition.cacheLoss -ne 0 -or
                [int]$edition.reportBackedRuntimePoints -ne 58 -or
                [int]$edition.unresolvedRuntimePoints -ne 0 -or
                -not [bool]$edition.actualInformationReportObserved) {
              throw 'R10 trusted-SCL reuse proof regressed.'
            }
          }

          if ($lock.mergedMainCommit -ne $target.activeStack.engineModelAndScl.mainMerge -or
              $lock.mergedMainCommit -ne $r10.testedArtifact.engineMergedMain -or
              $lock.physicalTestedCommit -ne $r10.testedArtifact.engineTestedHead -or
              $lock.mergedMainTree -ne $r10.testedArtifact.engineTree -or
              $lock.previousStablePin.commit -ne $lock.mergedMainCommit -or
              [int]$lock.previousStablePin.sourcePullRequest -ne 135) {
            throw 'Historical ARSAS engine baseline no longer matches the R10 physical authority.'
          }

          $association = $target.postBaselineAcceptance.sclAssociationInteroperability
          if ($association.contractId -ne 'SCL-ASSOC-PARTIAL-ADDR-PHYSICAL' -or
              $association.status -ne 'physically-accepted-engine-merged-consumer-pending-merge' -or
              -not [bool]$association.preservesR10Baseline -or
              $association.engine.testedHead -ne $lock.sclAssociationInteroperability.testedEngineCommit -or
              [int]$association.engine.pullRequest -ne [int]$lock.sclAssociationInteroperability.sourcePullRequest -or
              [int]$lock.sclAssociationInteroperability.sourcePullRequest -ne 143 -or
              $association.engine.mergedMain -ne $lock.sclAssociationInteroperability.mergedEngineCommit -or
              $association.engine.tree -ne $lock.sclAssociationInteroperability.engineTree -or
              -not [bool]$association.physicalAcceptance.fullDiscoverySkipped -or
              [int]$association.physicalAcceptance.failedReads -ne 0 -or
              [int]$association.physicalAcceptance.projectionErrors -ne 0 -or
              [int]$association.physicalAcceptance.cacheLoss -ne 0 -or
              [int]$association.physicalAcceptance.unresolvedRuntimePoints -ne 0 -or
              -not [bool]$association.physicalAcceptance.actualInformationReportObserved) {
            throw 'Post-baseline SCL association acceptance is missing or inconsistent.'
          }

          $trial = $lock.smartInteroperabilityCodeTrial
          if ($null -ne $trial -and $lock.commit -eq $trial.exactCommit) {
            if ($trial.status -ne 'code-verified-not-physical' -or
                [int]$trial.issue -ne 144 -or
                [int]$trial.integrationPullRequest -ne 148 -or
                [int]$lock.sourcePullRequest -ne [int]$trial.integrationPullRequest -or
                -not [bool]$trial.physicalPromotionRequired) {
              throw 'Smart interoperability code-trial metadata is inconsistent.'
            }

            if ($env:PR_BASE_REF -eq 'main') {
              throw 'CodeVerified smart-interoperability trial cannot pass mainline readiness before fresh physical qualification.'
            }

            Write-Host "Stacked consumer trial accepted for CI against $($trial.exactCommit); historical physical authority remains $($association.engine.testedHead)."
          }
          elseif ($lock.commit -ne $association.engine.testedHead -or
                  [int]$lock.sourcePullRequest -ne 143) {
            throw 'Runtime engine pin is neither the physically accepted authority nor an explicit stacked CodeVerified trial.'
          }

          "ENGINE_REPOSITORY=$($lock.repository)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ENGINE_COMMIT=$($lock.commit)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout exact accepted ARIEC61850 integration authority
        shell: powershell
        run: |
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$env:ENGINE_REPOSITORY.git" ..\ARIEC61850
          git -C ..\ARIEC61850 fetch --quiet --depth 1 origin $env:ENGINE_COMMIT
          git -C ..\ARIEC61850 checkout --quiet --detach $env:ENGINE_COMMIT
          $actual = (git -C ..\ARIEC61850 rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:ENGINE_COMMIT) {
            throw "Accepted engine authority mismatch. Expected $env:ENGINE_COMMIT, got $actual."
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate and test accepted engine authority
        shell: powershell
        run: |
          dotnet restore ..\ARIEC61850\ARIEC61850.sln
          dotnet build ..\ARIEC61850\ARIEC61850.sln -c Release --no-restore
          dotnet test ..\ARIEC61850\tests\AR.Iec61850.Tests\AR.Iec61850.Tests.csproj -c Release --no-build --no-restore

      - name: Build and test ARSAS candidate
        shell: powershell
        run: |
          dotnet restore .\ArIED61850Tester.sln
          dotnet build .\ArIED61850Tester.sln -c Release --no-restore
          dotnet test .\tests\ARSAS.Tests\ARSAS.Tests.csproj -c Release --no-build --no-restore
