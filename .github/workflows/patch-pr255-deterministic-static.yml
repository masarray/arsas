name: Patch PR255 deterministic Static DataSet route

on:
  push:
    branches:
      - fix/static-dataset-report-projection-parity
    paths:
      - .github/workflows/patch-pr255-deterministic-static.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/static-dataset-report-projection-parity
          fetch-depth: 0
      - name: Route Static mode around Hybrid planner
        shell: python
        run: |
          from pathlib import Path
          path = Path('Services/NativeIec61850Client.HybridReporting.cs')
          text = path.read_text(encoding='utf-8')

          before_build = '''        ArgumentNullException.ThrowIfNull(device);\n        ArgumentNullException.ThrowIfNull(points);\n        cancellationToken.ThrowIfCancellationRequested();\n\n        _authoritativeHybridSubscriptions.Clear();'''
          after_build = '''        ArgumentNullException.ThrowIfNull(device);\n        ArgumentNullException.ThrowIfNull(points);\n        cancellationToken.ThrowIfCancellationRequested();\n\n        // Static DataSet is deliberately deterministic: exact configured SCL RCB +\n        // exact live RCB object + ordered live DataSet directory -> RptEna + GI. Do not\n        // send Static mode through adaptive Hybrid availability/capability policy.\n        if (Iec61850MonitoringModeRegistry.IsStaticDataSetReportOnly(device.DeviceId))\n        {\n            return await BuildStaticDataSetReportPlansAsync(\n                device,\n                points,\n                cancellationToken).ConfigureAwait(false);\n        }\n\n        _authoritativeHybridSubscriptions.Clear();'''
          if before_build not in text:
              raise SystemExit('BuildHybrid route anchor not found')
          text = text.replace(before_build, after_build, 1)

          before_start = '''        ArgumentNullException.ThrowIfNull(plan);\n        cancellationToken.ThrowIfCancellationRequested();\n\n        if (!plan.IsEngineAuthoritative)'''
          after_start = '''        ArgumentNullException.ThrowIfNull(plan);\n        cancellationToken.ThrowIfCancellationRequested();\n\n        // Deterministic Static plans are executed directly. Hybrid revalidation can\n        // otherwise discard a valid configured RCB merely because reservation metadata\n        // is incomplete, which is exactly the field regression this path removes.\n        if (_deterministicStaticSubscriptions.ContainsKey(plan.PlanId))\n            return await StartStaticDataSetReportMonitorAsync(plan, cancellationToken).ConfigureAwait(false);\n\n        if (!plan.IsEngineAuthoritative)'''
          if before_start not in text:
              raise SystemExit('StartHybrid route anchor not found')
          text = text.replace(before_start, after_start, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit route patch and remove staging workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-pr255-deterministic-static.yml
          git add Services/NativeIec61850Client.HybridReporting.cs
          git commit -m "Static DataSet: bypass adaptive Hybrid planner"
          git push origin HEAD:fix/static-dataset-report-projection-parity
