name: FAT M5 persistence authority patch

on:
  push:
    branches:
      - fix/fat-workstation-convergence
    paths:
      - tools/fat_m5_authority_patch.py
      - .github/workflows/fat-m5-authority-patch.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fat-workstation-convergence
          fetch-depth: 0
      - name: Apply guarded M5 authority patch
        run: python3 tools/fat_m5_authority_patch.py
      - name: Remove one-shot helpers
        run: rm tools/fat_m5_authority_patch.py .github/workflows/fat-m5-authority-patch.yml
      - name: Commit generated source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/IoTesting/IoTestProjectPersistenceService.cs Services/IoTesting/IoTestWorkspaceBootstrapService.cs tools/fat_m5_authority_patch.py .github/workflows/fat-m5-authority-patch.yml
          git commit -m "M5: bind persisted FAT ownership to Engineering DeviceId"
          git push origin HEAD:fix/fat-workstation-convergence
