name: Temporary Lucide search resource patch

on:
  push:
    branches:
      - fix/live-monitor-regression-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-monitor-regression-audit
          fetch-depth: 0
      - run: python scripts/add-lucide-search-resource.py
      - run: git diff --check
      - name: Commit search resource
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.xaml tests/ARSAS.Tests/LiveMonitorRegressionAuditTests.cs
          git commit -m "Add reusable Lucide search geometry"
          git push origin HEAD:fix/live-monitor-regression-audit
