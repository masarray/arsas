name: FAT M1 canonical shell migration

on:
  push:
    branches:
      - fix/fat-workstation-convergence
    paths:
      - tools/fat_m1_canonicalize.py
      - .github/workflows/fat-m1-canonicalize.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: fix/fat-workstation-convergence
          fetch-depth: 0

      - name: Apply guarded M1 migration
        run: python tools/fat_m1_canonicalize.py

      - name: Remove one-shot migration helpers
        run: |
          rm tools/fat_m1_canonicalize.py
          rm .github/workflows/fat-m1-canonicalize.yml

      - name: Commit canonical shell
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml MainWindow.xaml.cs MainWindow.NativeFatWorkspace.cs tools/fat_m1_canonicalize.py .github/workflows/fat-m1-canonicalize.yml
          git diff --cached --check
          git commit -m "FAT M1: make seven-destination shell canonical"
          git push origin HEAD:fix/fat-workstation-convergence
