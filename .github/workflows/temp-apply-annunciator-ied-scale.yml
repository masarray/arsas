name: Temporary annunciator IED-scale patch

on:
  push:
    branches:
      - feature/annunciator-ied-scale

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/annunciator-ied-scale
          fetch-depth: 0
      - run: python scripts/patch-annunciator-ied-scale.py
      - run: git diff --check
      - name: Commit annunciator layout
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.xaml
          git commit -m "Redesign annunciator for per-IED scalable fascia"
          git push origin HEAD:feature/annunciator-ied-scale
