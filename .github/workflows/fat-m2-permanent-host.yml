name: FAT M2 permanent host migration

on:
  push:
    branches:
      - fix/fat-workstation-convergence
    paths:
      - .github/workflows/fat-m2-permanent-host.yml
      - tools/fat_m2_permanent_host.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: fix/fat-workstation-convergence
          fetch-depth: 0

      - name: Apply guarded M2 migration
        run: python tools/fat_m2_permanent_host.py

      - name: Remove one-shot migration helpers
        run: |
          rm tools/fat_m2_permanent_host.py
          rm .github/workflows/fat-m2-permanent-host.yml

      - name: Commit M2 source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "feat: complete M2 permanent production FAT host"
          git push origin HEAD:fix/fat-workstation-convergence
