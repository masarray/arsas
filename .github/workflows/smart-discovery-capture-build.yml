name: Smart Discovery Field Capture Build

on:
  pull_request:
    paths:
      - "*.cs"
      - "**/*.cs"
      - "*.csproj"
      - "**/*.csproj"
      - "*.sln"
      - "**/*.sln"
      - "*.props"
      - "**/*.props"
      - "*.targets"
      - "**/*.targets"
      - "global.json"
      - "*.xaml"
      - "**/*.xaml"
      - "app.manifest"
      - "VERSION"
      - ".release/**"
      - ".github/workflows/**"
      - "Assets/**"
      - "Resources/**"
      - "installer/**"
      - "engine-patches/**"
      - "landing/release-notes*.json"
      - "landing/latest.json"
      - "engines/**"
      - "scripts/**"
      - "tests/**"
      - "evidence/**"
      - "docs/INTEROPERABILITY_REFERENCE_CONTRACT.md"
      - ".github/workflows/smart-discovery-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: smart-discovery-field-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manual-regression:
    name: Manual exact-SHA full regression before Field Capture packaging
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_ci-p1-windows-build-test.yml
    with:
      source_sha: ${{ github.sha }}
      shadow_mode: true
    secrets: {}

  build-smart-capture:
    needs: [manual-regression]
    if: >-
      ${{
        always() &&
        (github.event_name != 'workflow_dispatch' ||
         needs.manual-regression.result == 'success')
      }}
    name: Build smart-discovery portable field capture
    runs-on: windows-latest
    steps:
      - name: Checkout exact ARSAS candidate
        uses: actions/checkout@v7
        with:
          path: ArIED61850Tester
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate revision
        shell: powershell
        run: |
          $actual = (git -C .\ArIED61850Tester rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:GITHUB_SHA.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "ARSAS source revision mismatch. Expected $expected, checked out $actual."
          }

      - name: Resolve and validate engine pin
        shell: powershell
        run: |
          $lock = Get-Content .\ArIED61850Tester\engines\ARIEC61850.lock.json -Raw | ConvertFrom-Json
          if ($lock.repository -ne 'masarray/ARIEC61850' -or $lock.commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid ARIEC61850 field-capture pin.'
          }
          $baselineEngineCommit = $lock.previousTrialPin.commit
          if ($baselineEngineCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid physical baseline engine pin.'
          }
          if ($baselineEngineCommit -ne '4467124775d8d9d76f3db194f9fbfd97144767a8') {
            throw "Unexpected engine commit (physical baseline): $baselineEngineCommit"
          }
          $integrationEngineCommit = $lock.commit
          $arsasCommit = (git -C .\ArIED61850Tester rev-parse HEAD).Trim()
          if ($arsasCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid cloned ARSAS commit: $arsasCommit"
          }
          "ARIEC61850_REPOSITORY=$($lock.repository)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ARIEC61850_COMMIT=$integrationEngineCommit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ARIEC61850_BASELINE_COMMIT=$baselineEngineCommit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ARSAS_COMMIT=$arsasCommit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (Get-Content .\ArIED61850Tester\VERSION -Raw).Trim()
          "ARSAS_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ARSAS field source: $arsasCommit"

      - name: Verify P0-5c smart capture sources
        shell: powershell
        run: |
          $helper = Get-Content .\ArIED61850Tester\Services\NativeIec61850Client.SmartDiscoveryCapture.cs -Raw
          $optimization = Get-Content .\ArIED61850Tester\Services\NativeIec61850Client.SmartDiscoveryOptimization.cs -Raw
          $lifecycle = Get-Content .\ArIED61850Tester\Services\NativeIec61850Client.SmartDiscoveryLifecycle.cs -Raw
          $patcher = Get-Content .\ArIED61850Tester\scripts\enable-smart-discovery-capture.ps1 -Raw
          $targets = Get-Content .\ArIED61850Tester\Directory.Build.targets -Raw
          if ($helper -notmatch 'DiscoverSmartSingleFlightAsync' -or
              $helper -notmatch 'LiveIedVariableTypeProbeExecutor' -or
              $helper -notmatch 'variableTypeAttributes' -or
              $helper -notmatch 'SMART-CAPTURE PR134 P0-5c' -or
              $helper -notmatch 'control inventory=authoritative' -or
              $helper -notmatch 'GetOrCreateSmartDiscoveryAssociationFlight' -or
              $helper -notmatch 'flight\.WaitAsync\(cancellationToken\)' -or
              $helper -notmatch '_mmsIoGate\.WaitAsync\(CancellationToken\.None\)' -or
              $helper -notmatch 'ProbeSmartAsync\(_session, discovery\.IedDirectory, smartOptions, CancellationToken\.None\)' -or
              $optimization -notmatch 'TryGetSmartDiscoveryAuthority' -or
              $optimization -notmatch 'BuildSmartCaptureSignalProjection' -or
              $optimization -notmatch 'AddSmartIndexedLogicalNodeFallbacks' -or
              $optimization -notmatch 'IsSmartDiscoveryAuthorityBoundToCurrentAssociation' -or
              $lifecycle -notmatch '_smartDiscoveryAssociationGeneration' -or
              $lifecycle -notmatch '_smartDiscoveryAssociationFlight' -or
              $lifecycle -notmatch 'TryPublishSmartDiscoveryAuthority' -or
              $lifecycle -notmatch 'generation != _smartDiscoveryAssociationGeneration' -or
              $patcher -notmatch '__P0_5C_CONNECT_RESET__' -or
              $patcher -notmatch '__P0_5C_DISPOSE_RESET__' -or
              $patcher -notmatch '_lastDiscovery\.Snapshot\.DomainVariables' -or
              $targets -notmatch 'VerifyPhysicalProvenSmartDiscoveryRoute' -or
              $targets -notmatch '\-VerifyOnly' -or
              $targets -match 'GITHUB_WORKFLOW' -or
              $targets -match 'SmartDiscoveryProductionPromoted') {
            throw 'P0-5c association-scoped enrichment single-flight, authority publication, or lifecycle invalidation is incomplete.'
          }
          if ($helper -match 'ProbeSmartAsync\(_session, discovery\.IedDirectory, smartOptions, cancellationToken\)' -or
              $helper -match 'AddGenericLogicalNodeFallbacksFromDiscoveryArtifacts' -or
              $helper -match 'FinalizeDiscoveredSignals') {
            throw 'P0-5c critical path regressed to caller-cancellable GVA, reflection fallback, or second full finalization.'
          }

      - name: Execute P0-5d wire-proof regressions
        shell: powershell
        run: |
          $verifier = ".\ArIED61850Tester\scripts\verify-smart-discovery-pcap.ps1"
          $contract = ".\ArIED61850Tester\docs\P0-5D_PHYSICAL_CAPTURE_PROOF.md"
          $regression = ".\ArIED61850Tester\tests\ARSAS.Tests\SmartDiscoveryPhysicalCaptureProofRegressionTests.cs"
          foreach ($required in @($verifier, $contract, $regression)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "P0-5d source missing: $required" }
          }

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($verifier, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw "P0-5d verifier has PowerShell parse errors: $($parseErrors | ForEach-Object Message -join '; ')"
          }

          $source = Get-Content $verifier -Raw
          foreach ($token in @(
            'Get-RequestFingerprint',
            'DuplicateSemanticRequests',
            'DuplicateGetNameListRequests',
            'DuplicateGvaRequests',
            'SecondGetNameListSweepDetected',
            'PeakOutstandingRequests',
            'negociatedMaxServOutstandingCalling',
            'ReferencePcapPath',
            'DecodedRowsPath')) {
            if ($source -notmatch [regex]::Escape($token)) { throw "P0-5d verifier contract missing: $token" }
          }

          New-Item -ItemType Directory -Force .\ArIED61850Tester\TestResults | Out-Null
          function New-Row($frame, $src, $dst, $invoke, $request, $response, $gnl, $gva, $domain, $item, $negotiated) {
            [pscustomobject][ordered]@{
              'frame.number' = $frame
              'frame.time_epoch' = "1.$frame"
              'ip.src' = $src
              'ip.dst' = $dst
              'tcp.stream' = '0'
              'mms.invokeID' = $invoke
              'mms.confirmed_requestPDU' = $request
              'mms.confirmed_responsePDU' = $response
              'mms.confirmed_errorPDU' = ''
              'mms.confirmedServiceRequest' = ''
              'mms.getNameList_element' = $gnl
              'mms.getVariableAccessAttributes_element' = $gva
              'mms.getNamedVariableListAttributes_element' = ''
              'mms.read_element' = ''
              'mms.objectClass' = if ($gnl) { '9' } else { '' }
              'mms.objectScope' = if ($gnl) { '1' } else { '' }
              'mms.domainId' = $domain
              'mms.objectName_domain_specific_itemId' = $item
              'mms.getNameList-Request_continueAfter' = ''
              'mms.negociatedMaxServOutstandingCalling' = $negotiated
            }
          }

          $client = '192.0.2.10'
          $server = '192.0.2.20'
          $passRows = @(
            (New-Row 1 $server $client '' '' '' '' '' '' '' '10'),
            (New-Row 2 $client $server '1' '1' '' '1' '' 'LD0' '' ''),
            (New-Row 3 $client $server '2' '1' '' '' '1' 'LD0' 'LLN0$ST$Mod' ''),
            (New-Row 4 $server $client '2' '' '1' '' '' '' '' ''),
            (New-Row 5 $server $client '1' '' '1' '' '' '' '' '')
          )
          $passFixture = '.\ArIED61850Tester\TestResults\p0-5d-pass.tsv'
          $passJson = '.\ArIED61850Tester\TestResults\P0-5D-fixture-pass.json'
          $passRows | Export-Csv -Delimiter "`t" -NoTypeInformation -Encoding utf8 $passFixture
          & $verifier -DecodedRowsPath $passFixture -OutputJson $passJson
          $pass = Get-Content $passJson -Raw | ConvertFrom-Json
          if ($pass.Verdict -ne 'PASS' -or $pass.ArsasCapture.PeakOutstandingRequests -ne 2 -or $pass.ArsasCapture.DuplicateSemanticRequests -ne 0) {
            throw 'P0-5d PASS fixture produced incorrect proof metrics.'
          }

          $failRows = @($passRows)
          $failRows += (New-Row 6 $client $server '3' '1' '' '1' '' 'LD0' '' '')
          $failRows += (New-Row 7 $server $client '3' '' '1' '' '' '' '' '')
          $failFixture = '.\ArIED61850Tester\TestResults\p0-5d-duplicate.tsv'
          $failJson = '.\ArIED61850Tester\TestResults\P0-5D-fixture-duplicate.json'
          $failRows | Export-Csv -Delimiter "`t" -NoTypeInformation -Encoding utf8 $failFixture
          & $verifier -DecodedRowsPath $failFixture -OutputJson $failJson -NoFailExit
          $fail = Get-Content $failJson -Raw | ConvertFrom-Json
          if ($fail.Verdict -ne 'FAIL' -or $fail.ArsasCapture.DuplicateGetNameListRequests -lt 1 -or -not $fail.ArsasCapture.SecondGetNameListSweepDetected) {
            throw 'P0-5d duplicate fixture was not rejected by the semantic wire proof.'
          }

      - name: Checkout immutable ARIEC61850 PR 134 engine
        shell: powershell
        run: |
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$env:ARIEC61850_REPOSITORY.git" ARIEC61850
          git -C .\ARIEC61850 fetch --quiet --depth 1 origin $env:ARIEC61850_COMMIT
          git -C .\ARIEC61850 checkout --quiet --detach $env:ARIEC61850_COMMIT
          $actual = (git -C .\ARIEC61850 rev-parse HEAD).Trim()
          if ($actual -ne $env:ARIEC61850_COMMIT) { throw "Engine SHA mismatch: $actual" }
          $smart = Get-Content .\ARIEC61850\src\AR.Iec61850\Mms\MmsClientSession.SmartDiscovery.cs -Raw
          $singleFlight = Get-Content .\ARIEC61850\src\AR.Iec61850\Mms\MmsClientSession.SmartDiscoverySingleFlight.cs -Raw
          $smartTypes = Get-Content .\ARIEC61850\src\AR.Iec61850\Mms\MmsClientSession.SmartVariableAccessAttributes.cs -Raw
          $controlTransport = Get-Content .\ARIEC61850\src\AR.Iec61850\Control\Iec61850ControlTransport.cs -Raw
          $controlService = Get-Content .\ARIEC61850\src\AR.Iec61850\Control\Iec61850ControlService.cs -Raw
          $controlTest = Get-Content .\ARIEC61850\tests\AR.Iec61850.Tests\Control\AuthoritativeControlInventoryTests.cs -Raw
          $hierarchy = Get-Content .\ARIEC61850\src\AR.Iec61850\Discovery\LiveIedVariableTypeHierarchy.cs -Raw
          if ($smart -notmatch 'DiscoverSmartAsync' -or
              $singleFlight -notmatch 'DiscoverSmartSingleFlightAsync' -or
              $singleFlight -notmatch 'GetAuthoritativeDomainVariableNamesAsync' -or
              $singleFlight -notmatch 'WaitAsync\(cancellationToken\)' -or
              $singleFlight -notmatch 'incompleteChains=0' -or
              $smartTypes -notmatch 'LastSmartTypeProbeBudget' -or
              $smartTypes -notmatch 'SuppressedNonLiveLogicalNodeCandidates' -or
              $smartTypes -notmatch 'SuppressedExactRepeatRequests' -or
              $smartTypes -notmatch 'BuildUnprobedExactFallbacks' -or
              $controlTransport -notmatch 'GetAuthoritativeDomainVariableNamesAsync' -or
              $controlTransport -match '=> _session\.DiscoverDomainVariableNamesAsync\(cancellationToken\)' -or
              $controlService -notmatch 'authoritativeDomainVariables' -or
              $controlService -notmatch 'domainInventory=authoritative-reuse' -or
              $controlTest -notmatch 'DoesNotBrowseDomainVariablesAgain' -or
              $hierarchy -notmatch 'ProbeSmartAsync') {
            throw 'Pinned P0-5b engine does not expose the required smart discovery, hierarchy-budget, and authoritative-Control invariants.'
          }

      - name: Verify smart route and association lifecycle resets before packaging
        shell: powershell
        run: |
          $native = Get-Content .\ArIED61850Tester\Services\NativeIec61850Client.cs -Raw
          if ($native -notmatch 'return await DiscoverSignalsSmartForCaptureAsync\(cancellationToken, progress\)') {
            throw 'Field Capture smart discovery route is not installed.'
          }
          if ($native -notmatch '_lastDiscovery = null;\s*_liveModel = null;\s*ResetSmartDiscoveryAuthority\(\);\s*// __P0_5C_CONNECT_RESET__') {
            throw 'P0-5c ConnectAsync association-generation reset was not installed.'
          }
          if ($native -notmatch 'public async ValueTask DisposeAsync\(\)\s*\{\s*ResetSmartDiscoveryAuthority\(\);\s*// __P0_5C_DISPOSE_RESET__') {
            throw 'P0-5c DisposeAsync association-generation reset was not installed.'
          }
          if ($native -notmatch 'service\.OpenAsync\(_session, signal\.ObjectReference, _lastDiscovery\.Snapshot\.DomainVariables, cancellationToken\)') {
            throw 'Field Capture Control path does not consume the authoritative smart domain inventory.'
          }

      - name: Setup Python for canonical regression evidence
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run offline canonical evidence safety fixtures
        if: github.event_name == 'pull_request'
        run: python .\ArIED61850Tester\scripts\test-ci-canonical-reuse.py

      - name: Reuse exact canonical ARSAS full regression
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          $proofPath = '.\ArIED61850Tester\TestResults\ci-smart-capture-canonical-proof.json'
          python .\ArIED61850Tester\scripts\verify-ci-canonical-reuse.py `
            --repository $env:GITHUB_REPOSITORY `
            --head-branch $env:PR_HEAD_BRANCH `
            --head-sha $env:PR_HEAD_SHA `
            --merge-sha $env:PR_MERGE_SHA `
            --engine-sha $env:ARIEC61850_COMMIT `
            --wait-seconds 960 `
            --allow-in-progress-artifact `
            --output $proofPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Field Capture requires exact canonical ARSAS full-regression evidence.'
          }

          $proof = Get-Content $proofPath -Raw | ConvertFrom-Json
          if ($proof.mergeSha -ne $env:PR_MERGE_SHA -or
              $proof.engineSha -ne $env:ARIEC61850_COMMIT -or
              [int]$proof.failed -ne 0 -or
              [int]$proof.notExecuted -ne 0 -or
              [int]$proof.passed -lt 1) {
            throw 'Field Capture canonical regression proof is incomplete.'
          }
          "SMART_CAPTURE_REGRESSION_AUTHORITY=canonical-build-arsas:$($proof.canonicalRunId)/$($proof.canonicalRunAttempt)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMART_CAPTURE_CANONICAL_RUN_ID=$($proof.canonicalRunId)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMART_CAPTURE_CANONICAL_RUN_ATTEMPT=$($proof.canonicalRunAttempt)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Promote exact canonical portable artifact
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactName = 'ARSAS-win-x64-portable-single-exe'
          $deadline = (Get-Date).AddMinutes(5)
          $artifact = $null

          do {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SMART_CAPTURE_CANONICAL_RUN_ID/artifacts?per_page=100"
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not query canonical Build ARSAS artifacts.'
            }
            $payload = $json | ConvertFrom-Json
            $matches = @($payload.artifacts | Where-Object {
              $_.name -eq $artifactName -and -not [bool]$_.expired
            })
            if ($matches.Count -gt 1) {
              throw 'Canonical Build ARSAS produced duplicate portable artifacts.'
            }
            if ($matches.Count -eq 1) {
              $artifact = $matches[0]
              break
            }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)

          if ($null -eq $artifact) {
            throw 'Timed out waiting for exact canonical portable artifact.'
          }

          $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SMART_CAPTURE_CANONICAL_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not revalidate canonical Build ARSAS run.' }
          $run = $runJson | ConvertFrom-Json
          if ($run.name -ne 'Build ARSAS' -or
              $run.event -ne 'pull_request' -or
              $run.head_branch -ne $env:PR_HEAD_BRANCH -or
              $run.head_sha -ne $env:PR_HEAD_SHA -or
              ($run.status -eq 'completed' -and $run.conclusion -ne 'success')) {
            throw 'Canonical portable artifact is not from the exact acceptable Build ARSAS PR run.'
          }

          $downloadRoot = Join-Path $env:RUNNER_TEMP 'arsas-canonical-portable'
          Remove-Item $downloadRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $downloadRoot | Out-Null
          gh run download $env:SMART_CAPTURE_CANONICAL_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name $artifactName `
            --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) { throw 'Canonical portable artifact download failed.' }

          $identities = @(Get-ChildItem $downloadRoot -Recurse -File -Filter '*-portable-build-identity.json')
          $executables = @(Get-ChildItem $downloadRoot -Recurse -File -Filter '*-portable.exe')
          if ($identities.Count -ne 1 -or $executables.Count -ne 1) {
            throw 'Canonical portable artifact must contain exactly one identity and one executable.'
          }

          $identity = Get-Content $identities[0].FullName -Raw | ConvertFrom-Json
          $ardirecLock = Get-Content '.\ArIED61850Tester\engines\ARDIREC.lock.json' -Raw | ConvertFrom-Json
          $actualExeSha = (Get-FileHash $executables[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($identity.schemaVersion -ne 1 -or
              $identity.kind -ne 'arsas-portable-build-identity' -or
              $identity.sourceCommit -ne $env:PR_MERGE_SHA -or
              $identity.engineCommit -ne $env:ARIEC61850_COMMIT -or
              $identity.ardIrecLockCommit -ne $ardirecLock.commit -or
              $identity.portableSha256 -ne $actualExeSha -or
              [long]$identity.portableSizeBytes -ne [long]$executables[0].Length -or
              $identity.ardIrecBridgeSha256 -notmatch '^[0-9a-f]{64}$' -or
              [long]$identity.ardIrecBridgeSizeBytes -le 0 -or
              -not [bool]$identity.deterministicManagedBuild -or
              -not [bool]$identity.reproducibleNativeLinkRequested) {
            throw 'Canonical portable build identity is incomplete or does not match this Field Capture candidate.'
          }

          $dist = '.\ArIED61850Tester\dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item $executables[0].FullName (Join-Path $dist $executables[0].Name) -Force
          Copy-Item $identities[0].FullName (Join-Path $dist $identities[0].Name) -Force
          "SMART_CAPTURE_PACKAGING_AUTHORITY=canonical-build-arsas:$env:SMART_CAPTURE_CANONICAL_RUN_ID/$env:SMART_CAPTURE_CANONICAL_RUN_ATTEMPT" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record manual reusable regression authority
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          "SMART_CAPTURE_REGRESSION_AUTHORITY=manual-reusable-exact-sha" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SMART_CAPTURE_PACKAGING_AUTHORITY=independent-manual-field-capture-publish" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup .NET 8 for independent Field Capture publish
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish portable single EXE x64
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          .\ArIED61850Tester\scripts\publish-windows-portable.ps1 `
            -Version $env:ARSAS_VERSION `
            -Runtime win-x64 `
            -SingleFile $true `
            -SelfContained $true `
            -EngineProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850\AR.Iec61850.csproj" `
            -NpcapProject "$env:GITHUB_WORKSPACE\ARIEC61850\src\AR.Iec61850.Transports.Npcap\AR.Iec61850.Transports.Npcap.csproj"

      - name: Smoke test portable executable
        shell: powershell
        run: |
          $exe = ".\ArIED61850Tester\dist\ARSAS-$env:ARSAS_VERSION-win-x64-portable.exe"
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Portable EXE missing: $exe" }
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP 'ARSAS-smart-capture-bundle-cache'
          $process = Start-Process -FilePath $exe -ArgumentList @('--portable-smoke-test') -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Portable EXE smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "Portable EXE smoke test failed: $($process.ExitCode)" }
          @(
            "ARSAS smart discovery field-capture build",
            "ARSAS commit: $env:ARSAS_COMMIT",
            "ARIEC61850 commit: $env:ARIEC61850_COMMIT",
            "ARIEC61850 physical baseline commit: $env:ARIEC61850_BASELINE_COMMIT",
            "Engine PR: 134",
            "Regression authority: $env:SMART_CAPTURE_REGRESSION_AUTHORITY",
            "Packaging authority: $env:SMART_CAPTURE_PACKAGING_AUTHORITY",
            "Mode: P0-5e golden capture acceptance over P0-5d physical wire proof, P0-5c association single-flight and P0-5b hierarchy request-budget convergence",
            "CI invariant: duplicate semantic request, duplicate GetNameList/GVA, second naming sweep, invoke-ID reuse and outstanding-window proof logic execute against deterministic fixtures",
            "Golden invariant: production hard budget is derived only from a fresh physical P0-5d PASS plus raw capture/proof SHA-256 provenance",
            "Field invariant: one association capture, zero duplicate semantic confirmed requests, peak outstanding never above negotiated calling limit",
            "Deferred during discovery: supplemental naming, reflection fallback, and adaptive sibling/equipment/reference/unit probes; bounded report/DataSet semantic enrichment remains enabled"
          ) | Set-Content .\ArIED61850Tester\dist\SMART-CAPTURE-BUILD.txt -Encoding utf8

      - name: Upload smart field-capture build
        uses: actions/upload-artifact@v7
        with:
          name: ARSAS-smart-discovery-pr134-win-x64
          path: |
            ArIED61850Tester\dist\ARSAS-*-win-x64-portable.exe
            ArIED61850Tester\dist\ARSAS-*-win-x64-portable-build-identity.json
            ArIED61850Tester\dist\SMART-CAPTURE-BUILD.txt
