name: Apply trusted SCL golden-wire runtime wiring

on:
  push:
    branches:
      - trial/scl-golden-wire-v1636
    paths:
      - .github/workflows/apply-scl-golden-wire-runtime.yml

permissions:
  contents: write

jobs:
  apply-runtime-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial/scl-golden-wire-v1636
          fetch-depth: 0

      - name: Apply isolated runtime patch
        run: python scripts/apply-scl-golden-wire-runtime.py

      - name: Commit isolated wiring
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-scl-golden-wire-runtime.yml
          rm -f scripts/apply-scl-golden-wire-runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "trial: wire trusted SCL golden path into runtime"
          git push origin HEAD:trial/scl-golden-wire-v1636
