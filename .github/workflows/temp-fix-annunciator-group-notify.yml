name: Temporary annunciator group notification fix

on:
  push:
    branches:
      - feature/annunciator-ied-scale

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/annunciator-ied-scale
          fetch-depth: 0
      - run: python scripts/fix-annunciator-group-notify.py
      - run: git diff --check
      - name: Commit group notification fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Models/AlarmAnnunciatorModels.cs
          git commit -m "Refresh annunciator IED rail count text"
          git push origin HEAD:feature/annunciator-ied-scale
