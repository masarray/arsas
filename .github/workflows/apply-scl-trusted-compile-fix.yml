name: Apply trusted SCL compile fix

on:
  push:
    branches:
      - trial/scl-golden-wire-v1636
    paths:
      - .github/workflows/apply-scl-trusted-compile-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial/scl-golden-wire-v1636
          fetch-depth: 0
      - name: Apply compile fix
        run: python scripts/fix-scl-trusted-out.py
      - name: Commit fix
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-scl-trusted-compile-fix.yml
          rm -f scripts/fix-scl-trusted-out.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "trial: fix trusted SCL directory out contract"
          git push origin HEAD:trial/scl-golden-wire-v1636
