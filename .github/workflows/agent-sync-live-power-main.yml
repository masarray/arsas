name: Agent sync live power fix to latest main

on:
  push:
    branches:
      - agent/fix-live-power-measurements

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest main locally without committing
        shell: pwsh
        run: |
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          if ($LASTEXITCODE -ne 0) { throw "Latest main did not merge cleanly; refusing automatic sync." }

      - name: Resolve and checkout latest locked ARIEC61850 engine
        shell: pwsh
        run: |
          $lock = Get-Content .\engines\ARIEC61850.lock.json -Raw | ConvertFrom-Json
          if ($lock.repository -notmatch '^[^/]+/[^/]+$' -or $lock.ref -ne 'main' -or $lock.commit -notmatch '^[0-9a-f]{40}$') { throw "Invalid engine lock after main sync" }
          $enginePath = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "ARIEC61850"
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$($lock.repository).git" $enginePath
          git -C $enginePath fetch --quiet --depth 1 origin $lock.commit
          git -C $enginePath checkout --quiet --detach $lock.commit
          if ((git -C $enginePath rev-parse HEAD).Trim() -ne $lock.commit) { throw "Engine pin mismatch after main sync" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate targeted power behavior on latest main
        shell: pwsh
        run: dotnet test tests/ARSAS.Tests/ARSAS.Tests.csproj --configuration Release --filter FullyQualifiedName~LivePowerMeasurementRegressionTests

      - name: Validate complete ARSAS suite on latest main
        shell: pwsh
        run: dotnet test tests/ARSAS.Tests/ARSAS.Tests.csproj --configuration Release --no-restore

      - name: Publish validated merge commit only after green tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-sync-live-power-main.yml
          git diff --cached --check
          git status --short
          git commit -m "Merge latest main into live power fix"
          git push origin HEAD:agent/fix-live-power-measurements
