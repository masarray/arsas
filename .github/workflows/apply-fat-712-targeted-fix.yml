          test = r'''using ArIED61850Tester.Models;
using ArIED61850Tester.Models.IoTesting;
using ArIED61850Tester.Services.IoTesting;

namespace ARSAS.Tests;

public sealed class FatTargetedFourFixRegressionTests
{
    [Fact]
    public void FormattingOnlyBooleanUpdate_DoesNotRepaintMonitorValue()
    {
        var point = new Iec61850MonitorPoint();
        Assert.False(point.ApplyProcessValue("false"));
        var valueNotifications = 0;
        point.PropertyChanged += (_, e) => { if (e.PropertyName == nameof(Iec61850MonitorPoint.Value)) valueNotifications++; };
        Assert.False(point.ApplyProcessValue("False"));
        Assert.Equal("false", point.Value);
        Assert.Equal(0, valueNotifications);
    }

    [Fact]
    public void EngineeringCommandDefaults_EnableInterlockAndSynchrocheck()
    {
        var signal = new SignalDefinition();
        Assert.True(signal.ControlInterlockCheck);
        Assert.True(signal.ControlSynchroCheck);
        var request = new Iec61850ControlCommandRequest { Signal = signal };
        Assert.True(request.InterlockCheck);
        Assert.True(request.SynchroCheck);
    }

    [Fact]
    public void FatLiveValue_FollowsBoundMonitorPointWithoutRunningEvidenceSession()
    {
        const string reference = "IEDLD0/GGIO1.CBClsd.stVal";
        var project = new IoTestProject { ProjectId = "LIVE", SchemaVersion = "ARSAS-FAT-IO-1.0", ProjectName = "Live", Ieds = { new IoTestIedPlan { IedName = "IED", IpAddress = "192.168.1.10", TestPoints = { new IoTestPointPlan { TestPointId = "TP-1", IedName = "IED", IpAddress = "192.168.1.10", SignalName = "CB closed", ObjectReference = reference, FunctionalConstraint = "ST", ExpectedOnText = "Closed", ExpectedOffText = "Open", WorkspaceSelected = true, TestEnabled = true, ImportReady = true } } } } };
        project.InitializeRuntimeNotifications();
        var device = new Iec61850MonitorDevice { Name = "IED", SclIedName = "IED", IpAddress = "192.168.1.10", Status = "Ready" };
        var live = new Iec61850MonitorPoint { DeviceId = device.DeviceId, DeviceName = device.Name, IpAddress = device.IpAddress, SignalName = "CB closed", IecReference = reference, FunctionalConstraint = "ST", Value = "Open", Quality = "Good", SourceMode = "BRCB" };
        device.Points.Add(live);
        var summary = new IoTestLiveBindingService().Bind(project, new[] { device });
        var fatPoint = project.Ieds[0].TestPoints[0];
        Assert.Equal(1, summary.LivePointCount);
        Assert.Equal("Open", fatPoint.Runtime.CurrentValue);
        live.ApplyProcessValue("Closed");
        Assert.Equal("Closed", fatPoint.Runtime.CurrentValue);
    }

    [Fact]
    public void AnalogAutoCapture_RemainsArmedForStableLiveValues()
    {
        var point = new IoTestPointPlan { TestPointId = "AN-1", IedName = "IED", IpAddress = "192.168.1.10", SignalName = "Current A", ObjectReference = "IEDLD0/MMXU1.A.phsA.cVal.mag.f", FunctionalConstraint = "MX", ExpectedOnText = "", ExpectedOffText = "", SignalKind = FatSignalKind.Analog, CaptureMode = FatCaptureMode.OperatorSnapshot, WorkspaceSelected = true, TestEnabled = true, ImportReady = true };
        var coordinator = new FatAutoCaptureCoordinator();
        FatAutoCaptureDecision decision = default!;
        for (var sequence = 1L; sequence <= FatAutoCaptureCoordinator.AnalogStableSampleCount; sequence++)
            decision = coordinator.Observe(point, new IoTestObservation(null, "65.748", DateTimeOffset.UtcNow, null, "Good", "BRCB", sequence, 1));
        Assert.NotNull(decision.Evidence);
        Assert.Equal(FatValueSlot.Value1, decision.Evidence!.Slot);
        Assert.Equal("65.748", decision.Evidence.RawValue);
    }
}
'''
