    {
        var next = string.IsNullOrWhiteSpace(value) ? "-" : value.Trim();
        var previous = Value;
        Value = next;
        return IsInitializedProcessValue(previous) &&
               IsInitializedProcessValue(next) &&
               !AreSemanticallyEquivalent(previous, next);
    }

    private static bool IsInitializedProcessValue(string? value)
''', '''    public bool ApplyProcessValue(string? value)
    {
        var next = string.IsNullOrWhiteSpace(value) ? "-" : value.Trim();
        var previous = Value;
        var previousInitialized = IsInitializedProcessValue(previous);
        var nextInitialized = IsInitializedProcessValue(next);

        // Do not repaint a process value when only its presentation changes, e.g. false -> False.
        if (previousInitialized && nextInitialized && AreSemanticallyEquivalent(previous, next))
            return false;

        Value = next;
        return previousInitialized && nextInitialized;
    }

    internal static bool IsInitializedProcessValue(string? value)
''')

