    public string CurrentQuality { get => _currentQuality; internal set => Set(ref _currentQuality, string.IsNullOrWhiteSpace(value) ? "Unknown" : value.Trim()); }
    public string CurrentSource { get => _currentSource; internal set => Set(ref _currentSource, string.IsNullOrWhiteSpace(value) ? "Unknown" : value.Trim()); }

    [JsonIgnore]
    public string CurrentIedTimestamp
    {
        get => _currentIedTimestamp;
        internal set => Set(ref _currentIedTimestamp, string.IsNullOrWhiteSpace(value) ? "—" : value.Trim());
    }

    // FAT LIVE VALUE follows the authoritative Engineering monitor point even when no
    // evidence session is running. PropertyChangedEventManager keeps this subscription weak.
    internal void AttachLivePoint(Iec61850MonitorPoint? livePoint)
    {
        if (ReferenceEquals(_livePoint, livePoint))
        {
            ApplyLivePointSnapshot();
            return;
        }
        if (_livePoint != null)
            PropertyChangedEventManager.RemoveHandler(_livePoint, LivePoint_PropertyChanged, string.Empty);
        _livePoint = livePoint;
        if (_livePoint != null)
            PropertyChangedEventManager.AddHandler(_livePoint, LivePoint_PropertyChanged, string.Empty);
        ApplyLivePointSnapshot();
    }

    private void LivePoint_PropertyChanged(object? sender, PropertyChangedEventArgs e)
    {
        if (!ReferenceEquals(sender, _livePoint) || _livePoint == null)
            return;
        if (string.IsNullOrEmpty(e.PropertyName) || e.PropertyName == nameof(Iec61850MonitorPoint.Value))
            CurrentValue = _livePoint.Value;
        if (string.IsNullOrEmpty(e.PropertyName) || e.PropertyName == nameof(Iec61850MonitorPoint.Quality))
            CurrentQuality = _livePoint.Quality;
        if (string.IsNullOrEmpty(e.PropertyName) || e.PropertyName == nameof(Iec61850MonitorPoint.SourceMode))
            CurrentSource = _livePoint.SourceMode;
        if (string.IsNullOrEmpty(e.PropertyName) || e.PropertyName == nameof(Iec61850MonitorPoint.DeviceTimestamp))
            CurrentIedTimestamp = NormalizeLiveTimestamp(_livePoint.DeviceTimestamp);
    }

    private void ApplyLivePointSnapshot()
    {
        if (_livePoint == null)
            return;
        CurrentValue = _livePoint.Value;
        CurrentQuality = _livePoint.Quality;
        CurrentSource = _livePoint.SourceMode;
        CurrentIedTimestamp = NormalizeLiveTimestamp(_livePoint.DeviceTimestamp);
    }

    private static string NormalizeLiveTimestamp(string? value)
        => string.IsNullOrWhiteSpace(value) || value.Trim() == "-" ? "—" : value.Trim();
