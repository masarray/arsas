name: Apply isolated FAT 712 recovery patch

on:
  push:
    branches:
      - fix/fat-712-targeted-four-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              raw = p.read_bytes()
              text = raw.decode('utf-8')
              nl = '\r\n' if '\r\n' in text else '\n'
              old_n = old.replace('\n', nl)
              new_n = new.replace('\n', nl)
              actual = text.count(old_n)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} match(es), found {actual}')
              p.write_bytes(text.replace(old_n, new_n, count).encode('utf-8'))

